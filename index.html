<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>My Ledger — Personal Finance</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root{
    --bg:#F7F2E6; --card:#FFFDF8; --border:#E7DFCB; --border2:#D8CFB6;
    --ink:#221E1B; --muted:#79705F; --placeholder:#ABA18C;
    --green:#1B4332; --green-deep:#143529; --green-light:#2D6A4F; --gold:#C9A227; --gold-soft:#D9B84A; --red:#8B2E2E;
    --blue:#2D5F8B; --purple:#5B4A82;
    --on-primary:#FAF6EC; --hover:rgba(27,67,50,0.05);
    --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: 'SF Mono', 'Roboto Mono', Consolas, monospace;
    --radius:14px; --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(36,26,10,0.04), 0 2px 6px rgba(36,26,10,0.05);
    --shadow-md:0 4px 14px rgba(27,67,50,0.08), 0 1px 3px rgba(36,26,10,0.06);
    --shadow-lg:0 12px 34px rgba(27,67,50,0.14);
    --ease:cubic-bezier(.4,0,.2,1);
  }
  /* ============ Themes (override color tokens only) ============ */
  /* Dark Elegant — charcoal + emerald + gold */
  [data-theme="dark"]{
    --bg:#15181B; --card:#1E2429; --border:#2C333A; --border2:#3B444D;
    --ink:#E9E7E1; --muted:#9BA1A7; --placeholder:#6C7278;
    --green:#2F8A63; --green-deep:#24694C; --green-light:#54C08C; --gold:#D4AF37; --gold-soft:#E6C860; --red:#E0776E;
    --blue:#5B9BD5; --purple:#A18BD1;
    --on-primary:#F3F7F4; --hover:rgba(255,255,255,0.06);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.3), 0 2px 6px rgba(0,0,0,0.25);
    --shadow-md:0 4px 14px rgba(0,0,0,0.4), 0 1px 3px rgba(0,0,0,0.3);
    --shadow-lg:0 12px 34px rgba(0,0,0,0.5);
  }
  /* Midnight Blue — deep navy + sapphire + gold */
  [data-theme="midnight"]{
    --bg:#0F1626; --card:#182238; --border:#26324A; --border2:#37455F;
    --ink:#E6EAF2; --muted:#9AA6BC; --placeholder:#66738C;
    --green:#3E6FB0; --green-deep:#2F568A; --green-light:#6AA0DC; --gold:#E0B84B; --gold-soft:#EFCD6B; --red:#E07A78;
    --blue:#6AA0DC; --purple:#9B8CD6;
    --on-primary:#F2F6FC; --hover:rgba(255,255,255,0.06);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.28);
    --shadow-md:0 4px 14px rgba(0,0,0,0.45), 0 1px 3px rgba(0,0,0,0.3);
    --shadow-lg:0 12px 34px rgba(0,0,0,0.55);
  }
  /* Slate — cool light gray + steel blue */
  [data-theme="slate"]{
    --bg:#EEF1F5; --card:#FFFFFF; --border:#DDE3EA; --border2:#C6CFDA;
    --ink:#1F2933; --muted:#5B6773; --placeholder:#9AA5B1;
    --green:#2C5F7C; --green-deep:#21495F; --green-light:#3E86A8; --gold:#C08A2E; --gold-soft:#D5A64C; --red:#B3413B;
    --blue:#3E86A8; --purple:#6C5C9B;
    --on-primary:#F6F9FB; --hover:rgba(44,95,124,0.06);
    --shadow-sm:0 1px 2px rgba(31,41,51,0.05), 0 2px 6px rgba(31,41,51,0.06);
    --shadow-md:0 4px 14px rgba(44,95,124,0.1), 0 1px 3px rgba(31,41,51,0.06);
    --shadow-lg:0 12px 34px rgba(44,95,124,0.16);
  }
  /* Rose — warm blush + burgundy + gold */
  [data-theme="rose"]{
    --bg:#FBF1EE; --card:#FFFAF8; --border:#F0DAD3; --border2:#E6C4BB;
    --ink:#2B211F; --muted:#8A6F68; --placeholder:#BCA098;
    --green:#8E3B52; --green-deep:#732E42; --green-light:#B85C74; --gold:#C89A3E; --gold-soft:#DBB25C; --red:#B23A3A;
    --blue:#5C7C9B; --purple:#8B5C82;
    --on-primary:#FCF2F0; --hover:rgba(142,59,82,0.06);
    --shadow-sm:0 1px 2px rgba(80,30,40,0.05), 0 2px 6px rgba(80,30,40,0.06);
    --shadow-md:0 4px 14px rgba(142,59,82,0.1), 0 1px 3px rgba(80,30,40,0.06);
    --shadow-lg:0 12px 34px rgba(142,59,82,0.16);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);padding-bottom:70px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;line-height:1.45;letter-spacing:.1px;}
  button{cursor:pointer;font-family:var(--sans);transition:transform .12s var(--ease), background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease), box-shadow .18s var(--ease), opacity .18s var(--ease);}
  button:active{transform:translateY(1px);}
  input,select,textarea{font-family:var(--sans);transition:border-color .16s var(--ease), box-shadow .16s var(--ease), background .16s var(--ease);}
  ::placeholder{color:var(--placeholder);}
  .amt{font-family:var(--mono);font-feature-settings:"tnum" 1;letter-spacing:-.2px;}
  a{color:inherit;}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important;} }

  header.top{position:relative;background:linear-gradient(160deg, var(--green) 0%, var(--green-deep) 100%);color:var(--on-primary);padding:26px 20px 78px;overflow:hidden;}
  header.top::after{content:"";position:absolute;top:-40%;right:-6%;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle, rgba(201,162,39,0.16) 0%, rgba(201,162,39,0) 68%);pointer-events:none;}
  .wrap{max-width:960px;margin:0 auto;position:relative;}
  .eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-family:var(--serif);font-size:13px;letter-spacing:1.8px;color:var(--gold-soft);text-transform:uppercase;}
  h1.title{font-family:var(--serif);font-size:28px;margin:4px 0 0;font-weight:500;letter-spacing:.2px;}
  .byline{font-size:12.5px;color:var(--on-primary);opacity:.68;margin-top:6px;letter-spacing:.4px;font-style:italic;}
  .backup-link{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.32);color:var(--on-primary);border-radius:9px;padding:6px 12px;font-size:12.5px;float:right;margin-top:2px;backdrop-filter:blur(4px);}
  .backup-link:hover{background:rgba(255,255,255,0.18);border-color:rgba(255,255,255,0.55);}

  .networth{margin:-42px auto 0;padding:0 20px;max-width:960px;position:relative;z-index:2;}
  .networth-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px 26px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow-lg);flex-wrap:wrap;gap:16px;}
  .nw-label{font-size:11.5px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px;font-weight:600;}
  .nw-value{font-size:31px;font-weight:700;letter-spacing:-.5px;}
  .nw-badge{width:64px;height:64px;border-radius:50%;border:3px double var(--gold);display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);flex-shrink:0;font-size:24px;box-shadow:inset 0 0 0 1px rgba(201,162,39,0.25);}

  .tabbar{max-width:960px;margin:20px auto 0;padding:0 20px;}
  .tabbar-inner{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;}
  .tabbar-inner::-webkit-scrollbar{height:5px;}
  .tabbar-inner::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
  .tab-btn{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:8px 15px;border-radius:22px;font-size:13.5px;font-weight:500;border:1px solid var(--border);background:var(--card);color:var(--muted);box-shadow:var(--shadow-sm);}
  .tab-btn:hover{border-color:var(--green-light);color:var(--green);}
  .tab-btn.active{border-color:var(--green);background:var(--green);color:var(--on-primary);box-shadow:0 3px 10px rgba(27,67,50,0.22);}

  main{max-width:960px;margin:0 auto;padding:24px 20px 0;}
  .section-title{font-family:var(--serif);font-weight:500;font-size:19px;color:var(--green);margin:0 0 13px;letter-spacing:.2px;}
  .row-between{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .empty{border:1.5px dashed var(--border2);border-radius:var(--radius-sm);padding:30px;text-align:center;color:var(--muted);font-size:14px;background:var(--hover);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
  .grid.stat{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;position:relative;box-shadow:var(--shadow-sm);transition:box-shadow .2s var(--ease), transform .2s var(--ease);}
  .card.bordered{border-left:4px solid var(--accent,var(--green));}
  .card.bordered:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
  .acc-card.dragging{opacity:.4;cursor:grabbing;}
  .acc-card.drop-before{box-shadow:-4px 0 0 0 var(--green-light);}
  .stat-card{text-align:left;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:15px;width:100%;box-shadow:var(--shadow-sm);}
  .stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);border-color:var(--border2);}
  .stat-value{font-size:20px;font-weight:700;margin-top:8px;letter-spacing:-.3px;}
  .stat-label{font-size:11.5px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.4px;font-weight:600;}

  .delete-btn{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--muted);}
  .icon-btn{background:none;border:none;color:var(--muted);display:inline-flex;align-items:center;padding:5px;border-radius:7px;}
  .icon-btn:hover{color:var(--green);background:var(--hover);}

  .btn-outline{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--green);color:var(--green);border-radius:9px;padding:8px 14px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-sm);}
  .btn-outline:hover{background:var(--hover);}
  .btn-fill{display:inline-flex;align-items:center;gap:6px;background:var(--green);color:var(--on-primary);border:none;border-radius:9px;padding:8px 14px;font-size:13.5px;font-weight:600;box-shadow:0 2px 8px rgba(27,67,50,0.2);}
  .btn-fill:hover{background:var(--green-deep);}
  .btn-fill:disabled, .btn-outline:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;}
  .btn-submit{width:100%;background:var(--green);color:var(--on-primary);border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;margin-top:4px;box-shadow:0 3px 12px rgba(27,67,50,0.24);letter-spacing:.2px;}
  .btn-submit:hover{background:var(--green-deep);}

  .field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.2px;}
  .field input, .field select{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border2);background:var(--card);font-size:14.5px;color:var(--ink);outline:none;font-weight:400;}
  .field input:focus, .field select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(27,67,50,0.1);}
  .combo{position:relative;}
  .combo-input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border2);background:var(--card);font-size:14.5px;color:var(--ink);outline:none;}
  .combo-input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(27,67,50,0.1);}
  .combo-list{position:absolute;top:calc(100% + 5px);left:0;right:0;max-height:220px;overflow-y:auto;background:var(--card);border:1px solid var(--border2);border-radius:10px;box-shadow:var(--shadow-lg);z-index:60;display:none;}
  .combo-item{padding:11px 13px;font-size:14px;border-bottom:1px solid var(--border);}
  .combo-item:last-child{border-bottom:none;}
  .combo-item:active, .combo-item:hover{background:var(--hover);}
  .combo-empty{padding:11px 13px;font-size:13px;color:var(--muted);}
  .toggle-row{display:flex;gap:8px;}
  .toggle-btn{flex:1;padding:10px 0;border-radius:9px;font-size:14px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--muted);}
  .toggle-btn:hover{border-color:var(--border2);}
  .toggle-btn.active-expense{border-color:var(--red);background:var(--red);color:var(--on-primary);box-shadow:0 2px 8px rgba(139,46,46,0.22);}
  .toggle-btn.active-income{border-color:var(--green-light);background:var(--green-light);color:var(--on-primary);box-shadow:0 2px 8px rgba(45,106,79,0.22);}
  .toggle-btn.active-neutral{border-color:var(--green);background:var(--green);color:var(--on-primary);box-shadow:0 2px 8px rgba(27,67,50,0.22);}

  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .search-box{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border2);border-radius:9px;padding:7px 11px;flex:1 1 180px;color:var(--muted);box-shadow:var(--shadow-sm);}
  .search-box:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(27,67,50,0.1);}
  .search-box input{border:none;outline:none;background:transparent;font-size:13.5px;width:100%;color:var(--ink);}
  .filters select, .filters input[type=date]{padding:9px 12px;border-radius:9px;border:1px solid var(--border2);background:var(--card);font-size:13.5px;color:var(--ink);box-shadow:var(--shadow-sm);}
  .filters select:focus, .filters input[type=date]:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px rgba(27,67,50,0.1);}

  .ledger{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);}
  .ledger-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);transition:background .15s var(--ease);}
  .ledger-row:last-child{border-bottom:none;}
  .ledger-row:hover{background:var(--hover);}
  .ledger-icon{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;}
  .ledger-main{flex:1;min-width:0;}
  .ledger-title{font-size:14.5px;font-weight:600;}
  .ledger-sub{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .ledger-amt{font-size:15.5px;font-weight:700;white-space:nowrap;}

  .progress-track{height:9px;border-radius:6px;background:var(--border);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,0.12);}
  .progress-fill{height:100%;border-radius:6px;transition:width .5s var(--ease);}

  .alert-card{background:var(--card);border-radius:var(--radius-sm);padding:15px;border:1px solid;box-shadow:var(--shadow-sm);}
  .alert-title{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;}
  .alert-body{margin-top:5px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(24,18,9,0.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;overflow-y:auto;animation:overlayIn .2s var(--ease);}
  .modal-box{background:var(--bg);border-radius:var(--radius);padding:26px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,0.3);border:1px solid var(--border);margin:auto;max-height:90vh;overflow-y:auto;animation:modalIn .24s var(--ease);}
  @keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
  @keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.98);}to{opacity:1;transform:none;}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border);}
  .modal-title{font-family:var(--serif);font-weight:500;font-size:20px;color:var(--green);margin:0;}
  .modal-close{background:none;border:none;color:var(--muted);font-size:18px;line-height:1;padding:8px;margin:-8px;display:flex;align-items:center;justify-content:center;border-radius:8px;}
  .modal-close:hover{background:var(--hover);color:var(--ink);}
  form.stack{display:flex;flex-direction:column;gap:15px;}

  .cat-list{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;}
  .cat-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--card);border:1px solid var(--border);border-radius:9px;font-size:14px;box-shadow:var(--shadow-sm);}
  .ai-preview{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--card);box-shadow:var(--shadow-sm);}
  .ai-preview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px;}
  .ai-chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .ai-chip{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:var(--hover);border:1px solid var(--border);font-size:12px;color:var(--muted);}

  /* Chat Assistant UI */
  .chat-view{max-width:840px;margin:0 auto;display:flex;flex-direction:column;height:calc(100vh - 215px);min-height:520px;max-height:800px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);overflow:hidden;}
  .chat-view.in-modal{height:72vh;min-height:480px;max-height:640px;border:none;box-shadow:none;}
  .chat-topbar{padding:12px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--hover);}
  .chat-bot-meta{display:flex;align-items:center;gap:10px;}
  .chat-bot-title{font-family:var(--serif);font-weight:600;font-size:16px;color:var(--green);line-height:1.2;}
  .chat-bot-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .chat-msgs{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px;background:var(--bg);}
  .chat-row{display:flex;gap:10px;max-width:88%;animation:modalIn .2s ease;}
  .chat-row.user{align-self:flex-end;flex-direction:row-reverse;}
  .chat-row.ai{align-self:flex-start;}
  .chat-bubble{padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5;word-break:break-word;}
  .chat-row.user .chat-bubble{background:var(--green);color:var(--on-primary);border-bottom-right-radius:3px;box-shadow:var(--shadow-sm);}
  .chat-row.ai .chat-bubble{background:var(--card);color:var(--ink);border:1px solid var(--border);border-bottom-left-radius:3px;box-shadow:var(--shadow-sm);}
  .chat-time{font-size:10.5px;color:var(--muted);margin-top:4px;text-align:right;}
  .chat-row.ai .chat-time{text-align:left;}
  .chat-tx-box{margin-top:10px;padding:12px;background:var(--hover);border:1px solid var(--border2);border-radius:10px;display:flex;flex-direction:column;gap:8px;}
  .chat-tx-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed var(--border2);padding-bottom:6px;}
  .chat-tx-badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--green-light);}
  .chat-tx-amt{font-size:16px;font-weight:700;}
  .chat-tx-grid{display:grid;grid-template-columns:repeat(2, 1fr);gap:6px;font-size:12px;color:var(--muted);}
  .chat-tx-grid strong{color:var(--ink);font-weight:600;}
  .chat-tx-btn-row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .chat-mini-btn{font-size:11.5px;padding:4px 10px;border-radius:6px;border:1px solid var(--border2);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:4px;}
  .chat-mini-btn:hover{background:var(--hover);border-color:var(--green);}
  .chat-mini-btn.danger:hover{border-color:var(--red);color:var(--red);}
  .chat-chips{display:flex;gap:7px;overflow-x:auto;padding:8px 14px;background:var(--card);border-top:1px solid var(--border);scrollbar-width:none;}
  .chat-chips::-webkit-scrollbar{display:none;}
  .chat-chip-btn{font-size:12px;padding:5px 11px;border-radius:15px;background:var(--hover);border:1px solid var(--border);color:var(--muted);white-space:nowrap;cursor:pointer;transition:all .15s ease;}
  .chat-chip-btn:hover{border-color:var(--green);color:var(--green);background:var(--card);}
  .chat-input-bar{display:flex;gap:8px;padding:12px 14px;background:var(--card);border-top:1px solid var(--border);align-items:center;}
  .chat-input-field{flex:1;padding:10px 14px;border-radius:24px;border:1px solid var(--border2);background:var(--bg);font-size:14px;color:var(--ink);outline:none;transition:border-color .15s ease;}

<script>
/* ---------------- utils ---------------- */
const DEFAULT_EXPENSE_CATS = ["Food","Transport","Rent","Shopping","Bills","Entertainment","Health","Other"];
const DEFAULT_INCOME_CATS = ["Salary","Business","Gift","Investment","Other"];

/* ---------------- theme ---------------- */
const THEME_KEY = "ledger-theme";
const THEMES = [
  { id:"classic",  label:"Classic Cream", swatch:"#1B4332" },
  { id:"dark",     label:"Dark Elegant",  swatch:"#15181B" },

  { id:"slate",    label:"Slate",         swatch:"#2C5F7C" },
  { id:"rose",     label:"Rose",          swatch:"#8E3B52" },
];
function loadTheme(){ try{ return localStorage.getItem(THEME_KEY) || "classic"; }catch(e){ return "classic"; } }
function applyTheme(id){
  if(id && id!=="classic") document.documentElement.setAttribute("data-theme", id);
  else document.documentElement.removeAttribute("data-theme");
}
function setTheme(id){
  try{ localStorage.setItem(THEME_KEY, id); }catch(e){}
  state.theme = id;
  applyTheme(id);
}

/* ---------------- admin safety lock ---------------- */
const ADMIN_PASS_KEY = "ledger-admin-pass-hash";
function simpleHash(text){
  let h = 2166136261;
  for(let i=0;i<text.length;i++){ h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h>>>0).toString(16);
}
function hasAdminPassword(){ try{ return !!localStorage.getItem(ADMIN_PASS_KEY); }catch(e){ return false; } }
function verifyAdminPassword(pass){ try{ return localStorage.getItem(ADMIN_PASS_KEY) === simpleHash(pass); }catch(e){ return false; } }
function requireAdminPassword(reason){
  if(!hasAdminPassword()) return Promise.resolve(true);
  return new Promise((resolve) => {
    state.modal = {
      type: "password-prompt",
      reason: reason || "This change",
      onSuccess: () => {
        state.modal = null;
        render();
        resolve(true);
      },
      onCancel: () => {
        state.modal = null;
        render();
        resolve(false);
      }
    };
    render();
    setTimeout(() => {
      const el = document.getElementById("pass-prompt-input");
      if(el) el.focus();
    }, 50);
  });
}
function setAdminPassword(pass){
  localStorage.setItem(ADMIN_PASS_KEY, simpleHash(pass));
  if(cloud.db && !cloud.applyingRemote) pushToCloud();
}
function clearAdminPassword(){
  localStorage.removeItem(ADMIN_PASS_KEY);
  if(cloud.db && !cloud.applyingRemote) pushToCloud();
}

function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)); }
function taka(n){ const sign = n<0?"-":""; const v = Math.abs(n).toLocaleString("en-IN",{maximumFractionDigits:2}); return sign+"৳"+v; }
function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function monthKey(d){ return d.slice(0,7); }
// Shift a month key ("YYYY-MM") by n months (n can be negative).
function addMonthKey(mk, n){
  let [y,m] = mk.split("-").map(Number);
  const total = (y*12 + (m-1)) + n;
  y = Math.floor(total/12);
  m = (total%12) + 1;
  return y+"-"+String(m).padStart(2,"0");
}
function addMonthKeepDay(dateStr){
  let [y,m,d] = dateStr.split("-").map(Number);
  m += 1; if(m>12){ m=1; y+=1; }
  return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
}
function daysUntil(dateStr){ return Math.ceil((new Date(dateStr) - new Date(todayStr())) / 86400000); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- local AI assistant & chat ---------------- */
const CHAT_STORAGE_KEY = "ledger-ai-chat-messages";
const GEMINI_API_KEY_STORAGE = "ledger-gemini-api-key";
const GEMINI_MODEL_STORAGE = "ledger-gemini-model";
const GEMINI_MODELS = ["gemini-1.5-flash", "gemini-1.5-flash-8b", "gemini-1.5-pro"];
let aiChatBusy = false;

function bnToEnDigits(str){
  const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
  return String(str||"").replace(/[০-৯]/g, d => bnDigits.indexOf(d));
}

function defaultAIAssistantState(){
  return { text:"", parsed:null, errors:[], hints:[], lastSaved:null };
}
function defaultAIDraft(kind){
  return {
    kind: kind || "expense",
    amount: "",
    date: todayStr(),
    bankId: "",
    fromBankId: "",
    toBankId: "",
    category: "",
    note: "",
    fee: ""
  };
}
function aiNormalizedText(text){
  const en = bnToEnDigits(String(text||"").toLowerCase());
  return en.replace(/[.,/#!$%^&*;:{}=\-_`~()?]/g, " ").replace(/\s+/g, " ").trim();
}
function aiEscapeRegex(text){
  return String(text||"").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}
function aiTextHas(text, words){
  return words.some(w => {
    if(!w) return false;
    if(w.includes(" ")) return text.includes(w);
    return new RegExp("(^|\\s)"+aiEscapeRegex(w)+"(?=\\s|$)").test(text);
  });
}
function aiShiftDate(days){
  const d = new Date(todayStr());
  d.setDate(d.getDate() + days);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function aiExtractAmount(text){
  const normalized = bnToEnDigits(String(text||"").toLowerCase());
  // k notation: e.g. 5k, 2.5k, 25k, 100k
  const kMatch = normalized.match(/\b(\d+(?:\.\d+)?)\s*k\b/);
  if(kMatch){
    const v = parseFloat(kMatch[1]);
    if(!isNaN(v)) return v * 1000;
  }
  const matches = normalized.match(/\b\d[\d,]*(?:\.\d+)?\b/g);
  if(!matches || !matches.length) return null;
  // If multiple numbers, look for one directly adjacent to taka/tk/৳/টাকা
  for(const m of matches){
    const num = parseFloat(m.replace(/,/g,""));
    if(!isNaN(num) && num > 0){
      const nearRegex = new RegExp("(?:taka|tk|টাকা|৳|\\/\\-)\\s*"+aiEscapeRegex(m)+"|"+aiEscapeRegex(m)+"\\s*(?:taka|tk|টাকা|৳|\\/\\-)");
      if(nearRegex.test(normalized)) return num;
    }
  }
  const first = parseFloat(matches[0].replace(/,/g,""));
  return isNaN(first) ? null : first;
}
// Optional bank/transfer fee, e.g. "transfer 1000, fee 15" or "15 taka charge".
// Word boundaries keep "mobile recharge 500" from being read as a 500 fee.
function aiExtractFee(text){
  const normalized = bnToEnDigits(String(text||"").toLowerCase());
  const words = "(?:fee|fees|charge|charges|commission|bank fee|service charge|ফি|চার্জ|কমিশন)";
  const patterns = [
    new RegExp("(?:^|\\s)"+words+"(?=\\s|\\d|:|-)[^\\d]{0,8}(\\d+(?:\\.\\d+)?)"),
    new RegExp("(\\d+(?:\\.\\d+)?)\\s*(?:taka|tk|৳|টাকা)?\\s+(?:^|\\s)"+words+"(?=\\s|$)")
  ];
  for(const re of patterns){
    const m = normalized.match(re);
    if(m){
      const v = parseFloat(m[1]);
      if(!isNaN(v) && v > 0) return v;
    }
  }
  return null;
}

// Boundary-aware position of an alias, so "cash" never matches inside "cashback"
// and "city" never matches inside "electricity".
function aiAliasIndex(normalized, raw, alias){
  const a = String(alias||"").toLowerCase().trim();
  if(!a) return -1;
  const safe = aiEscapeRegex(a);
  const pattern = a.includes(" ") ? safe : "(^|\\s)"+safe+"(?=\\s|$)";
  const re = new RegExp(pattern);
  for(const text of [normalized, raw]){
    const m = re.exec(text);
    if(m) return m.index + (m[1] ? m[1].length : 0);
  }
  return -1;
}
function aiFindBankMatches(text){
  const raw = String(text||"").toLowerCase();
  const normalized = aiNormalizedText(text);
  const matches = [];
  state.banks.forEach(bank => {
    const name = bank.name.toLowerCase();
    const compact = name.replace(/\s+/g, "");
    const aliases = [name, compact];
    if(name.includes("cash") || name.includes("wallet") || name.includes("hand")){
      aliases.push("cash", "cashe", "cash-e", "wallet", "হাতে", "ক্যাশ", "ক্যাশে", "পকেট", "pocket");
    }
    if(name.includes("bkash")){
      aliases.push("bkash", "bkashe", "bkash-e", "b kash", "bksh", "বিকাশ", "বিকাশে");
    }
    if(name.includes("nagad")){
      aliases.push("nagad", "nagade", "nagad-e", "নগদ", "নগদে");
    }
    if(name.includes("rocket")){
      aliases.push("rocket", "rockete", "রকেট", "রকেটে");
    }
    if(name.includes("bank") || name.includes("islami") || name.includes("city") || name.includes("brac") || name.includes("dbbl") || name.includes("sonali")){
      aliases.push("bank", "banke", "ব্যাংক", "ব্যাংকে", name.replace(/\bbank\b/g,"").trim());
    }
    let found = null, foundIdx = 9999;
    aliases.filter(Boolean).forEach(alias => {
      const idx = aiAliasIndex(normalized, raw, alias);
      if(idx >= 0 && foundIdx === 9999){
        found = alias;
        foundIdx = idx;
      }
    });
    if(found && !matches.some(m => m.id===bank.id)){
      matches.push({ id:bank.id, name:bank.name, alias:found, index:foundIdx });
    }
  });
  matches.sort((a,b)=>a.index-b.index);
  return matches;
}

    Health:[
      "medicine","doctor","hospital","pharmacy","medical","test","clinic","oushodh","osudh","fees","prescription","dentist",
      "ঔষধ","ওষুধ","ডাক্তার","হাসপাতাল","ফার্মেসি","মেডিকেল","টেস্ট"
    ]
  };

  const categoryByName = categories.find(c => aiTextHas(normalized, [c.toLowerCase()]) || aiTextHas(raw, [c.toLowerCase()]));
  if(categoryByName) return categoryByName;

  for(const category of categories){
    const aliases = (builtIn[category] || []).map(a => a.toLowerCase());
    if(aiTextHas(normalized, aliases) || aiTextHas(raw, aliases)){
      return category;
    }
  }
  return categories[0] || (kind==="income"?"Salary":"Other");
}

function aiCleanNote(rawText, detectedCategory, matchedBankNames){
  let s = String(rawText || "").trim();
  s = bnToEnDigits(s);
  s = s.replace(/\b\d+[\d,]*(?:\.\d+)?\s*(?:k|taka|tk|\/-|টাকা)?\b/gi, " ");
  s = s.replace(/[০-৯]+(?:\.[০-৯]+)?\s*(?:টাকা)?/g, " ");
  s = s.replace(/[.,/#!$%^&*;:{}=\-_`~()?]/g, " ");
  
  const stopWords = new Set([
    "aj", "aaj", "kal", "kaal", "today", "yesterday", "tomorrow", "আজ", "গতকাল", "আগামীকাল",
    "taka", "tk", "টাকা", "টাকার", "diye", "die", "theke", "thekhe", "thekey", "দিলে", "দিয়ে", "থেকে",
    "kinlam", "kinlm", "kinesi", "kinechi", "khoroch", "kharoch", "spent", "paid", "buy", "bought",
    "dilam", "disi", "dichi", "gave", "korlam", "korsi", "korchi", "pelam", "paisi", "peyechi",
    "received", "transfer", "pathalam", "pathano", "পাঠালাম", "কিনলাম", "কিনেছি", "খরচ", "দিলাম",
    "করলাম", "পেলাম", "জমা", "cash", "cashe", "cash-e", "bkash", "bkashe", "nagad", "nagade",
    "rocket", "rockete", "bank", "banke", "ক্যাশ", "ক্যাশে", "বিকাশ", "নগদ", "রকেট", "ব্যাংক",
    "e", "er", "ta", "ti", "for", "on", "in", "and", "kori"
  ]);

  if(matchedBankNames && matchedBankNames.length){
    matchedBankNames.forEach(b => {
      s = s.replace(new RegExp("\\b"+aiEscapeRegex(b.toLowerCase())+"\\b", "gi"), " ");
    });
  }

  const words = s.split(/\s+/).filter(w => {
    const clean = w.toLowerCase().replace(/[^a-z0-9\u0980-\u09FF]/g, "");
    return clean && !stopWords.has(clean);
  });

  if(words.length > 0 && words.length <= 8){
    const cleaned = words.join(" ");
    return cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
  }
  return detectedCategory || "Expense";
}

function aiDetectDate(text){
  const normalized = aiNormalizedText(text);
  const raw = String(text||"").toLowerCase();
  const explicit = normalized.match(/\b(20\d{2}-\d{2}-\d{2})\b/);
  if(explicit) return explicit[1];
  if(aiTextHas(normalized, ["today","aj","aaj"]) || raw.includes("আজ")) return todayStr();
  if(aiTextHas(normalized, ["yesterday","kal","gotokal"]) || raw.includes("গতকাল")) return aiShiftDate(-1);
  if(aiTextHas(normalized, ["tomorrow","agamikal"]) || raw.includes("আগামীকাল")) return aiShiftDate(1);
  return todayStr();
}

function parseNaturalLedgerText(text){
  const raw = String(text||"").trim();
  const normalized = aiNormalizedText(raw);
  const bankMatches = aiFindBankMatches(raw);
  const draft = defaultAIDraft();
  const hints = [];
  const errors = [];
  if(!normalized){ errors.push("Type what happened first."); return { draft, hints, errors, confidence:"low", hasIntent:false }; }

  const transferWords = ["transfer","trnsfer","sent","send","moved","move","pathalam","pathaisi","pathano","transfar","পাঠালাম","পাঠিয়েছি","ট্রান্সফার"];
  const incomeWords = ["salary","income","bonus","refund","cashback","pelam","paisi","peyechi","received","receive","deposit","ay","aay","পেলাম","পেয়েছি","আয়","বেতন","বোনাস","জমা"];
  const expenseWords = ["kinlam","kinlm","kinesi","kinechi","kharoch","khoroch","expense","bought","buy","paid","dilam","disi","dichi","gave","spent","vara","bhara","recharge","বিল","কিনলাম","কিনেছি","খরচ","দিলাম","দিয়েছি","ভাড়া"];

  let kind = "expense";
  if((bankMatches.length >= 2 && (aiTextHas(normalized, ["theke","from","to"]) || raw.includes("থেকে"))) || aiTextHas(normalized, transferWords)) kind = "transfer";
  else if(aiTextHas(normalized, incomeWords) && !aiTextHas(normalized, expenseWords)) kind = "income";

  draft.kind = kind;
  draft.amount = aiExtractAmount(raw) || "";
  draft.date = aiDetectDate(raw);

  if(kind==="transfer"){
    if(bankMatches[0]) draft.fromBankId = bankMatches[0].id;
    if(bankMatches[1]) draft.toBankId = bankMatches[1].id;
    draft.note = aiCleanNote(raw, "Transfer", bankMatches.map(b=>b.name));
    draft.fee = aiExtractFee(raw) || "";
    if(!draft.fromBankId || !draft.toBankId) hints.push("Mention both source and destination accounts for transfers.");
    if(draft.fromBankId && draft.toBankId && draft.fromBankId===draft.toBankId){
      errors.push("Transfer needs two different accounts.");
    }
  } else {
    if(bankMatches[0]) draft.bankId = bankMatches[0].id;
    else if(state.banks.length===1){
      draft.bankId = state.banks[0].id;
      hints.push("Used your only account automatically.");
    } else {
      const cash = state.banks.find(b=>b.name.toLowerCase().includes("cash"));
      if(cash) draft.bankId = cash.id;
      else if(state.banks.length) draft.bankId = state.banks[0].id;
    }
    draft.category = aiFindCategory(raw, kind);
    draft.note = aiCleanNote(raw, draft.category, bankMatches.map(b=>b.name));
  }

  if(!draft.amount) errors.push("I could not find the amount.");
  if(kind!=="transfer" && !draft.bankId && state.banks.length) errors.push("Choose the account before saving.");
  if(kind==="transfer" && (!draft.fromBankId || !draft.toBankId)) errors.push("Choose both transfer accounts before saving.");
  // True only when the text actually describes a ledger entry. Without this an
  // unrelated sentence ("hello bhai") would be treated as a spending entry.
  const hasIntent = bankMatches.length > 0 || aiTextHas(normalized, transferWords) || aiTextHas(normalized, incomeWords) || aiTextHas(normalized, expenseWords);
  const confidence = errors.length ? "low" : hints.length ? "medium" : "high";
  return { draft, hints, errors, confidence, hasIntent };
}

function extractGeminiJson(rawText){
  if(!rawText) return null;
  const block = String(rawText).match(/```(?:json)?\s*([\s\S]*?)```/);
  const candidate = block ? block[1] : String(rawText);
  const start = candidate.indexOf("{");
  const end = candidate.lastIndexOf("}");
  if(start < 0 || end <= start) return null;
  try{ return JSON.parse(candidate.slice(start, end+1)); }
  catch(_){ return null; }
}

function geminiModelsToTry(){
  const preferred = getPreferredGeminiModel();
  const list = GEMINI_MODELS.slice();
  if(preferred){
    const idx = list.indexOf(preferred);
    if(idx > 0){ list.splice(idx, 1); list.unshift(preferred); }
    else if(idx < 0) list.unshift(preferred);
  }
  return list;
}

async function geminiGenerate(apiKey, model, body){
  let lastResp, lastData;
  for(const version of ["v1beta", "v1"]){
    try {
      const resp = await fetch(
        `https://generativelanguage.googleapis.com/${version}/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        }
      );
      const data = await resp.json().catch(()=>({}));
      if(resp.ok) return { resp, data };
      lastResp = resp; lastData = data;
      // If it's not a 404, don't bother trying the next version for THIS model
      if(resp.status !== 404) break;
    } catch(e) {
      if(version === "v1") throw e;
    }
  }
  return { resp: lastResp, data: lastData };
}

function classifyGeminiHttpError(status, msg){
  const text = String(msg || "Unknown error");
  if(status === 400 && /API[_ ]KEY|api key|invalid/i.test(text)) return { fatal:true, error:"Invalid API key. Open ⚡ Connect Gemini AI and paste a new key from Google AI Studio." };
  if(status === 403) return { fatal:true, error:"This API key was rejected. Enable the Gemini API in Google AI Studio, then try again." };
  if(status === 429) return { fatal:true, error:"Rate limit reached. Wait a moment, or use the built-in parser until the free quota resets." };
  return { fatal:false, error:`Gemini API error: ${text}` };
}

/* -------- Call Gemini API -------- */
async function callGeminiAI(userText, opts){
  const apiKey = (opts && opts.apiKey) || getGeminiKey();
  if(!apiKey) return null;
  const ping = !!(opts && opts.ping);

  const contents = [];
  if(!ping){
    const recentMsgs = (state.aiChatMessages||[]).filter(m => m.id !== "typing" && m.id !== "welcome-1").slice(-8);
    for(const msg of recentMsgs){
      if(msg.sender === "user" && msg.text){
        contents.push({ role:"user", parts:[{ text: msg.text }] });
      } else if(msg.sender === "ai" && msg.text){
        contents.push({ role:"model", parts:[{ text: msg.text.slice(0, 400) }] });
      }
    }
  }
  contents.push({ role:"user", parts:[{ text: ping ? "Reply with JSON only: {\"action\":\"chat\",\"reply\":\"ok\"}" : userText }] });

  const body = {
    system_instruction: { parts:[{ text: ping ? "Return valid JSON only." : buildGeminiSystemPrompt() }] },
    contents,
    generationConfig: {
      temperature: ping ? 0 : 0.2,
      maxOutputTokens: ping ? 64 : 768,
      responseMimeType: "application/json"
    }
  };

  const models = geminiModelsToTry();
  let lastError = "Could not reach Gemini.";
  let lastFatal = false;

  for(const model of models){
    try{
      let { resp, data } = await geminiGenerate(apiKey, model, body);
      if(!resp.ok){
        const msg = data?.error?.message || "Unknown error";
        const classified = classifyGeminiHttpError(resp.status, msg);
        lastError = classified.error;
        lastFatal = classified.fatal;
        if(classified.fatal) return { error: classified.error, fatal:true };
        // Model missing / not supported JSON mime — try without mime, then next model
        if(/not found|not supported|mime|responseMimeType/i.test(msg) || resp.status === 404){
          const plainBody = JSON.parse(JSON.stringify(body));
          delete plainBody.generationConfig.responseMimeType;
          ({ resp, data } = await geminiGenerate(apiKey, model, plainBody));
          if(!resp.ok){
            const msg2 = data?.error?.message || "Unknown error";
            const c2 = classifyGeminiHttpError(resp.status, msg2);
            lastError = c2.error;
            lastFatal = c2.fatal;
            if(c2.fatal) return { error: c2.error, fatal:true };
            continue;
          }
        } else {
          continue;
        }
      }

      const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
      const parsed = extractGeminiJson(rawText);
      if(!parsed){
        lastError = "Could not parse AI response.";
        lastFatal = false;
        continue;
      }
      setPreferredGeminiModel(model);
      return { ok:true, parsed, rawText, model };
    } catch(err){
      lastFatal = false;
      lastError = err && err.name === "SyntaxError"
        ? "AI response was not valid JSON. Try rephrasing."
        : "Network error. Check your internet connection, or use the built-in parser without an API key.";
    }
  }
  return { error: lastError, fatal: lastFatal };
}

function resolveChatBankId(value, userText){
  const raw = String(value || "").trim();
  if(raw && state.banks.some(b => b.id === raw)) return raw;
  if(raw){
    const lower = raw.toLowerCase();
    const byName = state.banks.find(b => {
      const n = b.name.toLowerCase();
      return n === lower || n.includes(lower) || lower.includes(n);
    });
    if(byName) return byName.id;
  }
  const guessed = aiFindBankMatches((raw ? raw + " " : "") + (userText || ""));
  if(guessed.length) return guessed[0].id;
  if(state.banks.length === 1) return state.banks[0].id;
  const cash = state.banks.find(b => b.name.toLowerCase().includes("cash"));
  return cash ? cash.id : "";
}

/* -------- Execute action from Gemini response -------- */
function executeGeminiAction(parsed, userText){
  const action = parsed.action;
  const data = parsed.data || {};
  const reply = parsed.reply || "";

  if(action === "query_balance") return handleBalanceQuery(aiNormalizedText(userText));
  if(action === "query_spending") return handleSpendingQuery(aiNormalizedText(userText));
  if(action === "help") return handleHelpQuery();
  if(action === "chat"){
    return { id: uid(), sender: "ai", timestamp: Date.now(), text: reply || "I'm here to help with your finances!" };
  }

  if(action === "record_transaction"){
    if(!data.amount || data.amount <= 0){
      const local = parseNaturalLedgerText(userText);
      if(local.draft && local.draft.amount) return reviewDraftFromChat(local.draft, userText);
      return {
        id: uid(), sender:"ai", timestamp:Date.now(),
        text: reply || "I couldn't find the amount. Please mention it clearly, e.g. *200 taka diye grocery kinlam*."
      };
    }
    let bankId = resolveChatBankId(data.bankId, userText);

    const cats = data.type === "income" ? state.incomeCats : state.expenseCats;
    let category = data.category || "";
    if(category && !cats.includes(category)){
      // fuzzy match
      const lower = category.toLowerCase();
      const match = cats.find(c => c.toLowerCase().includes(lower) || lower.includes(c.toLowerCase()));
      category = match || cats[0] || "";
    }
    if(!category) category = cats[0] || "";

    if(!state.banks.length){
      return reviewDraftFromChat({
        kind: data.type === "income" ? "income" : "expense",
        amount: data.amount, bankId: "", category,
        note: data.note || category, date: data.date || todayStr(), fee: ""
      }, userText);
    }

    return reviewDraftFromChat({
      kind: data.type === "income" ? "income" : "expense",
      amount: data.amount,
      bankId: bankId || (state.banks[0] ? state.banks[0].id : ""),
      category,
      note: data.note || category,
      date: data.date || todayStr(),
      fee: ""
    }, userText);
  }

  if(action === "record_transfer"){
    let fromId = resolveChatBankId(data.fromBankId, userText);
    let toId = resolveChatBankId(data.toBankId, userText);
    const guessed = aiFindBankMatches(userText);
    if(guessed.length >= 2){
      if(!data.fromBankId) fromId = guessed[0].id;
      if(!data.toBankId) toId = guessed[1].id;
    }
    if(!fromId || !toId || !data.amount){
      return {
        id:uid(), sender:"ai", timestamp:Date.now(),
        text: reply || "For a transfer, please mention both accounts and the amount."
      };
    }
    if(fromId === toId){
      return {
        id:uid(), sender:"ai", timestamp:Date.now(),
        text: "Source and destination accounts must be different for a transfer."
      };
    }
    const fee = parseFloat(data.fee) > 0 ? parseFloat(data.fee) : (aiExtractFee(userText) || "");
    return reviewDraftFromChat({
      kind:"transfer",
      amount:data.amount,
      fromBankId:fromId,
      toBankId:toId,
      fee,
      note:data.note || "Transfer",
      date:data.date || todayStr()
    }, userText);
  }

  const local = parseNaturalLedgerText(userText);
  if(local.draft && local.draft.amount && !local.errors.length){
    return reviewDraftFromChat(local.draft, userText);
  }

  return {
    id:uid(), sender:"ai", timestamp:Date.now(),
    text: reply || "I'm here to help! Tell me a transaction to record."
  };
}

function isSpendingQuery(normalized){

function handleSpendingQuery(normalized){
  const targetDate = aiDetectDate(normalized);
  const isToday = targetDate === todayStr();
  const txns = state.transactions.filter(t => t.date === targetDate && t.type === "expense");
  const total = txns.reduce((sum, t) => sum + t.amount, 0);

  if(!txns.length){
    return {
      id: uid(),
      sender: "ai",
      timestamp: Date.now(),
      text: `📊 You haven't recorded any expenses for **${isToday ? "today" : targetDate}** yet.`
    };
  }

  const catMap = {};
  txns.forEach(t => { catMap[t.category] = (catMap[t.category] || 0) + t.amount; });
  const catList = Object.entries(catMap).map(([c, amt]) => `• ${c}: **${taka(amt)}**`).join("\n");

  return {
    id: uid(),
    sender: "ai",
    timestamp: Date.now(),
    text: `📊 **Expenses for ${isToday ? "Today" : targetDate}:**\n**Total:** **${taka(total)}** across ${txns.length} transaction(s).\n\n**Breakdown:**\n${catList}`
  };
}

// Nothing is written to the ledger straight away: both the built-in parser and
// Gemini produce a draft that the user reviews, edits and confirms first.
function reviewDraftFromChat(draft, rawText){
  if(draft.kind === "transfer"){
    if(!draft.fromBankId || !draft.toBankId){
      return {
        id: uid(),
        sender: "ai",
        timestamp: Date.now(),
        text: "For transfers, please mention both accounts (for example: *bkash theke nagad e 500 taka transfer*)."
      };
    }
    if(draft.fromBankId === draft.toBankId){
      return {
        id: uid(),
        sender: "ai",
        timestamp: Date.now(),
        text: "Source and destination accounts must be different for a transfer."
      };
    }
    return buildReviewMessage(draft);
  }

  // Expense or Income
  if(!state.banks.length){
    state.aiChatContext = { pendingSave: draft };
    return {
      id: uid(),
      sender: "ai",
      timestamp: Date.now(),
      text: `I understood: **${draft.kind === "income" ? "Income" : "Expense"} of ${taka(draft.amount)}** (${draft.category}), but you haven't created any accounts yet.`,
      actionResult: {
        type: "account_needed",
        data: draft
      }
    };
  }

  return buildReviewMessage(draft);
}

// Turn a draft into an editable "review before saving" card. Everything the user
// can change (type, account, category, amount, fee, date, note) lives on the
// message itself, so edits survive re-renders of the chat.
function buildReviewMessage(draft){
  const kind = draft.kind === "transfer" ? "transfer" : (draft.kind === "income" ? "income" : "expense");
  const cats = kind === "income" ? state.incomeCats : state.expenseCats;
  let category = draft.category || "";
  if(kind !== "transfer" && !cats.includes(category)) category = cats[0] || "";
  let bankId = draft.bankId || "";
  if(kind !== "transfer" && !bankId){
    const cash = state.banks.find(b => b.name.toLowerCase().includes("cash"));
    bankId = cash ? cash.id : (state.banks[0] ? state.banks[0].id : "");
  }
  return {
    id: uid(),
    sender: "ai",
    timestamp: Date.now(),
    text: "📝 **Please review this entry.** Nothing is saved until you tap **Save Entry** — change any field that looks wrong.",
    review: {
      kind,
      amount: draft.amount || "",
      date: draft.date || todayStr(),
      bankId,
      fromBankId: draft.fromBankId || "",
      toBankId: draft.toBankId || "",
      category,
      note: draft.note || (kind === "transfer" ? "Transfer" : kind === "income" ? "Income" : "Expense"),
      fee: draft.fee || ""
    }
  };
}

async function executeAIChatInput(rawText){
  const text = (rawText || "").trim();
  if(!text || aiChatBusy) return;
  aiChatBusy = true;

  const userMsg = { id:uid(), sender:"user", text, timestamp:Date.now() };
  state.aiChatMessages.push(userMsg);

  const geminiKey = getGeminiKey();

  try{
    if(geminiKey){
      const typingMsg = { id:"typing", sender:"ai", timestamp:Date.now(), typing:true, text:"" };
      state.aiChatMessages.push(typingMsg);
      saveAIChatMessages(state.aiChatMessages.filter(m => m.id !== "typing"));
      render();
      scrollChatToBottom();

      const result = await callGeminiAI(text);
      state.aiChatMessages = state.aiChatMessages.filter(m => m.id !== "typing");

      let aiMsg;
      if(!result || result.error){
        if(result && result.fatal){
          aiMsg = { id:uid(), sender:"ai", timestamp:Date.now(), text:`⚠️ **Gemini Error:** ${result.error}` };
        } else {
          const fallback = localFallbackAI(text);
          const errText = (result && result.error) || "Could not reach Gemini.";
          if(!fallback.actionResult && !fallback.review){
            aiMsg = {
              id:uid(), sender:"ai", timestamp:Date.now(),
              text: `⚠️ ${errText}\n\n` + (fallback.text || "Try again, or use the built-in examples below.")
            };
          } else {
            aiMsg = fallback;
            // Only prepend the error if the user has an API key set but it failed.
            // If the fallback parser is confident, we make the error less intrusive.
            const prefix = `[Gemini offline, using Local AI] `;
            aiMsg.text = prefix + (fallback.text || "");
          }
        }
      } else {
        aiMsg = executeGeminiAction(result.parsed, text);
      }
      state.aiChatMessages.push(aiMsg);
    } else {
      const aiMsg = localFallbackAI(text);
      state.aiChatMessages.push(aiMsg);
    }
  } finally {
    aiChatBusy = false;
    saveAIChatMessages(state.aiChatMessages.filter(m => m.id !== "typing"));
    render();
    scrollChatToBottom();
  }
}

function localFallbackAI(text){
  const normalized = aiNormalizedText(text);

  if(state.aiChatContext && state.aiChatContext.waitingFor === "amount"){
    const amt = aiExtractAmount(text);
    if(amt && amt > 0){
      const draft = state.aiChatContext.draft;
      draft.amount = amt;
      state.aiChatContext = null;
      return reviewDraftFromChat(draft, text);
    }
    // The reply wasn't an amount (a question, a new entry, ...). Drop the pending
    // question instead of swallowing every message that follows it.
    state.aiChatContext = null;
  }
  if(isSpendingQuery(normalized)) return handleSpendingQuery(normalized);
  if(isBalanceQuery(normalized)) return handleBalanceQuery(normalized);
  if(isHelpQuery(normalized)) return handleHelpQuery();

  const parsed = parseNaturalLedgerText(text);
  const draft = parsed.draft;
  if(!draft.amount){
    if(parsed.hasIntent){
      state.aiChatContext = { waitingFor:"amount", draft };
      const what = draft.note || (draft.kind === "transfer" ? "a transfer" : draft.kind === "income" ? "income" : "an expense");
      return { id:uid(), sender:"ai", timestamp:Date.now(), text:`Got it! You mentioned **${what}**, but how much was it? Please enter the amount (e.g. *200 taka*).` };
    }
    return { id:uid(), sender:"ai", timestamp:Date.now(), text:"I couldn't detect the amount. Please say something like:\n• *aj cash 200 taka diye grocery kinlam*\n• *bkash theke 1500 taka electricity bill*\n• *salary pelam 35000 bank e*" };
  }
  return reviewDraftFromChat(draft, text);
}

      const budgets = (d.budgets||[]).filter(b => !b.autoCreated);
      return {

        goals: d.goals||[], recurring: d.recurring||[], loans: d.loans||[], emis: d.emis||[],

/* ---------------- cloud sync (Firebase Firestore) ---------------- */
const CLOUD_CONFIG_KEY = "ledger-cloud-config"; // { firebaseConfig, syncCode } — stored locally, not in the main data blob
const cloud = { db:null, status:"disconnected", applyingRemote:false, lastPushedAt:0, lastSyncedAt:0, lastSyncedVersion:0, lastError:null, unsubscribe:null };

function loadCloudConfig(){
  try{ const raw = localStorage.getItem(CLOUD_CONFIG_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function saveCloudConfig(cfg){ localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cfg)); }
function clearCloudConfig(){ localStorage.removeItem(CLOUD_CONFIG_KEY); }

function loadFirebaseScripts(cb, onerror){
  if(window.firebase && window.firebase.firestore){ cb(); return; }
  const s1 = document.createElement("script");
  s1.src = "https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js";
  s1.onload = () => {
    const s2 = document.createElement("script");
    s2.src = "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js";
    s2.onload = cb;
    s2.onerror = onerror;
    document.head.appendChild(s2);
  };
  s1.onerror = onerror;
  document.head.appendChild(s1);
}

function connectCloud(firebaseConfig, syncCode, isManualConnect){
  cloud.status = "connecting"; renderCloudStatus();
  loadFirebaseScripts(() => {
    try{
      if(!firebase.apps || !firebase.apps.length){ firebase.initializeApp(firebaseConfig); }
      cloud.db = firebase.firestore();
      try{ cloud.db.enablePersistence({synchronizeTabs:true}); }catch(e){}
      saveCloudConfig({ firebaseConfig, syncCode });
      const docRef = cloud.db.collection("ledgers").doc(syncCode);
      docRef.get().then(snap => {
        if(snap.exists){
          const remote = snap.data();
          const hasLocalData = state.banks.length || state.transactions.length;
          if(isManualConnect && hasLocalData){
            // Only ask this the first time someone deliberately connects a device —
            // not on every app open, since that could let a stale local copy win.
            if(confirm("Found existing cloud data for this sync code.\n\nOK = Load cloud data (replaces what's on this device)\nCancel = Keep this device's data and upload it to the cloud instead")){
              applyRemoteData(remote);
            } else {
              pushToCloud(false, true); // force: this is a deliberate "keep my local data" choice
            }
          } else {
            // Every normal app open (including auto-reconnect on mobile) just pulls the
            // cloud's current state — the cloud is always the source of truth here, so a
            // delete/edit made on another device can never be overwritten by a stale local copy.
            applyRemoteData(remote);
          }
        } else {
          pushToCloud(false, true); // nothing in the cloud yet — seed it
        }
        cloud.unsubscribe = docRef.onSnapshot(snap => {
          if(!snap.exists || cloud.applyingRemote) return;
          const remote = snap.data();
          if(remote && remote.updatedAt && remote.updatedAt !== cloud.lastSyncedVersion){
            applyRemoteData(remote);
          } else {
            cloud.status = "synced"; cloud.lastError = null; cloud.lastSyncedAt = Date.now(); renderCloudStatus();
          }
        }, (err) => { cloud.status = "error"; cloud.lastError = err && err.message ? err.message : "connection lost"; renderCloudStatus(); });
        cloud.status = "synced"; cloud.lastError = null; cloud.lastSyncedAt = Date.now(); renderCloudStatus();
        state.modal = null; render();
      }).catch((err) => { cloud.status = "error"; cloud.lastError = err && err.message ? err.message : "unknown error"; renderCloudStatus(); alert("Could not reach Firestore: " + cloud.lastError + "\n\nCheck your Firebase config, internet connection, and that Firestore is enabled for this project."); });
    }catch(err){ cloud.status = "error"; cloud.lastError = err && err.message ? err.message : "invalid config"; renderCloudStatus(); alert("Invalid Firebase config. Please re-check the JSON you pasted."); }
  }, () => { cloud.status = "error"; cloud.lastError = "Could not load the Firebase library"; renderCloudStatus(); alert("Could not load the Firebase library. Check your internet connection."); });
}

function buildSyncPayload(){
  return {
    banks:state.banks,
    transactions:state.transactions,
    budgets:state.budgets,
    goals:state.goals,
    recurring:state.recurring,
    loans:state.loans,
    emis:state.emis,
    expenseCats:state.expenseCats,
    incomeCats:state.incomeCats,
    adminPassHash: localStorage.getItem(ADMIN_PASS_KEY) || null
  };
}
// Pushes local data to the cloud, but guarantees "last update wins" without relying on any
// device's clock: it compares the cloud's current version against the version this device last
// knew about. If they don't match, someone else changed the data since we last synced, so we
// pull that instead of clobbering it. Runs as a Firestore transaction so the check-and-write is
// atomic even with concurrent devices. Pass force=true to deliberately overwrite anyway (used
// only for the manual "keep my local data" choice during first-time setup).
function pushToCloud(manual, force){
  if(!cloud.db) return;
  const cfg = loadCloudConfig(); if(!cfg) return;
  cloud.status = "syncing"; renderCloudStatus();
  const expectedRemoteVersion = cloud.lastSyncedVersion || 0;
  const docRef = cloud.db.collection("ledgers").doc(cfg.syncCode);
  cloud.db.runTransaction(tx => tx.get(docRef).then(snap => {
    const remote = snap.exists ? snap.data() : null;
    const remoteVersion = remote && remote.updatedAt ? remote.updatedAt : 0;
    if(!force && remoteVersion !== expectedRemoteVersion){
      return { pulledRemote: remote };
    }
    const newVersion = Date.now();
    const payload = { ...buildSyncPayload(), updatedAt: newVersion };
    tx.set(docRef, payload);
    return { pushedAt: newVersion };
  })).then(result => {
    if(result.pulledRemote){
      applyRemoteData(result.pulledRemote);
      if(manual) alert("Someone else updated the data since your last sync — pulled in the latest version instead. Please redo your last change if it's missing.");
    } else {
      cloud.lastPushedAt = result.pushedAt;
      cloud.lastSyncedVersion = result.pushedAt;
      cloud.lastSyncedAt = Date.now();
      cloud.status = "synced"; cloud.lastError = null; renderCloudStatus();
    }
  }).catch((err) => {
    cloud.status = "error"; cloud.lastError = err && err.message ? err.message : "unknown error"; renderCloudStatus();
    if(manual) alert("Sync failed: " + cloud.lastError + "\n\nIf this mentions 'permission' or 'insufficient permissions', your Firestore security rules are likely blocking access (common if the project's test-mode rules expired). Check Firebase Console → Firestore → Rules.");
  });
}
// Manual "Sync Now" entry point — if not connected yet, opens the Cloud modal instead.
function manualSync(){
  if(!cloud.db){ state.modal = { type: "cloud" }; render(); return; }
  pushToCloud(true);
}
function applyRemoteData(remote){
  cloud.applyingRemote = true;
  state.banks = remote.banks||[]; state.transactions = remote.transactions||[]; state.budgets = migrateBudgets(remote.budgets||[]);
  state.goals = remote.goals||[]; state.recurring = remote.recurring||[]; state.loans = remote.loans||[]; state.emis = remote.emis||[];
  state.expenseCats = (remote.expenseCats&&remote.expenseCats.length)?remote.expenseCats:DEFAULT_EXPENSE_CATS;
  state.incomeCats = (remote.incomeCats&&remote.incomeCats.length)?remote.incomeCats:DEFAULT_INCOME_CATS;
  if(remote.adminPassHash){
    localStorage.setItem(ADMIN_PASS_KEY, remote.adminPassHash);
  } else {
    localStorage.removeItem(ADMIN_PASS_KEY);
  }
  cloud.lastPushedAt = remote.updatedAt||Date.now();
  cloud.lastSyncedVersion = cloud.lastPushedAt;
  cloud.lastSyncedAt = Date.now();
  cloud.status = "synced";
  cloud.lastError = null;
  persist(); render();
  cloud.applyingRemote = false;
  renderCloudStatus();
}
function disconnectCloud(){
  if(cloud.unsubscribe) cloud.unsubscribe();
  cloud.db = null; cloud.status = "disconnected";
  clearCloudConfig();
  render();
}
function cloudStatusLabel(){
  const map = { disconnected:"☁️ Cloud", connecting:"☁️ Connecting…", syncing:"☁️ Syncing…", synced:"☁️ Synced", error:"☁️ Sync Error" };
  return map[cloud.status] || "☁️ Cloud";
}
function syncButtonLabel(){
  if(!cloud.db) return "🔄 Connect";
  if(cloud.status==="syncing" || cloud.status==="connecting") return "🔄 Syncing…";
  return "🔄 Sync Now";
}
function relativeTime(ts){
  if(!ts) return "never";
  const diff = Math.max(0, Date.now()-ts);
  const s = Math.floor(diff/1000);
  if(s<10) return "just now";
  if(s<60) return s+"s ago";
  const m = Math.floor(s/60); if(m<60) return m+"m ago";
  const h = Math.floor(m/60); if(h<24) return h+"h ago";
  const d = Math.floor(h/24); return d+"d ago";
}
function cloudStatusDetailHTML(){
  const color = cloud.status==="synced" ? "var(--green-light)" : cloud.status==="error" ? "var(--red)" : (cloud.status==="syncing"||cloud.status==="connecting") ? "var(--gold)" : "var(--muted)";
  return `<div style="display:flex;align-items:center;gap:8px;">
    <span class="dot" style="background:${color};width:9px;height:9px;"></span>
    <span style="font-size:13.5px;font-weight:600;">${esc(cloudStatusLabel().replace('☁️ ',''))}</span>
  </div>
  <div style="font-size:12px;color:var(--muted);margin-top:4px;">Last synced: ${esc(relativeTime(cloud.lastSyncedAt))}</div>
  ${cloud.status==="error" && cloud.lastError ? `<div style="font-size:12px;color:var(--red);margin-top:6px;padding-top:6px;border-top:1px solid var(--border);">Error: ${esc(cloud.lastError)}</div>` : ""}`;
}
function renderCloudStatus(){
  const badge = document.getElementById("header-cloud-badge");
  if(badge) badge.textContent = cloudStatusLabel();
  const btn = document.getElementById("cloud-btn");
  if(btn) btn.textContent = cloudStatusLabel();
  const syncBtn = document.getElementById("sync-now-btn");
  if(syncBtn){
    syncBtn.textContent = syncButtonLabel();
    syncBtn.style.opacity = cloud.db ? "1" : "0.7";
  }
  const detail = document.getElementById("cloud-status-detail");
  if(detail) detail.innerHTML = cloudStatusDetailHTML();
}
// keep "last synced Xm ago" fresh even with no other activity
setInterval(() => { if(cloud.db) renderCloudStatus(); }, 30000);
function randomSyncCode(){
  const bytes = new Uint8Array(12);
  (window.crypto || window.msCrypto).getRandomValues(bytes);
  return Array.from(bytes, b => b.toString(16).padStart(2,"0")).join("");
}
