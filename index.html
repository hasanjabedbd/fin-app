/* ---------------- Loans ---------------- */
function renderLoans(){
  const active = state.loans.filter(l=>!l.settled);
  const settled = state.loans.filter(l=>l.settled);
  let html = `<div class="row-between"><h2 class="section-title">Loans & Dues</h2>
    <button class="btn-outline" data-action="open-modal" data-modal="loan">${ICON.plus} Add</button></div>`;
  if(active.length===0 && settled.length===0){
    html += `<div class="empty">Lent money to someone, or owe someone? Track it here.</div>`;
  } else {
    html += `<div style="display:flex;flex-direction:column;gap:10px;">`;
    html += active.map(l=>`
      <div class="card" style="border-left:4px solid ${l.type==='lent'?'var(--green-light)':'var(--red)'}">
        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
          <div><div style="font-weight:600;font-size:14.5px;">${esc(l.person)}</div>
          <div style="font-size:12.5px;color:var(--muted);margin-top:2px;">${l.type==='lent'?'I lent':'I borrowed'} · ${l.date}${l.note?` · ${esc(l.note)}`:""}</div></div>
          <div class="amt" style="font-weight:700;color:${l.type==='lent'?'var(--green-light)':'var(--red)'}">${taka(l.amount)}</div>
        </div>
        <button class="btn-fill" style="font-size:12.5px;padding:5px 12px;margin-top:10px;" data-action="settle-loan" data-id="${l.id}">Mark Settled</button>
        <button class="icon-btn" style="margin-left:10px;" data-action="delete-loan" data-id="${l.id}">${ICON.trash}</button>
      </div>`).join("");
    if(settled.length){
      html += `<div style="font-size:12.5px;color:var(--muted);margin-top:10px;">Settled</div>`;
      html += settled.map(l=>`<div class="card" style="opacity:.6;display:flex;justify-content:space-between;">
        <span style="font-size:13.5px;">${esc(l.person)} — ${taka(l.amount)}</span>
        <button class="icon-btn" data-action="delete-loan" data-id="${l.id}">${ICON.trash}</button>
      </div>`).join("");
    }
    html += `</div>`;
  }
  return html;
}

/* ---------------- Modals ---------------- */
function renderModal(){
  const m = state.modal;
  let title = "", body = "";
  if(m.type==="account") { title = m.editId ? "Edit Account" : "New Account"; body = accountForm(m.editId); }
  else if(m.type==="transaction") { title = m.editId ? "Edit Transaction" : "New Transaction"; body = transactionForm(m.editId); }
  else if(m.type==="transfer") { title = m.editId ? "Edit Transfer" : "Transfer Between Accounts"; body = transferForm(m.editId); }
  else if(m.type==="budget") { title = m.editId ? "Edit Budget" : "New Budget"; body = budgetForm(m.editId); }
  else if(m.type==="movebudget") { title = (m.mode==="copy"?"Copy":"Move")+" Budget"; body = moveBudgetForm(m.budgetId, m.mode); }
  else if(m.type==="categories") { title="Expense Categories"; body = categoriesForm(); }
  else if(m.type==="goal") { title = m.editId ? "Edit Goal" : "New Goal"; body = goalForm(m.editId); }
  else if(m.type==="recurring") { title = m.editId ? "Edit Recurring Transaction" : "New Recurring Transaction"; body = recurringForm(m.editId); }
  else if(m.type==="loan") { title="New Loan / Due"; body = loanForm(); }
  else if(m.type==="backup") { title="Backup & Restore"; body = backupForm(); }
  else if(m.type==="textexport") { title=m.filename; body = textExportForm(m.text, m.filename); }
  else if(m.type==="report") { title="Report"; body = reportForm(m.from || (monthKey(todayStr())+"-01"), m.to || todayStr()); }
  else if(m.type==="cloud") { title="Cloud Sync"; body = cloudForm(); }
  else if(m.type==="theme") { title="Choose a Theme"; body = themeForm(); }
  else if(m.type==="security") { title="Administrator Password"; body = securityForm(); }

  const wide = m.type==="report" ? "max-width:720px;" : (m.type==="textexport" || m.type==="cloud" || m.type==="security") ? "max-width:560px;" : "";
  return `<div class="modal-overlay" data-action="close-modal-overlay">
    <div class="modal-box" style="${wide}">
      <div class="modal-head"><h3 class="modal-title" style="word-break:break-all;">${esc(title)}</h3><button class="modal-close" data-action="close-modal">${ICON.x}</button></div>
      ${body}
    </div>
  </div>`;
}
function cloudForm(){
  const cfg = loadCloudConfig();
  if(cfg && cloud.db){
    return `<div style="display:flex;flex-direction:column;gap:12px;">
      <div class="card" style="padding:12px;" id="cloud-status-detail">${cloudStatusDetailHTML()}</div>
      <button class="btn-fill" style="justify-content:center;" data-action="manual-sync">${syncButtonLabel()}</button>
      <label class="field">Sync Code — enter this exact code on your other devices
        <input id="sync-code-display" readonly value="${esc(cfg.syncCode)}" onclick="this.select();" style="width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--border2);background:var(--card);font-family:var(--mono);font-size:13px;" />
      </label>
      <p style="font-size:12px;color:var(--muted);margin:0;">Tap the code to select it, then copy and use it when connecting on another device. This device auto-syncs in real time when online — use "Sync Now" any time you want to force-check for the latest data (useful right after coming back online).</p>
      <button class="btn-outline" style="justify-content:center;" data-action="disconnect-cloud">Disconnect This Device</button>

    <p style="font-size:13px;color:var(--muted);margin:0;">Paste your Firebase config (Firebase Console → Project settings → Your apps → the firebaseConfig object), pick a Sync Code, then Connect. Use the exact same Sync Code on every device you want kept in sync.</p>
    <label class="field">Firebase Config
      <textarea id="cloud-config" placeholder='{ apiKey: "...", authDomain: "...", projectId: "...", storageBucket: "...", messagingSenderId: "...", appId: "..." }' style="width:100%;height:120px;padding:9px 11px;border-radius:8px;border:1px solid var(--border2);background:var(--card);font-family:var(--mono);font-size:12px;"></textarea>
    </label>
    <label class="field">Sync Code
      <div style="display:flex;gap:8px;">
        <input id="sync-code-input" placeholder="e.g. a9f3c1e2b8d4" style="flex:1;padding:9px 11px;border-radius:8px;border:1px solid var(--border2);background:var(--card);font-size:14px;" />
        <button type="button" class="btn-outline" data-action="gen-sync-code">Generate</button>
      </div>
    </label>
    <button type="submit" class="btn-submit">Connect</button>
    <div id="cloud-connect-error" style="font-size:12.5px;color:var(--red);"></div>
  </form>`;

  return `<form class="stack" id="form-account">
    <label style="display:flex;align-items:center;gap:8px;font-size:14px;">
      <input type="checkbox" id="acc-iscard" ${isCard?'checked':''} ${editing?'disabled':''} /> This is a credit card
    </label>

/* ---------------- event handling ---------------- */
function attachHandlers(){
  document.body.onclick = (e) => {
    const el = e.target.closest("[data-action]");
    if(!el) return;
    const action = el.dataset.action;
    const id = el.dataset.id;

    if(action==="set-tab"){ state.tab = el.dataset.tab; render(); }
    else if(action==="open-modal"){ state.modal = { type: el.dataset.modal }; render(); setupModalExtras(); }
    else if(action==="open-backup"){ state.modal = { type: "backup" }; render(); }
    else if(action==="set-theme"){ setTheme(el.dataset.themeId); render(); }
    else if(action==="save-admin-password"){
      const p1 = document.getElementById("admin-pass1").value;
      const p2 = document.getElementById("admin-pass2").value;
      if(!p1){ alert("Please enter a password."); return; }
      if(p1!==p2){ alert("Passwords do not match."); return; }
      if(hasAdminPassword() && !requireAdminPassword("Change administrator password")) return;
      setAdminPassword(p1);
      alert("Administrator password saved.");
      state.modal = { type:"security" }; render();
    }
    else if(action==="clear-admin-password"){
      if(!hasAdminPassword()){ alert("No administrator password is set."); return; }
      if(!requireAdminPassword("Remove administrator password")) return;
      clearAdminPassword();
      alert("Administrator password removed.");
      state.modal = { type:"security" }; render();
    }
    else if(action==="close-modal"){ state.modal=null; render(); }
    else if(action==="close-modal-overlay"){ if(e.target===el){ state.modal=null; render(); } }
    else if(action==="edit-bank"){ state.modal = { type:"account", editId:id }; render(); }
    else if(action==="delete-bank"){ if(!requireAdminPassword("Delete account")) return; deleteBank(id); }
    else if(action==="generate-account-statement"){
      const from = document.getElementById("stmt-from").value || (monthKey(todayStr())+"-01");
      const to = document.getElementById("stmt-to").value || todayStr();
      const bankId = document.getElementById("stmt-bank").value;
      if(!bankId){ alert("Please select an account first."); return; }
      if(from>to){ alert("From date cannot be after To date."); return; }
      state.accountStatement = { from, to, bankId, generated:true };
      document.getElementById("account-statement-result").innerHTML = renderAccountStatementTable(from, to, bankId);
    }
    else if(action==="edit-txn"){ 
      const t = state.transactions.find(x=>x.id===id);
      if(t) state.modal = { type: t.type==="transfer" ? "transfer" : "transaction", editId:id };
      render();
    }
    else if(action==="delete-txn"){ if(!requireAdminPassword("Delete transaction")) return; deleteTransaction(id); }
    else if(action==="edit-budget"){ state.modal = { type:"budget", editId:id }; render(); }
    else if(action==="delete-budget"){ if(!requireAdminPassword("Delete budget")) return; deleteBudget(id); }
    else if(action==="budget-prev-month"){ state.selectedBudgetMonth = addMonthKey(state.selectedBudgetMonth||monthKey(todayStr()), -1); render(); }
    else if(action==="budget-next-month"){ state.selectedBudgetMonth = addMonthKey(state.selectedBudgetMonth||monthKey(todayStr()), 1); render(); }
    else if(action==="copy-budgets-from-prev"){
      const to = state.selectedBudgetMonth || monthKey(todayStr());
      const from = addMonthKey(to, -1);
      const n = copyBudgetsToMonth(from, to);
      if(n===0) alert("Nothing to copy from "+monthLabel(from)+".");
    }
    else if(action==="copy-budget"){ state.modal = { type:"movebudget", budgetId:id, mode:"copy" }; render(); }
    else if(action==="move-budget"){ state.modal = { type:"movebudget", budgetId:id, mode:"move" }; render(); }
    else if(action==="edit-goal"){ state.modal = { type:"goal", editId:id }; render(); }
    else if(action==="delete-goal"){ if(!requireAdminPassword("Delete goal")) return; deleteGoal(id); }
    else if(action==="edit-recurring"){ state.modal = { type:"recurring", editId:id }; render(); }
    else if(action==="delete-recurring"){ if(!requireAdminPassword("Delete recurring transaction")) return; deleteRecurring(id); }
    else if(action==="delete-loan"){ if(!requireAdminPassword("Delete loan")) return; deleteLoan(id); }
    else if(action==="delete-category"){ if(!requireAdminPassword("Delete category")) return; deleteCategory("expense", el.dataset.name); state.modal={type:"categories"}; render(); }
    else if(action==="toggle-recurring"){ toggleRecurring(id); }
    else if(action==="skip-recurring"){ skipRecurring(id); }
    else if(action==="execute-recurring"){ executeRecurring(id); }
    else if(action==="settle-loan"){ settleLoan(id); }
    else if(action==="contribute-goal"){
      const input = document.getElementById("goal-add-"+id);
      const amt = parseFloat(input.value);
      if(amt>0) contributeGoal(id, amt);
    }
    else if(action==="export-data"){ exportData(); }
    else if(action==="trigger-import"){ document.getElementById("restoreFileInput").click(); }
    else if(action==="export-csv"){ exportTransactionsCSV(); }
    else if(action==="trigger-import-csv"){ document.getElementById("csvFileInput").click(); }
    else if(action==="download-csv-template"){ downloadCSVTemplate(); }
    else if(action==="regenerate-report"){
      const from = document.getElementById("report-from").value;
      const to = document.getElementById("report-to").value;
      if(from && to) document.getElementById("report-preview").innerHTML = reportPreviewHTML(from, to);
    }
    else if(action==="print-report"){
      const from = document.getElementById("report-from").value || (monthKey(todayStr())+"-01");
      const to = document.getElementById("report-to").value || todayStr();
      printMonthlyReport(from, to);
    }
    else if(action==="download-report-file"){
      const from = document.getElementById("report-from").value || (monthKey(todayStr())+"-01");
      const to = document.getElementById("report-to").value || todayStr();
      downloadReportFile(from, to);
    }
    else if(action==="make-report-link"){
      const from = document.getElementById("report-from").value || (monthKey(todayStr())+"-01");
      const to = document.getElementById("report-to").value || todayStr();
      makeReportLink(from, to);
    }
    else if(action==="open-report-tab"){
      const from = document.getElementById("report-from").value || (monthKey(todayStr())+"-01");
      const to = document.getElementById("report-to").value || todayStr();
      openReportInNewTab(from, to);
    }
    else if(action==="manual-sync"){ manualSync(); }
    else if(action==="gen-sync-code"){
      document.getElementById("sync-code-input").value = randomSyncCode();
    }
    else if(action==="disconnect-cloud"){
      if(confirm("Disconnect cloud sync on this device? Your data stays on this device either way — this just stops syncing.")){
        disconnectCloud();
        state.modal = null; render();
      }
    }
    else if(action==="copy-export-text"){
      const ta = document.getElementById("export-text-area");
      const finish = (ok) => { const btn = el; btn.textContent = ok ? "Copied!" : "Couldn't copy — select the text manually"; setTimeout(()=>{ btn.textContent = "Copy to Clipboard"; }, 2000); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(()=>finish(true)).catch(()=>{
          ta.focus(); ta.select();
          try{ document.execCommand("copy"); finish(true); }catch(e){ finish(false); }
        });
      } else {
        ta.focus(); ta.select();
        try{ document.execCommand("copy"); finish(true); }catch(e){ finish(false); }
      }
    }
  };

  // filters (transactions tab)
  const fs=document.getElementById("f-search"), ffrom=document.getElementById("f-from"), fto=document.getElementById("f-to"), ftype=document.getElementById("f-type"), fbank=document.getElementById("f-bank");
  if(fs){
    fs.oninput = () => { state.txnFilters.search = fs.value; renderFilteredOnly(); };
    ffrom.onchange = () => { state.txnFilters.from = ffrom.value; render(); };
    fto.onchange = () => { state.txnFilters.to = fto.value; render(); };
    ftype.onchange = () => { state.txnFilters.type = ftype.value; render(); };
    fbank.onchange = () => { state.txnFilters.bank = fbank.value; render(); };
  }

  // budgets tab: month selector
  const bms = document.getElementById("budget-month-select");
  if(bms){ bms.onchange = () => { state.selectedBudgetMonth = bms.value || monthKey(todayStr()); render(); }; }

  // budgets tab: category search
  const bsearch = document.getElementById("budget-search");
  if(bsearch){
    bsearch.oninput = () => {
      state.budgetSearch = bsearch.value;
      document.querySelector("main").innerHTML = renderTab();
      attachHandlers();
      const el = document.getElementById("budget-search");
      if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    };
  }

  // accounts tab: drag-to-reorder
  setupAccountDnD();

  // forms
  bindForm("form-account", () => {
    const isCard = document.getElementById("acc-iscard").checked;
    const name = document.getElementById("acc-name").value.trim();
    const bal = parseFloat(document.getElementById("acc-balance").value)||0;
    if(!name) return;
    const editId = state.modal && state.modal.editId;
    const data = { name, balance: isCard ? -bal : bal, isCard, creditLimit: isCard ? (parseFloat(document.getElementById("acc-limit").value)||0) : null };
    if(editId){ if(!requireAdminPassword("Save account changes")) return; updateBank(editId, data); } else { addBank(data); }
    state.modal=null; render();
  });
  bindForm("form-transaction", () => {
    const type = document.getElementById("txn-type-income").classList.contains("active-income") ? "income" : "expense";
    const bankId = document.getElementById("txn-bank").value;
    const amount = parseFloat(document.getElementById("txn-amount").value);
    const category = document.getElementById("txn-category").value;
    const note = document.getElementById("txn-note").value.trim();
    const date = document.getElementById("txn-date").value || todayStr();
    if(!bankId || !amount || amount<=0 || !category) return;
    const editId = state.modal && state.modal.editId;
    if(editId){ if(!requireAdminPassword("Save transaction changes")) return; updateTransaction(editId, {type, bankId, amount, category, note, date}); } else { addTransaction({type, bankId, amount, category, note, date}); }
    state.modal=null; render();
  });
  bindForm("form-transfer", () => {
    const fromBankId = document.getElementById("tr-from").value;
    const toBankId = document.getElementById("tr-to").value;
    const amount = parseFloat(document.getElementById("tr-amount").value);
    const fee = parseFloat(document.getElementById("tr-fee").value)||0;
    const note = document.getElementById("tr-note").value.trim();
    const date = document.getElementById("tr-date").value || todayStr();
    if(!fromBankId || !toBankId || fromBankId===toBankId || !amount || amount<=0) return;
    const editId = state.modal && state.modal.editId;
    if(editId){ updateTransfer(editId, {fromBankId, toBankId, amount, fee, note, date}); } else { addTransfer({fromBankId, toBankId, amount, fee, note, date}); }
    state.modal=null; render();
  });
  bindForm("form-budget", () => {
    const category = document.getElementById("bud-category").value;
    const limit = parseFloat(document.getElementById("bud-limit").value);
    const month = document.getElementById("bud-month").value || monthKey(todayStr());
    if(!category || !limit || limit<=0) return;
    const editId = state.modal && state.modal.editId;
    const dup = state.budgets.find(b => b.month===month && b.category===category && b.id!==editId);
    if(dup){ alert("A budget for \""+category+"\" already exists in "+monthLabel(month)+"."); return; }
    if(editId){ if(!requireAdminPassword("Save budget changes")) return; updateBudget(editId, {category, limit, month}); } else { addBudget({category, limit, month}); }
    state.selectedBudgetMonth = month;
    state.modal=null; render();
  });
  bindForm("form-move-budget", () => {
    const m = state.modal; if(!m) return;
    const toMk = document.getElementById("move-budget-month").value;
    if(!toMk) return;
    const b = state.budgets.find(x=>x.id===m.budgetId);
    if(!b){ state.modal=null; render(); return; }
    const ok = m.mode==="copy" ? copyBudgetToMonth(m.budgetId, toMk) : (requireAdminPassword("Move budget") ? moveBudgetToMonth(m.budgetId, toMk) : false);
    if(!ok){ alert("A budget for \""+b.category+"\" already exists in "+monthLabel(toMk)+"."); return; }
    if(m.mode==="move") state.selectedBudgetMonth = toMk;
    state.modal=null; render();
  });
  bindForm("form-category", () => {
    const input = document.getElementById("new-cat-name");
    addCategory("expense", input.value);
    input.value="";
    state.modal = {type:"categories"}; render();
  });
  bindForm("form-goal", () => {
    const name = document.getElementById("goal-name").value.trim();
    const target = parseFloat(document.getElementById("goal-target").value);
    const targetDate = document.getElementById("goal-date").value;
    if(!name || !target || target<=0) return;
    const editId = state.modal && state.modal.editId;
    if(editId){
      const savedInput = document.getElementById("goal-saved");
      const data = { name, target, targetDate };
      if(savedInput) data.saved = parseFloat(savedInput.value)||0;
      updateGoal(editId, data);
    } else {
      addGoal({name, target, targetDate});
    }
    state.modal=null; render();
  });
  bindForm("form-recurring", () => {
    const type = document.getElementById("rec-type-income").classList.contains("active-income") ? "income" : "expense";
    const bankId = document.getElementById("rec-bank").value;
    const amount = parseFloat(document.getElementById("rec-amount").value);
    const category = document.getElementById("rec-category").value;
    const note = document.getElementById("rec-note").value.trim();
    const dayOfMonth = Number(document.getElementById("rec-day").value)||1;
    if(!bankId || !amount || amount<=0 || !category) return;
    const editId = state.modal && state.modal.editId;
    if(editId){
      if(!requireAdminPassword("Save recurring changes")) return;
      updateRecurring(editId, {type, bankId, amount, category, note, dayOfMonth});
    } else {
      const now = new Date();
      let nextDate = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(dayOfMonth).padStart(2,"0");
      if(nextDate < todayStr()) nextDate = addMonthKeepDay(nextDate);
      addRecurring({type, bankId, amount, category, note, dayOfMonth, nextDate});
    }
    state.modal=null; render();
  });
  bindForm("form-loan", () => {
    const type = document.getElementById("loan-type-borrowed").classList.contains("active-neutral") ? "borrowed" : "lent";
    const person = document.getElementById("loan-person").value.trim();
    const amount = parseFloat(document.getElementById("loan-amount").value);
    const date = document.getElementById("loan-date").value || todayStr();
    const bankId = document.getElementById("loan-bank").value || null;
    const note = document.getElementById("loan-note").value.trim();
    if(!person || !amount || amount<=0) return;
    addLoan({person, type, amount, date, bankId, note});
    state.modal=null; render();
  });
  bindForm("form-cloud-connect", () => {
    const errEl = document.getElementById("cloud-connect-error");
    errEl.textContent = "";
    const raw = document.getElementById("cloud-config").value.trim();
    const syncCode = document.getElementById("sync-code-input").value.trim();
    if(!raw){ errEl.textContent = "Paste your Firebase config first."; return; }
    if(!syncCode){ errEl.textContent = "Enter or generate a Sync Code first."; return; }
    let parsedConfig;
    try{
      parsedConfig = Function('"use strict"; return (' + raw + ');')();
      if(!parsedConfig || !parsedConfig.apiKey || !parsedConfig.projectId) throw new Error("missing fields");
    }catch(e){
      errEl.textContent = "Couldn't read that config. Paste the whole { ... } object from Firebase, unedited.";
      return;
    }
    connectCloud(parsedConfig, syncCode, true);
  });

  setupModalExtras();
}

function bindForm(id, onSubmit){
  const form = document.getElementById(id);

  form.onsubmit = (e) => { e.preventDefault(); onSubmit(); };
}

// Drag-to-reorder for account cards. Each group ("normal" banks / "card"
// credit cards) is its own drop zone, so cards only reorder within their group.
function setupAccountDnD(){
  const zones = document.querySelectorAll(".acc-dnd");
  if(!zones.length) return;
  let draggedId = null, draggedGroup = null;

  const clearMarkers = () => document.querySelectorAll(".acc-card.drop-before").forEach(el=>el.classList.remove("drop-before"));

  zones.forEach(zone => {
    const group = zone.dataset.group;

    zone.querySelectorAll(".acc-card").forEach(card => {
      card.ondragstart = (e) => {
        draggedId = card.dataset.bankId; draggedGroup = group;
        card.classList.add("dragging");
        try{ e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", draggedId); }catch(_){}
      };
      card.ondragend = () => { card.classList.remove("dragging"); clearMarkers(); draggedId = null; draggedGroup = null; };
    });

    zone.ondragover = (e) => {
      if(draggedGroup !== group) return; // don't allow dropping across groups
      e.preventDefault();
      const after = zone.querySelector(".acc-card.dragging");
      const target = e.target.closest(".acc-card");
      clearMarkers();
      if(target && target !== after) target.classList.add("drop-before");
    };
    zone.ondrop = (e) => {
      if(draggedGroup !== group) return;
      e.preventDefault();
      const target = e.target.closest(".acc-card");
      const beforeId = target ? target.dataset.bankId : null; // null => drop at end of group
      const id = draggedId;
      clearMarkers();
      if(id) reorderBanks(id, beforeId);
    };
  });
}

function setupModalExtras(){
  // export/backup textarea: auto-select so the OS's native Copy option appears,
  // since JS clipboard APIs are blocked in some in-app browsers
  const exportTa = document.getElementById("export-text-area");
  if(exportTa){ exportTa.focus(); exportTa.select(); }
  // report: quick month picker auto-fills From/To (1st of month -> today, or last day if a past month)
  const qm = document.getElementById("report-quick-month");
  if(qm){
    qm.onchange = () => {
      const mk = qm.value;
      const from = mk + "-01";
      const to = mk === monthKey(todayStr()) ? todayStr() : lastDayOfMonth(mk);
      document.getElementById("report-from").value = from;
      document.getElementById("report-to").value = to;
      document.getElementById("report-preview").innerHTML = reportPreviewHTML(from, to);
    };
  }
  // account: toggle credit card fields
  const iscard = document.getElementById("acc-iscard");
  if(iscard){
    iscard.onchange = () => {
      document.getElementById("acc-limit-wrap").style.display = iscard.checked ? "block" : "none";
      document.getElementById("acc-balance-label").firstChild.textContent = iscard.checked ? "Current Balance Owed (৳)" : "Current Balance (৳)";
    };
  }
  // account / category searchable pickers (Transaction form)
  initCombo("txn-bank", state.banks.map(b=>({id:b.id, label:b.name})));
  setupTypeToggleCombo("txn-type-expense","txn-type-income","txn-category", state.expenseCats, state.incomeCats);
  // account searchable pickers (Transfer form)
  initCombo("tr-from", state.banks.map(b=>({id:b.id, label:b.name})));
  initCombo("tr-to", state.banks.map(b=>({id:b.id, label:b.name})));
  // transaction: expense/income toggle swaps category list
  setupTypeToggle("rec-type-expense","rec-type-income","rec-category", state.expenseCats, state.incomeCats);
  // loan toggle
  const lentBtn = document.getElementById("loan-type-lent"), borrowedBtn = document.getElementById("loan-type-borrowed");
  if(lentBtn && borrowedBtn){
    lentBtn.onclick = () => { lentBtn.classList.add("active-neutral"); borrowedBtn.classList.remove("active-neutral"); };
    borrowedBtn.onclick = () => { borrowedBtn.classList.add("active-neutral"); lentBtn.classList.remove("active-neutral"); };
  }
  // restore file input
  const fileInput = document.getElementById("restoreFileInput");
  if(fileInput){ fileInput.onchange = () => { if(fileInput.files[0]) importDataFromFile(fileInput.files[0]); fileInput.value=""; }; }
  const csvInput = document.getElementById("csvFileInput");
  if(csvInput){ csvInput.onchange = () => { if(csvInput.files[0]) importTransactionsFromCSV(csvInput.files[0]); csvInput.value=""; }; }
}
// Reusable searchable combobox: turns a text input + hidden input + list div
// into a fast type-to-filter picker. Tap/focus opens the list, typing filters
// it, tap or Enter picks the top match. Returns {setItems} so callers (like
// the expense/income toggle) can swap the option list without rebuilding.
function initCombo(prefix, items){
  const input = document.getElementById(prefix+"-input");
  const hidden = document.getElementById(prefix);
  const list = document.getElementById(prefix+"-list");
  if(!input || !hidden || !list) return { setItems(){} };

  function renderList(filterText){
    const q = (filterText||"").trim().toLowerCase();
    const filtered = q ? items.filter(it => it.label.toLowerCase().includes(q)) : items;
    list.innerHTML = filtered.length
      ? filtered.map(it => `<div class="combo-item" data-id="${esc(it.id)}" data-label="${esc(it.label)}">${esc(it.label)}</div>`).join("")
      : `<div class="combo-empty">No matches</div>`;
    list.style.display = "block";
  }
  function closeList(){ list.style.display = "none"; }
  function selectItem(id, label){ hidden.value = id; input.value = label; closeList(); }

  input.oninput = () => { hidden.value = ""; renderList(input.value); };
  input.onfocus = () => renderList(input.value);
  input.onclick = () => renderList(input.value);
  input.onkeydown = (e) => {
    if(e.key==="Enter"){
      e.preventDefault();
      const first = list.querySelector(".combo-item");
      if(first) selectItem(first.dataset.id, first.dataset.label);
    } else if(e.key==="Escape"){ closeList(); input.blur(); }
  };
  list.onmousedown = (e) => {
    const item = e.target.closest(".combo-item");
    if(!item) return;
    e.preventDefault(); // keep focus so the click registers before blur clears the list
    selectItem(item.dataset.id, item.dataset.label);
  };
  input.onblur = () => {
    setTimeout(() => {
      closeList();
      if(!hidden.value){
        const exact = items.find(it => it.label.toLowerCase() === input.value.trim().toLowerCase());
        if(exact){ hidden.value = exact.id; input.value = exact.label; }
        else { input.value = ""; }
      }
    }, 150);
  };
  if(hidden.value){
    const cur = items.find(it => it.id === hidden.value);
    if(cur) input.value = cur.label;
  }
  return { setItems(newItems){ items = newItems; hidden.value=""; input.value=""; closeList(); } };
}
function setupTypeToggleCombo(expenseBtnId, incomeBtnId, comboPrefix, expenseCats, incomeCats){
  const eBtn = document.getElementById(expenseBtnId), iBtn = document.getElementById(incomeBtnId);
  if(!eBtn || !iBtn || !document.getElementById(comboPrefix+"-input")) return;
  const initialType = iBtn.classList.contains("active-income") ? "income" : "expense";
  const combo = initCombo(comboPrefix, (initialType==="income"?incomeCats:expenseCats).map(c=>({id:c, label:c})));
  function setType(type){
    if(type==="expense"){ eBtn.classList.add("active-expense"); iBtn.classList.remove("active-income"); combo.setItems(expenseCats.map(c=>({id:c,label:c}))); }
    else { iBtn.classList.add("active-income"); eBtn.classList.remove("active-expense"); combo.setItems(incomeCats.map(c=>({id:c,label:c}))); }
  }
  eBtn.onclick = () => setType("expense");
  iBtn.onclick = () => setType("income");
}
function setupTypeToggle(expenseBtnId, incomeBtnId, selectId, expenseCats, incomeCats){
  const eBtn = document.getElementById(expenseBtnId), iBtn = document.getElementById(incomeBtnId), sel = document.getElementById(selectId);
  if(!eBtn || !iBtn || !sel) return;
  function setType(type){
    if(type==="expense"){ eBtn.classList.add("active-expense"); iBtn.classList.remove("active-income"); sel.innerHTML = expenseCats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join(""); }
    else { iBtn.classList.add("active-income"); eBtn.classList.remove("active-expense"); sel.innerHTML = incomeCats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join(""); }
  }
  eBtn.onclick = () => setType("expense");
  iBtn.onclick = () => setType("income");
}
