<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>My Ledger — Personal Finance</title>
<style>
  :root{
    --bg:#F7F2E6; --card:#FFFDF8; --border:#E7DFCB; --border2:#D8CFB6;
    --ink:#221E1B; --muted:#79705F; --placeholder:#ABA18C;
    --green:#1B4332; --green-deep:#143529; --green-light:#2D6A4F; --gold:#C9A227; --gold-soft:#D9B84A; --red:#8B2E2E;
    --blue:#2D5F8B; --purple:#5B4A82;
    --on-primary:#FAF6EC; --hover:rgba(27,67,50,0.05);
    --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: 'SF Mono', 'Roboto Mono', Consolas, monospace;
    --radius:14px; --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(36,26,10,0.04), 0 2px 6px rgba(36,26,10,0.05);
    --shadow-md:0 4px 14px rgba(27,67,50,0.08), 0 1px 3px rgba(36,26,10,0.06);
    --shadow-lg:0 12px 34px rgba(27,67,50,0.14);
    --ease:cubic-bezier(.4,0,.2,1);
  }
  /* ============ Themes (override color tokens only) ============ */
  /* Dark Elegant — charcoal + emerald + gold */
  [data-theme="dark"]{
    --bg:#15181B; --card:#1E2429; --border:#2C333A; --border2:#3B444D;
    --ink:#E9E7E1; --muted:#9BA1A7; --placeholder:#6C7278;
    --green:#2F8A63; --green-deep:#24694C; --green-light:#54C08C; --gold:#D4AF37; --gold-soft:#E6C860; --red:#E0776E;
    --blue:#5B9BD5; --purple:#A18BD1;
    --on-primary:#F3F7F4; --hover:rgba(255,255,255,0.06);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.3), 0 2px 6px rgba(0,0,0,0.25);
    --shadow-md:0 4px 14px rgba(0,0,0,0.4), 0 1px 3px rgba(0,0,0,0.3);
    --shadow-lg:0 12px 34px rgba(0,0,0,0.5);
  }
  /* Midnight Blue — deep navy + sapphire + gold */
  [data-theme="midnight"]{
    --bg:#0F1626; --card:#182238; --border:#26324A; --border2:#37455F;
    --ink:#E6EAF2; --muted:#9AA6BC; --placeholder:#66738C;
    --green:#3E6FB0; --green-deep:#2F568A; --green-light:#6AA0DC; --gold:#E0B84B; --gold-soft:#EFCD6B; --red:#E07A78;
    --blue:#6AA0DC; --purple:#9B8CD6;
    --on-primary:#F2F6FC; --hover:rgba(255,255,255,0.06);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.28);
    --shadow-md:0 4px 14px rgba(0,0,0,0.45), 0 1px 3px rgba(0,0,0,0.3);
    --shadow-lg:0 12px 34px rgba(0,0,0,0.55);
  }
  /* Slate — cool light gray + steel blue */
  [data-theme="slate"]{
    --bg:#EEF1F5; --card:#FFFFFF; --border:#DDE3EA; --border2:#C6CFDA;
    --ink:#1F2933; --muted:#5B6773; --placeholder:#9AA5B1;
    --green:#2C5F7C; --green-deep:#21495F; --green-light:#3E86A8; --gold:#C08A2E; --gold-soft:#D5A64C; --red:#B3413B;
    --blue:#3E86A8; --purple:#6C5C9B;
    --on-primary:#F6F9FB; --hover:rgba(44,95,124,0.06);
    --shadow-sm:0 1px 2px rgba(31,41,51,0.05), 0 2px 6px rgba(31,41,51,0.06);
    --shadow-md:0 4px 14px rgba(44,95,124,0.1), 0 1px 3px rgba(31,41,51,0.06);
    --shadow-lg:0 12px 34px rgba(44,95,124,0.16);
  }
  /* Rose — warm blush + burgundy + gold */
  [data-theme="rose"]{
    --bg:#FBF1EE; --card:#FFFAF8; --border:#F0DAD3; --border2:#E6C4BB;
    --ink:#2B211F; --muted:#8A6F68; --placeholder:#BCA098;
    --green:#8E3B52; --green-deep:#732E42; --green-light:#B85C74; --gold:#C89A3E; --gold-soft:#DBB25C; --red:#B23A3A;
    --blue:#5C7C9B; --purple:#8B5C82;
    --on-primary:#FCF2F0; --hover:rgba(142,59,82,0.06);
    --shadow-sm:0 1px 2px rgba(80,30,40,0.05), 0 2px 6px rgba(80,30,40,0.06);
    --shadow-md:0 4px 14px rgba(142,59,82,0.1), 0 1px 3px rgba(80,30,40,0.06);
    --shadow-lg:0 12px 34px rgba(142,59,82,0.16);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);padding-bottom:70px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;line-height:1.45;letter-spacing:.1px;}
  button{cursor:pointer;font-family:var(--sans);transition:transform .12s var(--ease), background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease), box-shadow .18s var(--ease), opacity .18s var(--ease);}
  button:active{transform:translateY(1px);}
  input,select,textarea{font-family:var(--sans);transition:border-color .16s var(--ease), box-shadow .16s var(--ease), background .16s var(--ease);}
  ::placeholder{color:var(--placeholder);}
  .amt{font-family:var(--mono);font-feature-settings:"tnum" 1;letter-spacing:-.2px;}
  a{color:inherit;}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important;} }

  header.top{position:relative;background:linear-gradient(160deg, var(--green) 0%, var(--green-deep) 100%);color:var(--on-primary);padding:26px 20px 78px;overflow:hidden;}
  header.top::after{content:"";position:absolute;top:-40%;right:-6%;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle, rgba(201,162,39,0.16) 0%, rgba(201,162,39,0) 68%);pointer-events:none;}
  .wrap{max-width:960px;margin:0 auto;position:relative;}
  .eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-family:var(--serif);font-size:13px;letter-spacing:1.8px;color:var(--gold-soft);text-transform:uppercase;}
  h1.title{font-family:var(--serif);font-size:28px;margin:4px 0 0;font-weight:500;letter-spacing:.2px;}
  .byline{font-size:12.5px;color:var(--on-primary);opacity:.68;margin-top:6px;letter-spacing:.4px;font-style:italic;}
  .backup-link{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.32);color:var(--on-primary);border-radius:9px;padding:6px 12px;font-size:12.5px;float:right;margin-top:2px;backdrop-filter:blur(4px);}
  .backup-link:hover{background:rgba(255,255,255,0.18);border-color:rgba(255,255,255,0.55);}

  .networth{margin:-42px auto 0;padding:0 20px;max-width:960px;position:relative;z-index:2;}
  .networth-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px 26px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow-lg);flex-wrap:wrap;gap:16px;}
  .nw-label{font-size:11.5px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px;font-weight:600;}
  .nw-value{font-size:31px;font-weight:700;letter-spacing:-.5px;}
  .nw-badge{width:64px;height:64px;border-radius:50%;border:3px double var(--gold);display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);flex-shrink:0;font-size:24px;box-shadow:inset 0 0 0 1px rgba(201,162,39,0.25);}

  .tabbar{max-width:960px;margin:20px auto 0;padding:0 20px;}
  .tabbar-inner{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;}
  .tabbar-inner::-webkit-scrollbar{height:5px;}
  .tabbar-inner::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
  .tab-btn{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:8px 15px;border-radius:22px;font-size:13.5px;font-weight:500;border:1px solid var(--border);background:var(--card);color:var(--muted);box-shadow:var(--shadow-sm);}
  .tab-btn:hover{border-color:var(--green-light);color:var(--green);}
  .tab-btn.active{border-color:var(--green);background:var(--green);color:var(--on-primary);box-shadow:0 3px 10px rgba(27,67,50,0.22);}

  main{max-width:960px;margin:0 auto;padding:24px 20px 0;}
  .section-title{font-family:var(--serif);font-weight:500;font-size:19px;color:var(--green);margin:0 0 13px;letter-spacing:.2px;}
  .row-between{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .empty{border:1.5px dashed var(--border2);border-radius:var(--radius-sm);padding:30px;text-align:center;color:var(--muted);font-size:14px;background:var(--hover);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
  .grid.stat{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;position:relative;box-shadow:var(--shadow-sm);transition:box-shadow .2s var(--ease), transform .2s var(--ease);}
  .card.bordered{border-left:4px solid var(--accent,var(--green));}
  .card.bordered:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
  .acc-card.dragging{opacity:.4;cursor:grabbing;}
  .acc-card.drop-before{box-shadow:-4px 0 0 0 var(--green-light);}
  .stat-card{text-align:left;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:15px;width:100%;box-shadow:var(--shadow-sm);}
  .stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);border-color:var(--border2);}
  .stat-value{font-size:20px;font-weight:700;margin-top:8px;letter-spacing:-.3px;}
  .stat-label{font-size:11.5px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.4px;font-weight:600;}

  .delete-btn{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--muted);}
  .icon-btn{background:none;border:none;color:var(--muted);display:inline-flex;align-items:center;padding:5px;border-radius:7px;}
  .icon-btn:hover{color:var(--green);background:var(--hover);}

  .btn-outline{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--green);color:var(--green);border-radius:9px;padding:8px 14px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-sm);}
  .btn-outline:hover{background:var(--hover);}
  .btn-fill{display:inline-flex;align-items:center;gap:6px;background:var(--green);color:var(--on-primary);border:none;border-radius:9px;padding:8px 14px;font-size:13.5px;font-weight:600;box-shadow:0 2px 8px rgba(27,67,50,0.2);}
  .btn-fill:hover{background:var(--green-deep);}
  .btn-fill:disabled, .btn-outline:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;}
  .btn-submit{width:100%;background:var(--green);color:var(--on-primary);border:none;border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;margin-top:4px;box-shadow:0 3px 12px rgba(27,67,50,0.24);letter-spacing:.2px;}
  .btn-submit:hover{background:var(--green-deep);}

  .field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.2px;}
  .field input, .field select{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border2);background:var(--card);font-size:14.5px;color:var(--ink);outline:none;font-weight:400;}
  .field input:focus, .field select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(27,67,50,0.1);}
  .combo{position:relative;}
  .combo-input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border2);background:var(--card);font-size:14.5px;color:var(--ink);outline:none;}
  .combo-input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(27,67,50,0.1);}
  .combo-list{position:absolute;top:calc(100% + 5px);left:0;right:0;max-height:220px;overflow-y:auto;background:var(--card);border:1px solid var(--border2);border-radius:10px;box-shadow:var(--shadow-lg);z-index:60;display:none;}
  .combo-item{padding:11px 13px;font-size:14px;border-bottom:1px solid var(--border);}
  .combo-item:last-child{border-bottom:none;}
  .combo-item:active, .combo-item:hover{background:var(--hover);}
  .combo-empty{padding:11px 13px;font-size:13px;color:var(--muted);}
  .toggle-row{display:flex;gap:8px;}
  .toggle-btn{flex:1;padding:10px 0;border-radius:9px;font-size:14px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--muted);}
  .toggle-btn:hover{border-color:var(--border2);}
  .toggle-btn.active-expense{border-color:var(--red);background:var(--red);color:var(--on-primary);box-shadow:0 2px 8px rgba(139,46,46,0.22);}
  .toggle-btn.active-income{border-color:var(--green-light);background:var(--green-light);color:var(--on-primary);box-shadow:0 2px 8px rgba(45,106,79,0.22);}
  .toggle-btn.active-neutral{border-color:var(--green);background:var(--green);color:var(--on-primary);box-shadow:0 2px 8px rgba(27,67,50,0.22);}

  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .search-box{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border2);border-radius:9px;padding:7px 11px;flex:1 1 180px;color:var(--muted);box-shadow:var(--shadow-sm);}
  .search-box:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(27,67,50,0.1);}
  .search-box input{border:none;outline:none;background:transparent;font-size:13.5px;width:100%;color:var(--ink);}
  .filters select, .filters input[type=date]{padding:9px 12px;border-radius:9px;border:1px solid var(--border2);background:var(--card);font-size:13.5px;color:var(--ink);box-shadow:var(--shadow-sm);}
  .filters select:focus, .filters input[type=date]:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px rgba(27,67,50,0.1);}

  .ledger{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);}
  .ledger-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);transition:background .15s var(--ease);}
  .ledger-row:last-child{border-bottom:none;}
  .ledger-row:hover{background:var(--hover);}
  .ledger-icon{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;}
  .ledger-main{flex:1;min-width:0;}
  .ledger-title{font-size:14.5px;font-weight:600;}
  .ledger-sub{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .ledger-amt{font-size:15.5px;font-weight:700;white-space:nowrap;}

  .progress-track{height:9px;border-radius:6px;background:var(--border);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,0.12);}
  .progress-fill{height:100%;border-radius:6px;transition:width .5s var(--ease);}

  .alert-card{background:var(--card);border-radius:var(--radius-sm);padding:15px;border:1px solid;box-shadow:var(--shadow-sm);}
  .alert-title{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;}
  .alert-body{margin-top:5px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(24,18,9,0.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;overflow-y:auto;animation:overlayIn .2s var(--ease);}
  .modal-box{background:var(--bg);border-radius:var(--radius);padding:26px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,0.3);border:1px solid var(--border);margin:auto;max-height:90vh;overflow-y:auto;animation:modalIn .24s var(--ease);}
  @keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
  @keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.98);}to{opacity:1;transform:none;}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border);}
  .modal-title{font-family:var(--serif);font-weight:500;font-size:20px;color:var(--green);margin:0;}
  .modal-close{background:none;border:none;color:var(--muted);font-size:18px;line-height:1;padding:8px;margin:-8px;display:flex;align-items:center;justify-content:center;border-radius:8px;}
  .modal-close:hover{background:var(--hover);color:var(--ink);}
  form.stack{display:flex;flex-direction:column;gap:15px;}

  .cat-list{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;}
  .cat-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--card);border:1px solid var(--border);border-radius:9px;font-size:14px;box-shadow:var(--shadow-sm);}

  .svg-icon{width:14px;height:14px;display:inline-block;vertical-align:-2px;}
  .offline-badge{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--green);color:var(--on-primary);font-size:11.5px;padding:6px 14px;border-radius:20px;opacity:.9;z-index:5;box-shadow:0 4px 14px rgba(27,67,50,0.28);letter-spacing:.3px;}

  .print-only{display:none;}
  @media print{
    body > *:not(#print-report){ display:none !important; }
    #print-report{ display:block !important; }
    body{ background:#fff; color:#111; }
    .rpt-page{ page-break-after:always; }
    .rpt-cover{ page-break-after:always; }
    .rpt-table thead th{background:#F3EFE1;color:#5c5346;border-bottom-color:#1B4332;}
    .rpt-table td{border-bottom-color:#EAE3D2;color:#26201A;}
    .rpt-table tbody tr:nth-child(even) td{background:#FBFAF4;}
    .rpt-kv{border-color:#E4DCC6;}
    .rpt-kv td{border-bottom-color:#EDE6D3;color:#26201A;}
    .rpt-kv tr.total td,.rpt-table tr.rpt-total td{background:#F3EFE1;color:#26201A;border-top-color:#C9BE9E;}
    .rpt-table tr.rpt-grand td{background:#1B4332;color:#fff;}
    @page{ margin:14mm; }
  }
  .rpt-doc{max-width:720px;margin:0 auto;color:#26201A;}
  /* Cover page */
  .rpt-cover{padding:60px 30px;text-align:center;border:2px solid #1B4332;border-radius:14px;margin-bottom:8px;background:linear-gradient(180deg,#FBFAF4 0%,#F4EFE1 100%);}
  .rpt-cover-emblem{width:76px;height:76px;border-radius:50%;border:3px double #C9A227;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 20px;}
  .rpt-cover-brand{font-size:12px;letter-spacing:3px;color:#C9A227;text-transform:uppercase;margin-bottom:14px;font-weight:700;}
  .rpt-cover-title{font-family:var(--serif);font-size:30px;color:#1B4332;font-weight:600;margin:0 0 10px;line-height:1.25;}
  .rpt-cover-rule{width:64px;height:2px;background:#C9A227;margin:16px auto;}
  .rpt-cover-period{font-size:14px;color:#5c5346;margin:6px 0;}
  .rpt-cover-meta{font-size:12px;color:#8a8072;margin-top:20px;}
  /* Section pages */
  .rpt-page{padding:24px 4px;}
  .rpt-page-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #1B4332;padding-bottom:10px;margin-bottom:18px;}
  .rpt-brand{font-size:12px;letter-spacing:1.5px;color:#C9A227;text-transform:uppercase;font-weight:700;}
  .rpt-page-title{font-size:11px;color:#1B4332;font-weight:700;text-transform:uppercase;letter-spacing:.8px;}
  .rpt-h1{font-family:var(--serif);font-size:23px;margin:0 0 4px;color:#1B4332;font-weight:600;}
  .rpt-h3{font-family:var(--serif);font-size:15px;margin:22px 0 6px;color:#1B4332;font-weight:600;border-left:3px solid #C9A227;padding-left:9px;}
  .rpt-period{font-size:12.5px;color:#7a7264;margin:0 0 16px;}
  .rpt-empty{font-size:13px;color:#7a7264;font-style:italic;}
  .rpt-footer{font-size:11px;color:#a49a89;text-align:center;padding:16px;border-top:1px solid #E4DCC6;margin-top:10px;}
  .rpt-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px;}
  .rpt-table thead th{background:var(--hover);color:var(--muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;padding:8px 8px;border-bottom:1.5px solid var(--green);text-align:left;}
  .rpt-table td{border-bottom:1px solid var(--border);padding:7px 8px;text-align:left;color:var(--ink);}
  .rpt-table tbody tr:nth-child(even) td{background:var(--hover);}
  .rpt-table td.num, .rpt-table th.num{text-align:right;font-family:var(--mono);}
  /* Summary key-value tables (no header row) */
  .rpt-kv{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .rpt-kv td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--ink);}
  .rpt-kv tr:last-child td{border-bottom:none;}

</style>
</head>
<body>
<div id="app"></div>
<div id="print-report" class="print-only"></div>
<input type="file" id="restoreFileInput" accept="application/json" style="display:none" />
<input type="file" id="csvFileInput" accept=".csv,text/csv" style="display:none" />

<script>
/* ---------------- utils ---------------- */
const DEFAULT_EXPENSE_CATS = ["Food","Transport","Rent","Shopping","Bills","Entertainment","Health","Other"];
const DEFAULT_INCOME_CATS = ["Salary","Business","Gift","Investment","Other"];
const BANK_COLORS = ["#1B4332","#8B2E2E","#2D5F8B","#6B4226","#4A5859","#7A4A82"];
const STORAGE_KEY = "ledger-finance-data-offline";

/* ---------------- theme ---------------- */
const THEME_KEY = "ledger-theme";
const THEMES = [
  { id:"classic",  label:"Classic Cream", swatch:"#1B4332" },
  { id:"dark",     label:"Dark Elegant",  swatch:"#15181B" },
  { id:"midnight", label:"Midnight Blue", swatch:"#0F1626" },
  { id:"slate",    label:"Slate",         swatch:"#2C5F7C" },
  { id:"rose",     label:"Rose",          swatch:"#8E3B52" },
];
function loadTheme(){ try{ return localStorage.getItem(THEME_KEY) || "classic"; }catch(e){ return "classic"; } }
function applyTheme(id){
  if(id && id!=="classic") document.documentElement.setAttribute("data-theme", id);
  else document.documentElement.removeAttribute("data-theme");
}
function setTheme(id){
  try{ localStorage.setItem(THEME_KEY, id); }catch(e){}
  state.theme = id;
  applyTheme(id);
}

/* ---------------- admin safety lock ---------------- */
const ADMIN_PASS_KEY = "ledger-admin-pass-hash";
function simpleHash(text){
  let h = 2166136261;
  for(let i=0;i<text.length;i++){ h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h>>>0).toString(16);
}
function hasAdminPassword(){ try{ return !!localStorage.getItem(ADMIN_PASS_KEY); }catch(e){ return false; } }
function verifyAdminPassword(pass){ try{ return localStorage.getItem(ADMIN_PASS_KEY) === simpleHash(pass); }catch(e){ return false; } }
function requireAdminPassword(reason){
  if(!hasAdminPassword()) return true;
  const pass = prompt((reason || "This change") + " requires administrator password.");
  if(pass===null) return false;
  if(verifyAdminPassword(pass)) return true;
  alert("Wrong administrator password.");
  return false;
}
function setAdminPassword(pass){ localStorage.setItem(ADMIN_PASS_KEY, simpleHash(pass)); }
function clearAdminPassword(){ localStorage.removeItem(ADMIN_PASS_KEY); }

function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)); }
function taka(n){ const sign = n<0?"-":""; const v = Math.abs(n).toLocaleString("en-IN",{maximumFractionDigits:2}); return sign+"৳"+v; }
function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function monthKey(d){ return d.slice(0,7); }
// Shift a month key ("YYYY-MM") by n months (n can be negative).
function addMonthKey(mk, n){
  let [y,m] = mk.split("-").map(Number);
  const total = (y*12 + (m-1)) + n;
  y = Math.floor(total/12);
  m = (total%12) + 1;
  return y+"-"+String(m).padStart(2,"0");
}
function addMonthKeepDay(dateStr){
  let [y,m,d] = dateStr.split("-").map(Number);
  m += 1; if(m>12){ m=1; y+=1; }
  return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
}
function daysUntil(dateStr){ return Math.ceil((new Date(dateStr) - new Date(todayStr())) / 86400000); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- icons (tiny inline SVGs) ---------------- */
const ICON = {
  plus:'<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  trash:'<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z"/></svg>',
  edit:'<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>',
  x:'<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  transfer:'<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3-4 4 4 4M4 7h16M16 21l4-4-4-4M20 17H4"/></svg>',
  check:'<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  alert:'<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  tag:'<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82Z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>',
  search:'<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
};

/* ---------------- state ---------------- */
let state = loadState();
state.tab = "dashboard";
state.modal = null;
state.selectedBudgetMonth = monthKey(todayStr());
state.budgetSearch = "";
state.accountStatement = { from: monthKey(todayStr())+"-01", to: todayStr(), bankId: "" };
state.theme = loadTheme();
applyTheme(state.theme);

// Older budgets had no month — treat them as the current month so nothing is lost.
function migrateBudgets(budgets){
  const cm = monthKey(todayStr());
  return budgets.map(b => b.month ? b : { ...b, month: cm });
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      return {
        banks: d.banks||[], transactions: d.transactions||[], budgets: migrateBudgets(d.budgets||[]),
        goals: d.goals||[], recurring: d.recurring||[], loans: d.loans||[],
        expenseCats: (d.expenseCats&&d.expenseCats.length)?d.expenseCats:DEFAULT_EXPENSE_CATS,
        incomeCats: (d.incomeCats&&d.incomeCats.length)?d.incomeCats:DEFAULT_INCOME_CATS,
      };
    }
  }catch(e){}
  return { banks:[], transactions:[], budgets:[], goals:[], recurring:[], loans:[], expenseCats:[...DEFAULT_EXPENSE_CATS], incomeCats:[...DEFAULT_INCOME_CATS] };
}
function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      banks: state.banks, transactions: state.transactions, budgets: state.budgets,
      goals: state.goals, recurring: state.recurring, loans: state.loans,
      expenseCats: state.expenseCats, incomeCats: state.incomeCats,
    }));
  }catch(e){ alert("Could not save data. Your browser storage may be full or blocked."); }
}
function commit(){
  persist(); render();
  if(cloud.db && !cloud.applyingRemote) pushToCloud();
}

/* ---------------- cloud sync (Firebase Firestore) ---------------- */
const CLOUD_CONFIG_KEY = "ledger-cloud-config"; // { firebaseConfig, syncCode } — stored locally, not in the main data blob
const cloud = { db:null, status:"disconnected", applyingRemote:false, lastPushedAt:0, lastSyncedAt:0, lastSyncedVersion:0, lastError:null, unsubscribe:null };

function loadCloudConfig(){
  try{ const raw = localStorage.getItem(CLOUD_CONFIG_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function saveCloudConfig(cfg){ localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cfg)); }
function clearCloudConfig(){ localStorage.removeItem(CLOUD_CONFIG_KEY); }

function loadFirebaseScripts(cb, onerror){
  if(window.firebase && window.firebase.firestore){ cb(); return; }
  const s1 = document.createElement("script");
  s1.src = "https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js";
  s1.onload = () => {
    const s2 = document.createElement("script");
    s2.src = "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js";
    s2.onload = cb;
    s2.onerror = onerror;
    document.head.appendChild(s2);
  };
  s1.onerror = onerror;
  document.head.appendChild(s1);
}

function connectCloud(firebaseConfig, syncCode, isManualConnect){
  cloud.status = "connecting"; renderCloudStatus();
  loadFirebaseScripts(() => {
    try{
      if(!firebase.apps || !firebase.apps.length){ firebase.initializeApp(firebaseConfig); }
      cloud.db = firebase.firestore();
      try{ cloud.db.enablePersistence({synchronizeTabs:true}); }catch(e){}
      saveCloudConfig({ firebaseConfig, syncCode });
      const docRef = cloud.db.collection("ledgers").doc(syncCode);
      docRef.get().then(snap => {
        if(snap.exists){
          const remote = snap.data();
          const hasLocalData = state.banks.length || state.transactions.length;
          if(isManualConnect && hasLocalData){
            // Only ask this the first time someone deliberately connects a device —
            // not on every app open, since that could let a stale local copy win.
            if(confirm("Found existing cloud data for this sync code.\n\nOK = Load cloud data (replaces what's on this device)\nCancel = Keep this device's data and upload it to the cloud instead")){
              applyRemoteData(remote);
            } else {
              pushToCloud(false, true); // force: this is a deliberate "keep my local data" choice
            }
          } else {
            // Every normal app open (including auto-reconnect on mobile) just pulls the
            // cloud's current state — the cloud is always the source of truth here, so a
            // delete/edit made on another device can never be overwritten by a stale local copy.
            applyRemoteData(remote);
          }
        } else {
          pushToCloud(false, true); // nothing in the cloud yet — seed it
        }
        cloud.unsubscribe = docRef.onSnapshot(snap => {
          if(!snap.exists || cloud.applyingRemote) return;
          const remote = snap.data();
          if(remote && remote.updatedAt && remote.updatedAt !== cloud.lastSyncedVersion){
            applyRemoteData(remote);
          } else {
            cloud.status = "synced"; cloud.lastError = null; cloud.lastSyncedAt = Date.now(); renderCloudStatus();
          }
        }, (err) => { cloud.status = "error"; cloud.lastError = err && err.message ? err.message : "connection lost"; renderCloudStatus(); });
        cloud.status = "synced"; cloud.lastError = null; cloud.lastSyncedAt = Date.now(); renderCloudStatus();
        state.modal = null; render();
      }).catch((err) => { cloud.status = "error"; cloud.lastError = err && err.message ? err.message : "unknown error"; renderCloudStatus(); alert("Could not reach Firestore: " + cloud.lastError + "\n\nCheck your Firebase config, internet connection, and that Firestore is enabled for this project."); });
    }catch(err){ cloud.status = "error"; cloud.lastError = err && err.message ? err.message : "invalid config"; renderCloudStatus(); alert("Invalid Firebase config. Please re-check the JSON you pasted."); }
  }, () => { cloud.status = "error"; cloud.lastError = "Could not load the Firebase library"; renderCloudStatus(); alert("Could not load the Firebase library. Check your internet connection."); });
}

function buildSyncPayload(){
  return { banks:state.banks, transactions:state.transactions, budgets:state.budgets, goals:state.goals, recurring:state.recurring, loans:state.loans, expenseCats:state.expenseCats, incomeCats:state.incomeCats };
}
// Pushes local data to the cloud, but guarantees "last update wins" without relying on any
// device's clock: it compares the cloud's current version against the version this device last
// knew about. If they don't match, someone else changed the data since we last synced, so we
// pull that instead of clobbering it. Runs as a Firestore transaction so the check-and-write is
// atomic even with concurrent devices. Pass force=true to deliberately overwrite anyway (used
// only for the manual "keep my local data" choice during first-time setup).
function pushToCloud(manual, force){
  if(!cloud.db) return;
  const cfg = loadCloudConfig(); if(!cfg) return;
  cloud.status = "syncing"; renderCloudStatus();
  const expectedRemoteVersion = cloud.lastSyncedVersion || 0;
  const docRef = cloud.db.collection("ledgers").doc(cfg.syncCode);
  cloud.db.runTransaction(tx => tx.get(docRef).then(snap => {
    const remote = snap.exists ? snap.data() : null;
    const remoteVersion = remote && remote.updatedAt ? remote.updatedAt : 0;
    if(!force && remoteVersion !== expectedRemoteVersion){
      return { pulledRemote: remote };
    }
    const newVersion = Date.now();
    const payload = { ...buildSyncPayload(), updatedAt: newVersion };
    tx.set(docRef, payload);
    return { pushedAt: newVersion };
  })).then(result => {
    if(result.pulledRemote){
      applyRemoteData(result.pulledRemote);
      if(manual) alert("Someone else updated the data since your last sync — pulled in the latest version instead. Please redo your last change if it's missing.");
    } else {
      cloud.lastPushedAt = result.pushedAt;
      cloud.lastSyncedVersion = result.pushedAt;
      cloud.lastSyncedAt = Date.now();
      cloud.status = "synced"; cloud.lastError = null; renderCloudStatus();
    }
  }).catch((err) => {
    cloud.status = "error"; cloud.lastError = err && err.message ? err.message : "unknown error"; renderCloudStatus();
    if(manual) alert("Sync failed: " + cloud.lastError + "\n\nIf this mentions 'permission' or 'insufficient permissions', your Firestore security rules are likely blocking access (common if the project's test-mode rules expired). Check Firebase Console → Firestore → Rules.");
  });
}
// Manual "Sync Now" entry point — if not connected yet, opens the Cloud modal instead.
function manualSync(){
  if(!cloud.db){ state.modal = { type: "cloud" }; render(); return; }
  pushToCloud(true);
}
function applyRemoteData(remote){
  cloud.applyingRemote = true;
  state.banks = remote.banks||[]; state.transactions = remote.transactions||[]; state.budgets = migrateBudgets(remote.budgets||[]);
  state.goals = remote.goals||[]; state.recurring = remote.recurring||[]; state.loans = remote.loans||[];
  state.expenseCats = (remote.expenseCats&&remote.expenseCats.length)?remote.expenseCats:DEFAULT_EXPENSE_CATS;
  state.incomeCats = (remote.incomeCats&&remote.incomeCats.length)?remote.incomeCats:DEFAULT_INCOME_CATS;
  cloud.lastPushedAt = remote.updatedAt||Date.now();
  cloud.lastSyncedVersion = cloud.lastPushedAt;
  cloud.lastSyncedAt = Date.now();
  cloud.status = "synced";
  cloud.lastError = null;
  persist(); render();
  cloud.applyingRemote = false;
  renderCloudStatus();
}
function disconnectCloud(){
  if(cloud.unsubscribe) cloud.unsubscribe();
  cloud.db = null; cloud.status = "disconnected";
  clearCloudConfig();
  render();
}
function cloudStatusLabel(){
  const map = { disconnected:"☁️ Cloud", connecting:"☁️ Connecting…", syncing:"☁️ Syncing…", synced:"☁️ Synced", error:"☁️ Sync Error" };
  return map[cloud.status] || "☁️ Cloud";
}
function syncButtonLabel(){
  if(!cloud.db) return "🔄 Connect";
  if(cloud.status==="syncing" || cloud.status==="connecting") return "🔄 Syncing…";
  return "🔄 Sync Now";
}
function relativeTime(ts){
  if(!ts) return "never";
  const diff = Math.max(0, Date.now()-ts);
  const s = Math.floor(diff/1000);
  if(s<10) return "just now";
  if(s<60) return s+"s ago";
  const m = Math.floor(s/60); if(m<60) return m+"m ago";
  const h = Math.floor(m/60); if(h<24) return h+"h ago";
  const d = Math.floor(h/24); return d+"d ago";
}
function cloudStatusDetailHTML(){
  const color = cloud.status==="synced" ? "var(--green-light)" : cloud.status==="error" ? "var(--red)" : (cloud.status==="syncing"||cloud.status==="connecting") ? "var(--gold)" : "var(--muted)";
  return `<div style="display:flex;align-items:center;gap:8px;">
    <span class="dot" style="background:${color};width:9px;height:9px;"></span>
    <span style="font-size:13.5px;font-weight:600;">${esc(cloudStatusLabel().replace('☁️ ',''))}</span>
  </div>
  <div style="font-size:12px;color:var(--muted);margin-top:4px;">Last synced: ${esc(relativeTime(cloud.lastSyncedAt))}</div>
  ${cloud.status==="error" && cloud.lastError ? `<div style="font-size:12px;color:var(--red);margin-top:6px;padding-top:6px;border-top:1px solid var(--border);">Error: ${esc(cloud.lastError)}</div>` : ""}`;
}
function renderCloudStatus(){
  const btn = document.getElementById("cloud-btn");
  if(btn) btn.textContent = cloudStatusLabel();
  const syncBtn = document.getElementById("sync-now-btn");
  if(syncBtn){
    syncBtn.textContent = syncButtonLabel();
    syncBtn.style.opacity = cloud.db ? "1" : "0.7";
  }
  const detail = document.getElementById("cloud-status-detail");
  if(detail) detail.innerHTML = cloudStatusDetailHTML();
}
// keep "last synced Xm ago" fresh even with no other activity
setInterval(() => { if(cloud.db) renderCloudStatus(); }, 30000);
function randomSyncCode(){
  const bytes = new Uint8Array(12);
  (window.crypto || window.msCrypto).getRandomValues(bytes);
  return Array.from(bytes, b => b.toString(16).padStart(2,"0")).join("");
}

// auto-connect on load if previously configured
(function autoConnectCloud(){
  const cfg = loadCloudConfig();
  if(cfg && cfg.firebaseConfig && cfg.syncCode){ connectCloud(cfg.firebaseConfig, cfg.syncCode); }
})();

/* ---------------- helpers ---------------- */
function bankById(id){ return state.banks.find(b=>b.id===id); }
function bankName_(id){ const b=bankById(id); return b?b.name:"Unknown"; }
function bankColor_(id){ const b=bankById(id); return b?b.color:"#444"; }
function adjustBalance(id, delta){
  state.banks = state.banks.map(b => b.id===id ? {...b, balance: b.balance+delta} : b);
}

/* ---------------- mutations ---------------- */
function addBank(data){
  state.banks.push({ id: uid(), color: BANK_COLORS[state.banks.length % BANK_COLORS.length], ...data });
  commit();
}
function updateBank(id, data){
  state.banks = state.banks.map(b=>b.id===id?{...b, name:data.name, balance:data.balance, creditLimit:data.creditLimit}:b);
  commit();
}
// Reorder the dragged account so it sits before `beforeId` (or at the end of its
// group when beforeId is null). Only reorders within the same group implicitly,
// since drop targets are scoped per group in the UI.
function reorderBanks(draggedId, beforeId){
  if(draggedId===beforeId) return;
  const arr = state.banks.slice();
  const from = arr.findIndex(b=>b.id===draggedId);
  if(from<0) return;
  const [moved] = arr.splice(from,1);
  let to = beforeId ? arr.findIndex(b=>b.id===beforeId) : arr.length;
  if(to<0) to = arr.length;
  arr.splice(to,0,moved);
  state.banks = arr;
  commit();
}
function deleteBank(id){
  const hasTxns = state.transactions.some(t=>t.bankId===id||t.fromBankId===id||t.toBankId===id);
  if(hasTxns && !confirm("Transactions linked to this account will also be deleted. Continue?")) return;

  // Reverse the effect on the OTHER (surviving) account for any transfer that touches this account,
  // including any linked transfer-fee charged to a surviving account — otherwise that account's
  // balance stays permanently wrong after this account disappears.
  state.transactions.forEach(t=>{
    if(t.type!=="transfer") return;
    const touchesFrom = t.fromBankId===id, touchesTo = t.toBankId===id;
    if(touchesFrom && !touchesTo){
      adjustBalance(t.toBankId, -t.amount); // undo the credit the other account received
    } else if(touchesTo && !touchesFrom){
      adjustBalance(t.fromBankId, t.amount); // undo the debit the other account paid
      const feeTxn = state.transactions.find(x=>x.relatedTransferId===t.id);
      if(feeTxn && feeTxn.bankId!==id) adjustBalance(feeTxn.bankId, feeTxn.amount); // undo the fee too
    }
  });

  const removedTransferIds = new Set(
    state.transactions.filter(t=>t.type==="transfer" && (t.fromBankId===id || t.toBankId===id)).map(t=>t.id)
  );
  state.banks = state.banks.filter(b=>b.id!==id);
  state.transactions = state.transactions.filter(t=>
    t.bankId!==id && t.fromBankId!==id && t.toBankId!==id && !removedTransferIds.has(t.relatedTransferId)
  );
  commit();
}
function addCategory(type,name){
  const n=(name||"").trim(); if(!n) return;
  if(type==="expense"){ if(!state.expenseCats.includes(n)) state.expenseCats.push(n); }
  else { if(!state.incomeCats.includes(n)) state.incomeCats.push(n); }
  commit();
}
function deleteCategory(type,name){
  if(type==="expense") state.expenseCats = state.expenseCats.filter(c=>c!==name);
  else state.incomeCats = state.incomeCats.filter(c=>c!==name);
  commit();
}
function addTransaction(data, skipCommit){
  const txn = { id: uid(), createdAt: Date.now(), type:data.type, bankId:data.bankId, amount:data.amount, category:data.category, note:data.note, date:data.date };
  state.transactions.push(txn);
  adjustBalance(data.bankId, data.type==="income" ? data.amount : -data.amount);
  if(!skipCommit) commit();
}
function updateTransaction(id, data){
  const idx = state.transactions.findIndex(x=>x.id===id);
  if(idx<0) return;
  const old = state.transactions[idx];
  // reverse the old entry's effect on its account, then apply the new one
  adjustBalance(old.bankId, old.type==="income" ? -old.amount : old.amount);
  adjustBalance(data.bankId, data.type==="income" ? data.amount : -data.amount);
  state.transactions[idx] = { ...old, type:data.type, bankId:data.bankId, amount:data.amount, category:data.category, note:data.note, date:data.date };
  commit();
}
function deleteTransaction(id){
  const t = state.transactions.find(x=>x.id===id); if(!t) return;
  if(t.type==="transfer"){
    const feeTxn = state.transactions.find(x=>x.relatedTransferId===id);
    if(feeTxn) adjustBalance(feeTxn.bankId, feeTxn.amount);
    state.transactions = state.transactions.filter(x=>x.id!==id && x.relatedTransferId!==id);
    adjustBalance(t.fromBankId, t.amount);
    adjustBalance(t.toBankId, -t.amount);
  } else {
    state.transactions = state.transactions.filter(x=>x.id!==id);
    adjustBalance(t.bankId, t.type==="income" ? -t.amount : t.amount);
  }
  commit();
}
function addTransfer(data, skipCommit){
  const txn = { id: uid(), createdAt: Date.now(), type:"transfer", fromBankId:data.fromBankId, toBankId:data.toBankId, amount:data.amount, fee:data.fee||0, note:data.note, date:data.date };
  state.transactions.push(txn);
  adjustBalance(data.fromBankId, -data.amount);
  adjustBalance(data.toBankId, data.amount);
  if(data.fee && data.fee > 0){
    if(!state.expenseCats.includes("Bank Charge")) state.expenseCats.push("Bank Charge");
    const feeTxn = { id: uid(), createdAt: Date.now()+1, type:"expense", bankId:data.fromBankId, amount:data.fee, category:"Bank Charge", note:"Transfer fee to "+bankName_(data.toBankId), date:data.date, relatedTransferId: txn.id };
    state.transactions.push(feeTxn);
    adjustBalance(data.fromBankId, -data.fee);
  }
  if(!skipCommit) commit();
}
function updateTransfer(id, data){
  const t = state.transactions.find(x=>x.id===id && x.type==="transfer");
  if(!t) return;
  // reverse the old transfer (and its linked fee, if any)
  const feeTxn = state.transactions.find(x=>x.relatedTransferId===id);
  if(feeTxn) adjustBalance(feeTxn.bankId, feeTxn.amount);
  state.transactions = state.transactions.filter(x=>x.id!==id && x.relatedTransferId!==id);
  adjustBalance(t.fromBankId, t.amount);
  adjustBalance(t.toBankId, -t.amount);
  // re-apply as new data, keeping the same id/createdAt so the row doesn't jump in the list
  const newTxn = { id:t.id, createdAt:t.createdAt, type:"transfer", fromBankId:data.fromBankId, toBankId:data.toBankId, amount:data.amount, fee:data.fee||0, note:data.note, date:data.date };
  state.transactions.push(newTxn);
  adjustBalance(data.fromBankId, -data.amount);
  adjustBalance(data.toBankId, data.amount);
  if(data.fee && data.fee > 0){
    if(!state.expenseCats.includes("Bank Charge")) state.expenseCats.push("Bank Charge");
    const newFeeTxn = { id: uid(), createdAt: t.createdAt+1, type:"expense", bankId:data.fromBankId, amount:data.fee, category:"Bank Charge", note:"Transfer fee to "+bankName_(data.toBankId), date:data.date, relatedTransferId: t.id };
    state.transactions.push(newFeeTxn);
    adjustBalance(data.fromBankId, -data.fee);
  }
  commit();
}
function addBudget(data){ state.budgets.push({id:uid(), ...data}); commit(); }
function updateBudget(id, data){ state.budgets = state.budgets.map(b=>b.id===id?{...b, ...data}:b); commit(); }
function deleteBudget(id){ state.budgets = state.budgets.filter(b=>b.id!==id); commit(); }
// Copy every budget from month `fromMk` into `toMk`, skipping categories that
// already have a budget in the target month.
function copyBudgetsToMonth(fromMk, toMk){
  const existing = new Set(budgetsForMonth(toMk).map(b=>b.category));
  const src = budgetsForMonth(fromMk).filter(b=>!existing.has(b.category));
  if(!src.length) return 0;
  src.forEach(b => state.budgets.push({ id:uid(), category:b.category, limit:b.limit, month:toMk }));
  commit();
  return src.length;
}
// Copy a single budget to another month. Returns false if that category already
// has a budget in the target month (so we don't create duplicates).
function copyBudgetToMonth(id, toMk){
  const b = state.budgets.find(x=>x.id===id); if(!b) return false;
  if(budgetsForMonth(toMk).some(x=>x.category===b.category)) return false;
  state.budgets.push({ id:uid(), category:b.category, limit:b.limit, month:toMk });
  commit();
  return true;
}
// Move a single budget to another month (relocate — original month loses it).
function moveBudgetToMonth(id, toMk){
  const b = state.budgets.find(x=>x.id===id); if(!b) return false;
  if(b.month===toMk) return true;
  if(budgetsForMonth(toMk).some(x=>x.category===b.category)) return false;
  state.budgets = state.budgets.map(x=>x.id===id?{...x, month:toMk}:x);
  commit();
  return true;
}
function monthlySpend(){
  return spendForMonth(monthKey(todayStr()));
}
// Spend per category for a given month key ("YYYY-MM"), compared by each
// transaction's own date — so a transaction dated next month counts toward
// next month's budget.
function spendForMonth(mk){
  const map = {};
  state.transactions.forEach(t=>{ if(t.type==="expense" && monthKey(t.date)===mk){ map[t.category]=(map[t.category]||0)+t.amount; } });
  return map;
}
function budgetsForMonth(mk){ return state.budgets.filter(b=>b.month===mk); }
function addGoal(data){ state.goals.push({id:uid(), saved:0, ...data}); commit(); }
function updateGoal(id, data){ state.goals = state.goals.map(g=>g.id===id?{...g, ...data}:g); commit(); }
function contributeGoal(id, amt){ state.goals = state.goals.map(g=>g.id===id?{...g, saved:g.saved+amt}:g); commit(); }
function deleteGoal(id){ state.goals = state.goals.filter(g=>g.id!==id); commit(); }

function addRecurring(data){ state.recurring.push({id:uid(), active:true, ...data}); commit(); }
function updateRecurring(id, data){
  const existing = state.recurring.find(r=>r.id===id);
  if(!existing) return;
  let nextDate = existing.nextDate;
  if(data.dayOfMonth !== existing.dayOfMonth){
    const now = new Date();
    nextDate = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(data.dayOfMonth).padStart(2,"0");
    if(nextDate < todayStr()) nextDate = addMonthKeepDay(nextDate);
  }
  state.recurring = state.recurring.map(r=>r.id===id?{...r, ...data, nextDate}:r);
  commit();
}
function deleteRecurring(id){ state.recurring = state.recurring.filter(r=>r.id!==id); commit(); }
function toggleRecurring(id){ state.recurring = state.recurring.map(r=>r.id===id?{...r, active:!r.active}:r); commit(); }
function executeRecurring(id){
  const r = state.recurring.find(x=>x.id===id); if(!r) return;
  addTransaction({type:r.type, bankId:r.bankId, amount:r.amount, category:r.category, note:r.note, date:todayStr()}, true);
  state.recurring = state.recurring.map(x=>x.id===id?{...x, nextDate: addMonthKeepDay(x.nextDate)}:x);
  commit();
}
function skipRecurring(id){ state.recurring = state.recurring.map(r=>r.id===id?{...r, nextDate: addMonthKeepDay(r.nextDate)}:r); commit(); }
function dueRecurring(){
  return state.recurring.filter(r=>r.active && daysUntil(r.nextDate)<=7).sort((a,b)=> a.nextDate<b.nextDate?-1:1);
}

function addLoan(data){
  state.loans.push({id:uid(), settled:false, ...data});
  if(data.bankId){
    addTransaction({ type: data.type==="lent"?"expense":"income", bankId:data.bankId, amount:data.amount,
      category: data.type==="lent"?"Loan Given":"Loan Received", note: data.person+" — loan", date:data.date }, true);
  }
  commit();
}
function settleLoan(id){
  const loan = state.loans.find(l=>l.id===id); if(!loan) return;
  state.loans = state.loans.map(l=>l.id===id?{...l, settled:true, settleDate:todayStr()}:l);
  if(loan.bankId){
    addTransaction({ type: loan.type==="lent"?"income":"expense", bankId:loan.bankId, amount:loan.amount,
      category: loan.type==="lent"?"Loan Repaid to Me":"Loan Repayment", note: loan.person+" — settled", date: todayStr() }, true);
  }
  commit();
}
function deleteLoan(id){ state.loans = state.loans.filter(l=>l.id!==id); commit(); }

/* ---------------- derived ---------------- */
function totalBalance(){ return state.banks.reduce((s,b)=>s+b.balance,0); }
function cardAccounts(){ return state.banks.filter(b=>b.isCard); }
function totalCardDebt(){ return cardAccounts().reduce((s,b)=>s+Math.max(0,-b.balance),0); }
// Available cash & bank money — sum of all non-card account balances.
// Equivalent to Net Worth + Credit Card Debt (e.g. -33,049 + 49,536 = 16,487).
function availableLiquidity(){ return state.banks.filter(b=>!b.isCard).reduce((s,b)=>s+b.balance,0); }
function isCardAccount(id){ const b=bankById(id); return !!(b&&b.isCard); }
function outstandingLent(){ return state.loans.filter(l=>l.type==="lent"&&!l.settled).reduce((s,l)=>s+l.amount,0); }
function outstandingBorrowed(){ return state.loans.filter(l=>l.type==="borrowed"&&!l.settled).reduce((s,l)=>s+l.amount,0); }
function overBudget(){ const ms=monthlySpend(); return budgetsForMonth(monthKey(todayStr())).filter(b=>(ms[b.category]||0) > b.limit); }
function budgetSummary(){
  const ms = monthlySpend();
  const budgets = budgetsForMonth(monthKey(todayStr()));
  const totalBudget = budgets.reduce((s,b)=>s+b.limit,0);
  const spent = budgets.reduce((s,b)=>s+(ms[b.category]||0),0);
  // Computed per category so an overspend in one category never inflates the
  // "Left to Spend" headroom of the others:
  //   overSpent   = sum of amounts spent beyond each category's limit
  //   leftToSpend = sum of remaining room only in categories still under budget
  const overSpent = budgets.reduce((s,b)=>s+Math.max(0,(ms[b.category]||0)-b.limit),0);
  const leftToSpend = budgets.reduce((s,b)=>s+Math.max(0,b.limit-(ms[b.category]||0)),0);
  return { totalBudget, spent, overSpent, leftToSpend, remaining: totalBudget - spent };
}

/* ---------------- report (date range, multi-page) ---------------- */
function lastDayOfMonth(mk){
  const [y,m] = mk.split("-").map(Number);
  return new Date(y, m, 0).toISOString().slice(0,10);
}
function monthLabel(mk){
  const [y,m] = mk.split("-").map(Number);
  return new Date(y, m-1, 1).toLocaleString('en-US', {month:'long', year:'numeric'});
}
function fmtDate(d){
  return new Date(d+"T00:00:00").toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}
function rangeData(from, to){
  const txns = state.transactions.filter(t => t.date && t.date>=from && t.date<=to).sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  const income = txns.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
  const expense = txns.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
  const byCat = {};
  txns.filter(t=>t.type==="expense").forEach(t=>{ byCat[t.category]=(byCat[t.category]||0)+t.amount; });
  const incomeByCat = {};
  txns.filter(t=>t.type==="income").forEach(t=>{ incomeByCat[t.category]=(incomeByCat[t.category]||0)+t.amount; });
  const budgetRows = state.budgets.filter(b=>{
    const mk = b.month || monthKey(from);
    return mk>=monthKey(from) && mk<=monthKey(to);
  }).map(b=>({category:b.category, limit:b.limit, spent: byCat[b.category]||0}));
  // Credit card activity in this period:
  // - cardPurchases: expenses charged directly to a credit-card account
  // - cardPayments: money transferred FROM a cash/bank account TO a credit-card account (bill payments)
  const cardPurchases = txns.filter(t=>t.type==="expense" && isCardAccount(t.bankId)).reduce((s,t)=>s+t.amount,0);
  const cardPayments = txns.filter(t=>t.type==="transfer" && isCardAccount(t.toBankId) && !isCardAccount(t.fromBankId)).reduce((s,t)=>s+t.amount,0);
  const savingsRate = income>0 ? ((income-expense)/income)*100 : 0;
  return { txns, income, expense, net: income-expense, byCat, incomeByCat, budgetRows, cardPurchases, cardPayments, savingsRate };
}

function rptBalanceSheetPage(){
  // Assets: positive bank/cash balances + money others owe you (unsettled loans given).
  // Liabilities: credit card debt + money you owe (unsettled loans taken).
  const cashAssets = state.banks.filter(b=>!isCardAccount(b.id)).reduce((s,b)=>s+Math.max(0,b.balance),0);
  const overdrawn = state.banks.filter(b=>!isCardAccount(b.id)).reduce((s,b)=>s+Math.max(0,-b.balance),0);
  const loansReceivable = state.loans.filter(l=>l.type==="lent" && !l.settled).reduce((s,l)=>s+l.amount,0);
  const loansPayable = state.loans.filter(l=>l.type==="borrowed" && !l.settled).reduce((s,l)=>s+l.amount,0);
  const cardDebt = state.banks.filter(b=>isCardAccount(b.id)).reduce((s,b)=>s+Math.max(0,-b.balance),0);

  const totalAssets = cashAssets + loansReceivable;
  const totalLiabilities = cardDebt + loansPayable + overdrawn;
  const netWorth = totalAssets - totalLiabilities;

  const assetRows = [
    ["Cash & Bank Balances", cashAssets],
    ["Loans Receivable (owed to you)", loansReceivable],
  ].filter(r=>r[1]!==0);
  const liabRows = [
    ["Credit Card Debt", cardDebt],
    ["Loans Payable (you owe)", loansPayable],
    ["Overdrawn Accounts", overdrawn],
  ].filter(r=>r[1]!==0);

  return rptPageOpen("Balance Sheet") + `
    <h1 class="rpt-h1">Statement of Financial Position</h1>
    <p class="rpt-period">As of ${fmtDate(todayStr())} · Cash basis</p>
    <table class="rpt-table">
      <thead><tr><th>Assets</th><th class="num">Amount</th></tr></thead>
      <tbody>
        ${assetRows.length ? assetRows.map(([c,v])=>`<tr><td>${esc(c)}</td><td class="num">${taka(v)}</td></tr>`).join("") : `<tr><td class="rpt-empty">No assets recorded</td><td class="num">${taka(0)}</td></tr>`}
        <tr class="rpt-total"><td>Total Assets</td><td class="num">${taka(totalAssets)}</td></tr>
      </tbody>
    </table>
    <table class="rpt-table" style="margin-top:18px;">
      <thead><tr><th>Liabilities</th><th class="num">Amount</th></tr></thead>
      <tbody>
        ${liabRows.length ? liabRows.map(([c,v])=>`<tr><td>${esc(c)}</td><td class="num">${taka(v)}</td></tr>`).join("") : `<tr><td class="rpt-empty">No liabilities recorded</td><td class="num">${taka(0)}</td></tr>`}
        <tr class="rpt-total"><td>Total Liabilities</td><td class="num">${taka(totalLiabilities)}</td></tr>
      </tbody>
    </table>
    <table class="rpt-table" style="margin-top:18px;">
      <tbody>
        <tr class="rpt-grand"><td>Net Worth (Assets − Liabilities)</td><td class="num" style="color:${netWorth>=0?'#1B4332':'#9B2C2C'}">${taka(netWorth)}</td></tr>
      </tbody>
    </table>
    <p class="rpt-note">Balances reflect current account values as of the generation date, not the reporting period end.</p>
  ` + rptPageClose();
}

function rptAccountStatementsPage(from, to){
  if(!state.banks.length) return "";
  return state.banks.map(bank => {
    const related = state.transactions.filter(t=>accountStatementEffect(t, bank.id));
    const before = related.filter(t=>t.date && t.date<from).reduce((s,t)=>s+balanceEffectForAccount(t, bank.id),0);
    const current = related.reduce((s,t)=>s+balanceEffectForAccount(t, bank.id),0);
    const opening = bank.balance - current + before;
    let running = opening;
    const rows = related.filter(t=>t.date && t.date>=from && t.date<=to).sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:a.createdAt-b.createdAt);
    const totalDebit = rows.reduce((s,t)=>s+accountStatementEffect(t, bank.id).debit,0);
    const totalCredit = rows.reduce((s,t)=>s+accountStatementEffect(t, bank.id).credit,0);
    return rptPageOpen("Account Statement") + `
      <h1 class="rpt-h1">Account Statement — ${esc(bank.name)}</h1>
      <p class="rpt-period">${fmtDate(from)} – ${fmtDate(to)}</p>
      <table class="rpt-kv" style="margin-bottom:14px;">
        <tr><td>Account</td><td class="num">${esc(bank.name)}</td></tr>
        <tr><td>Opening Balance</td><td class="num">${taka(opening)}</td></tr>
      </table>
      <table class="rpt-table">
        <thead><tr><th>Date</th><th>Transaction Details</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead>
        <tbody>
          <tr class="rpt-total"><td>${from}</td><td>Opening Balance</td><td class="num">—</td><td class="num">—</td><td class="num">${taka(opening)}</td></tr>
          ${rows.map(t=>{
            const e = accountStatementEffect(t, bank.id);
            running += e.credit - e.debit;
            return `<tr><td>${t.date}</td><td>${esc(e.details||"Transaction")}</td><td class="num">${e.debit?taka(e.debit):"—"}</td><td class="num">${e.credit?taka(e.credit):"—"}</td><td class="num">${taka(running)}</td></tr>`;
          }).join("")}
          <tr class="rpt-total"><td colspan="2">Totals</td><td class="num">${taka(totalDebit)}</td><td class="num">${taka(totalCredit)}</td><td class="num">—</td></tr>
          <tr class="rpt-grand"><td colspan="4">Closing Balance</td><td class="num">${taka(running)}</td></tr>
        </tbody>
      </table>
      ${rows.length===0 ? `<p class="rpt-note">No transactions found for this account in the selected date range.</p>` : ""}
    ` + rptPageClose();
  }).join("");
}

/* ---------------- backup / restore ---------------- */
function saveFile(text, filename, mime){
  // Best-effort silent attempt (works in a real desktop/Android browser) —
  // harmless if it does nothing in restricted in-app browsers.
  try{
    const blob = new Blob([text], {type: mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }catch(err){ /* ignore, guaranteed fallback below always runs */ }

  // Guaranteed fallback: show the content in a modal so it can be copied
  // manually. Works in every browser/app, including in-app browsers like
  // Documents by Readdle where downloads are blocked.
  state.modal = { type: "textexport", text, filename };
  render();
}

  saveFile(JSON.stringify(payload,null,2), "my-ledger-backup-"+todayStr()+".json", "application/json");

/* ---------------- CSV export / import (transactions) ---------------- */
function csvField(v){
  const s = (v==null?"":String(v));
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function transactionsToCSV(){
  const header = ["Date","Type","Account","Category","Amount","Note","TransferTo","Fee"];
  const rows = [...state.transactions].sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0).map(t => {
    if(t.type==="transfer"){
      return [t.date,"transfer",bankName_(t.fromBankId),"",t.amount,t.note||"",bankName_(t.toBankId),t.fee||0];
    }
    return [t.date,t.type,bankName_(t.bankId),t.category||"",t.amount,t.note||"","",""];
  });
  return [header, ...rows].map(r => r.map(csvField).join(",")).join("\r\n");
}
function downloadCSV(text, filename){

}

    ["2026-07-10","income", state.banks[0]?state.banks[0].name:"Prime", state.incomeCats[0]||"Salary", "20000", "", "", ""],
  ];
  downloadCSV([header, ...example].map(r=>r.map(csvField).join(",")).join("\r\n"), "my-ledger-transactions-template.csv");
}
function parseCSV(text){
  const rows = []; let row = []; let field = ""; let inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length===1 && r[0].trim()!==""));
}
function importTransactionsFromCSV(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const rows = parseCSV(e.target.result);
      if(rows.length < 2){ alert("This file has no data rows."); return; }
      const header = rows[0].map(h => h.trim().toLowerCase());
      const idx = (name) => header.indexOf(name);
      const iDate=idx("date"), iType=idx("type"), iAccount=idx("account"), iCategory=idx("category"), iAmount=idx("amount"), iNote=idx("note"), iTo=idx("transferto"), iFee=idx("fee");
      if(iDate<0 || iType<0 || iAccount<0 || iAmount<0){ alert("CSV is missing required columns: Date, Type, Account, Amount."); return; }
      if(!confirm("This will add "+(rows.length-1)+" transaction(s) from this file to your current data. Continue?")) return;

      let added = 0; const errors = [];
      for(let r=1; r<rows.length; r++){
        const row = rows[r];
        const date = (row[iDate]||"").trim();
        const type = (row[iType]||"").trim().toLowerCase();
        const accName = (row[iAccount]||"").trim();
        const category = iCategory>=0 ? (row[iCategory]||"").trim() : "";
        const amount = parseFloat(row[iAmount]);
        const note = iNote>=0 ? (row[iNote]||"").trim() : "";
        const toName = iTo>=0 ? (row[iTo]||"").trim() : "";
        const fee = iFee>=0 ? (parseFloat(row[iFee])||0) : 0;

        if(!date || !amount || amount<=0 || !accName){ errors.push("Row "+(r+1)+": missing date, account, or amount"); continue; }
        const bank = state.banks.find(b => b.name.toLowerCase() === accName.toLowerCase());
        if(!bank){ errors.push("Row "+(r+1)+": account '"+accName+"' not found"); continue; }

        if(type==="transfer"){
          const toBank = state.banks.find(b => b.name.toLowerCase() === toName.toLowerCase());
          if(!toBank){ errors.push("Row "+(r+1)+": transfer-to account '"+toName+"' not found"); continue; }
          addTransfer({fromBankId:bank.id, toBankId:toBank.id, amount, fee, note, date}, true);
        } else if(type==="income" || type==="expense"){
          if(category && !(type==="income"?state.incomeCats:state.expenseCats).includes(category)){
            addCategory(type==="income"?"income":"expense", category);
          }
          addTransaction({type, bankId:bank.id, amount, category: category||"Other", note, date}, true);
        } else { errors.push("Row "+(r+1)+": unknown type '"+type+"'"); continue; }
        added++;
      }
      persist(); render();
      alert("Imported "+added+" transaction(s)."+(errors.length ? "\n\nSkipped "+errors.length+":\n"+errors.slice(0,8).join("\n")+(errors.length>8?"\n...":"") : ""));
    }catch(err){ alert("Could not read this CSV file. Please check the format."); }
  };
  reader.readAsText(file);
}

function accountStatementEffect(t, bankId){
  if(t.type==="income" && t.bankId===bankId) return { debit:0, credit:t.amount, details:[t.category, t.note].filter(Boolean).join(" — ") };
  if(t.type==="expense" && t.bankId===bankId) return { debit:t.amount, credit:0, details:[t.category, t.note].filter(Boolean).join(" — ") };
  if(t.type==="transfer"){
    if(t.fromBankId===bankId) return { debit:t.amount, credit:0, details:`Transfer to ${bankName_(t.toBankId)}${t.note?" — "+t.note:""}` };
    if(t.toBankId===bankId) return { debit:0, credit:t.amount, details:`Transfer from ${bankName_(t.fromBankId)}${t.note?" — "+t.note:""}` };
  }
  return null;
}
function balanceEffectForAccount(t, bankId){
  const e = accountStatementEffect(t, bankId);
  return e ? e.credit - e.debit : 0;
}
function renderAccountStatementTable(from, to, bankId){
  const bank = bankById(bankId);
  if(!bank) return `<div class="empty">Select an account to generate a statement.</div>`;
  const related = state.transactions.filter(t=>accountStatementEffect(t, bankId));
  const before = related.filter(t=>t.date && t.date<from).reduce((s,t)=>s+balanceEffectForAccount(t, bankId),0);
  const current = related.reduce((s,t)=>s+balanceEffectForAccount(t, bankId),0);
  const opening = bank.balance - current + before;
  let running = opening;
  const rows = related.filter(t=>t.date && t.date>=from && t.date<=to).sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:a.createdAt-b.createdAt);
  const totalDebit = rows.reduce((s,t)=>s+accountStatementEffect(t, bankId).debit,0);
  const totalCredit = rows.reduce((s,t)=>s+accountStatementEffect(t, bankId).credit,0);
  return `<div class="card" style="overflow-x:auto;">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;">
      <div><div class="stat-label">Statement Account</div><div style="font-weight:700;color:var(--green);">${esc(bank.name)}</div></div>
      <div><div class="stat-label">Period</div><div>${fmtDate(from)} – ${fmtDate(to)}</div></div>
      <div><div class="stat-label">Opening Balance</div><div class="amt" style="font-weight:700;">${taka(opening)}</div></div>
    </div>
    <table class="rpt-table" style="min-width:680px;">
      <thead><tr><th>Date</th><th>Transaction Details</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead>
      <tbody>
        <tr class="rpt-total"><td>${from}</td><td>Opening Balance</td><td class="num">—</td><td class="num">—</td><td class="num">${taka(opening)}</td></tr>
        ${rows.map(t=>{
          const e = accountStatementEffect(t, bankId);
          running += e.credit - e.debit;
          return `<tr><td>${t.date}</td><td>${esc(e.details||"Transaction")}</td><td class="num">${e.debit?taka(e.debit):"—"}</td><td class="num">${e.credit?taka(e.credit):"—"}</td><td class="num">${taka(running)}</td></tr>`;
        }).join("")}
        <tr class="rpt-total"><td colspan="2">Totals</td><td class="num">${taka(totalDebit)}</td><td class="num">${taka(totalCredit)}</td><td class="num">—</td></tr>
        <tr class="rpt-grand"><td colspan="4" style="background:var(--green);color:var(--on-primary);font-weight:700;">Closing Balance</td><td class="num" style="background:var(--green);color:var(--on-primary);font-weight:700;">${taka(running)}</td></tr>
      </tbody>
    </table>
    ${rows.length===0 ? `<p class="rpt-note">No transactions found for this account in the selected date range.</p>` : ""}
  </div>`;
}
function accountCard(b, isCard){
  const displayVal = isCard ? Math.max(0,-b.balance) : b.balance;

/* ---------------- Transactions ---------------- */
function renderTransactions(){
  const f = state.txnFilters || { search:"", from:"", to:"", bank:"all", type:"all" };
  state.txnFilters = f;
  let list = [...state.transactions];
  if(f.bank!=="all") list = list.filter(t=>t.bankId===f.bank||t.fromBankId===f.bank||t.toBankId===f.bank);
  if(f.type!=="all") list = list.filter(t=>t.type===f.type);
  if(f.from) list = list.filter(t=>t.date>=f.from);
  if(f.to) list = list.filter(t=>t.date<=f.to);
  if(f.search.trim()){
    const q=f.search.trim().toLowerCase();
    list = list.filter(t => (t.category||"").toLowerCase().includes(q) || (t.note||"").toLowerCase().includes(q) || bankName_(t.bankId||t.fromBankId).toLowerCase().includes(q));
  }
  list.sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:b.createdAt-a.createdAt);

  return `
    <div class="row-between">
      <h2 class="section-title">Transaction Ledger</h2>
      <div style="display:flex;gap:8px;">
        <button class="btn-outline" ${state.banks.length<2?"disabled":""} data-action="open-modal" data-modal="transfer">${ICON.transfer} Transfer</button>
        <button class="btn-fill" ${state.banks.length===0?"disabled":""} data-action="open-modal" data-modal="transaction">${ICON.plus} Transaction</button>
      </div>
    </div>
    <div class="filters">
      <div class="search-box">${ICON.search}<input id="f-search" placeholder="Search category, note, account" value="${esc(f.search)}" /></div>
      <input type="date" id="f-from" value="${f.from}" />
      <input type="date" id="f-to" value="${f.to}" />
      <select id="f-type">
        <option value="all" ${f.type==='all'?'selected':''}>All Types</option>
        <option value="income" ${f.type==='income'?'selected':''}>Income</option>
        <option value="expense" ${f.type==='expense'?'selected':''}>Expense</option>
        <option value="transfer" ${f.type==='transfer'?'selected':''}>Transfer</option>
      </select>
      <select id="f-bank">
        <option value="all" ${f.bank==='all'?'selected':''}>All Accounts</option>
        ${state.banks.map(b=>`<option value="${b.id}" ${f.bank===b.id?'selected':''}>${esc(b.name)}</option>`).join("")}
      </select>
    </div>
    ${list.length===0 ? "" : filteredSummaryBar(list)}
    ${list.length===0 ? `<div class="empty">No transactions found.</div>` : renderLedger(list, true)}
  `;
}
// Summary of the currently-filtered transactions. Transfers are internal moves,
// so they're excluded from income/expense totals and only counted separately.
function filteredSummaryBar(list){
  const income = list.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
  const expense = list.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
  const transfers = list.filter(t=>t.type==="transfer").length;
  const net = income - expense;
  const cell = (label,val,color)=>`<div><div class="stat-label">${label}</div><div class="amt" style="font-size:17px;font-weight:700;${color?`color:${color};`:''}">${val}</div></div>`;
  return `<div class="card" style="margin-bottom:14px;">
    <div class="grid stat" style="grid-template-columns:repeat(4,1fr);gap:8px;">
      ${cell(`Showing ${list.length} txn${list.length===1?'':'s'}`, taka(income+expense))}
      ${cell("Income", taka(income), "var(--green-light)")}
      ${cell("Expense", taka(expense), "var(--red)")}
      ${cell(net>=0?"Net":"Net", (net>=0?"+":"−")+taka(Math.abs(net)), net>=0?"var(--green-light)":"var(--red)")}
    </div>
    ${transfers?`<div style="font-size:11.5px;color:var(--muted);margin-top:8px;">Excludes ${transfers} transfer${transfers===1?'':'s'} (internal movements).</div>`:""}
  </div>`;
}

/* ---------------- Budgets ---------------- */
function renderBudgets(){
  const mk = state.selectedBudgetMonth || monthKey(todayStr());
  const cm = monthKey(todayStr());
  const ms = spendForMonth(mk);
  const monthBudgets = budgetsForMonth(mk).slice().sort((a,b)=>b.limit-a.limit);
  const monthName = monthLabel(mk) + (mk===cm ? " · this month" : mk>cm ? " · upcoming" : " · past");
  let html = `<div class="row-between"><h2 class="section-title">Monthly Budgets</h2>
    <div style="display:flex;gap:8px;">
      <button class="btn-outline" data-action="open-modal" data-modal="categories">${ICON.tag} Categories</button>
      <button class="btn-fill" ${state.expenseCats.length===0?"disabled":""} data-action="open-modal" data-modal="budget">${ICON.plus} Add Budget</button>
    </div></div>
    <div class="filters" style="align-items:center;">
      <label class="field" style="flex-direction:row;align-items:center;gap:8px;margin:0;">
        <span>Budget month</span>
        <input type="month" id="budget-month-select" value="${mk}" />
      </label>
      <button class="btn-outline" style="padding:8px 12px;" data-action="budget-prev-month">‹ Prev</button>
      <button class="btn-outline" style="padding:8px 12px;" data-action="budget-next-month">Next ›</button>
      ${monthBudgets.length===0 && state.budgets.length ? `<button class="btn-outline" style="padding:8px 12px;" data-action="copy-budgets-from-prev">Copy from ${esc(monthLabel(addMonthKey(mk,-1)))}</button>` : ""}
      <span style="font-size:12.5px;color:var(--muted);margin-left:auto;">${esc(monthName)}</span>
    </div>`;
  if(monthBudgets.length===0){
    html += `<div class="empty">No budgets set for ${esc(monthLabel(mk))}. Add a budget above to plan this month${mk>cm?" ahead of time":""}.</div>`;
  } else {
    // Summary for the selected month — computed per category so an overspend in
    // one category never inflates another's "Left to Spend" headroom.
    const totalBudget = monthBudgets.reduce((s,b)=>s+b.limit,0);
    const spentTotal = monthBudgets.reduce((s,b)=>s+(ms[b.category]||0),0);
    const overSpent = monthBudgets.reduce((s,b)=>s+Math.max(0,(ms[b.category]||0)-b.limit),0);
    const leftToSpend = monthBudgets.reduce((s,b)=>s+Math.max(0,b.limit-(ms[b.category]||0)),0);
    const sumPct = totalBudget ? (spentTotal/totalBudget)*100 : 0;
    const sumColor = sumPct>100?"var(--red)":sumPct>70?"var(--gold)":"var(--green-light)";
    html += `<div class="card" style="margin-bottom:16px;">
      <div class="grid stat" style="margin-bottom:12px;">
        <div><div class="stat-label">Total Budget</div><div class="amt" style="font-size:19px;font-weight:700;">${taka(totalBudget)}</div></div>
        <div><div class="stat-label">Spent So Far</div><div class="amt" style="font-size:19px;font-weight:700;color:${sumColor}">${taka(spentTotal)}</div></div>
        <div><div class="stat-label">Over Spent</div><div class="amt" style="font-size:19px;font-weight:700;color:${overSpent>0?'var(--red)':'var(--muted)'}">${taka(overSpent)}</div></div>
        <div><div class="stat-label">Left to Spend</div><div class="amt" style="font-size:19px;font-weight:700;color:var(--green-light)">${taka(leftToSpend)}</div></div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,sumPct)}%;background:${sumColor};"></div></div>
    </div>`;

    const q = (state.budgetSearch||"").trim().toLowerCase();
    html += `<div class="search-box" style="margin-bottom:14px;">${ICON.search}<input id="budget-search" placeholder="Search category" value="${esc(state.budgetSearch||"")}" /></div>`;
    const shown = q ? monthBudgets.filter(b=>b.category.toLowerCase().includes(q)) : monthBudgets;
    if(shown.length===0){
      html += `<div class="empty">No budget categories match "${esc(state.budgetSearch||"")}".</div>`;
    } else {
    html += `<div style="display:flex;flex-direction:column;gap:12px;">${shown.map(b=>{
      const spent = ms[b.category]||0;
      const remaining = b.limit - spent;
      const pct = (spent/b.limit)*100;
      const color = pct>100?"var(--red)":pct>70?"var(--gold)":"var(--green-light)";
      return `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span style="font-weight:600;font-size:14.5px;">${esc(b.category)}</span>
            <span style="font-size:11px;font-weight:600;color:var(--muted);background:rgba(27,67,50,0.07);border:1px solid var(--border);border-radius:20px;padding:2px 9px;letter-spacing:.2px;">${esc(monthLabel(b.month))}</span>
          </span>
          <div style="display:flex;gap:4px;">
            <button class="icon-btn" data-action="edit-budget" data-id="${b.id}">${ICON.edit}</button>
            <button class="icon-btn" data-action="delete-budget" data-id="${b.id}">${ICON.trash}</button>
          </div>
        </div>
        <div class="grid stat" style="grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;">
          <div><div class="stat-label">Budgeted</div><div class="amt" style="font-size:16px;font-weight:700;">${taka(b.limit)}</div></div>
          <div><div class="stat-label">Spent</div><div class="amt" style="font-size:16px;font-weight:700;color:${color}">${taka(spent)}</div></div>
          <div><div class="stat-label">${remaining>=0?"Left to Spend":"Over By"}</div><div class="amt" style="font-size:16px;font-weight:700;color:${remaining>=0?'var(--green-light)':'var(--red)'}">${taka(Math.abs(remaining))}</div></div>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,pct)}%;background:${color};"></div></div>
        ${pct>100 ? `<div style="font-size:12px;color:var(--red);margin-top:5px;">Over budget!</div>` : ""}
        <div style="display:flex;gap:8px;margin-top:12px;">
          <button class="btn-outline" style="font-size:12.5px;padding:5px 12px;" data-action="copy-budget" data-id="${b.id}">Copy to month…</button>
          <button class="btn-outline" style="font-size:12.5px;padding:5px 12px;" data-action="move-budget" data-id="${b.id}">Move to month…</button>
        </div>
      </div>`;
    }).join("")}</div>`;
    }
  }
  return html;
}

/* ---------------- Goals ---------------- */
function renderGoals(){

      const pct = (g.saved/g.target)*100;
      const done = g.saved >= g.target;
      return `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:start;">
          <div><div style="font-weight:600;font-size:15px;">${esc(g.name)}</div>${g.targetDate?`<div style="font-size:12px;color:var(--muted);">Target date: ${g.targetDate}</div>`:""}</div>
          <div style="display:flex;gap:4px;">
            <button class="icon-btn" data-action="edit-goal" data-id="${g.id}">${ICON.edit}</button>
            <button class="icon-btn" data-action="delete-goal" data-id="${g.id}">${ICON.trash}</button>
          </div>
        </div>
        <div class="amt" style="font-size:18px;font-weight:700;margin:10px 0 6px;color:${done?'var(--green-light)':'var(--ink)'}">${taka(g.saved)} <span style="font-size:13px;font-weight:400;color:var(--muted)">/ ${taka(g.target)}</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,pct)}%;background:${done?'var(--green-light)':'var(--gold)'};"></div></div>

          : `<div style="display:flex;gap:6px;margin-top:10px;">
               <input type="number" placeholder="Add amount (৳)" id="goal-add-${g.id}" style="flex:1;padding:9px 11px;border-radius:8px;border:1px solid var(--border2);background:var(--card);font-size:14px;" />

             </div>`}
      </div>`;
    }).join("")}</div>`;

  return html;
}
