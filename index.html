/* ---------------- helpers ---------------- */
function bankById(id){ return state.banks.find(b=>b.id===id); }
function bankName_(id){ const b=bankById(id); return b?b.name:"Unknown"; }
function bankColor_(id){ const b=bankById(id); return b?b.color:"#444"; }
function adjustBalance(id, delta){
  state.banks = state.banks.map(b => b.id===id ? {...b, balance: b.balance+delta} : b);
}

/* ---------------- mutations ---------------- */
function addBank(data){
  state.banks.push({ id: uid(), color: BANK_COLORS[state.banks.length % BANK_COLORS.length], ...data });
  commit();
}
function updateBank(id, data){
  state.banks = state.banks.map(b=>b.id===id?{...b, name:data.name, balance:data.balance, creditLimit:data.creditLimit}:b);
  commit();
}
// Reorder the dragged account so it sits before `beforeId` (or at the end of its
// group when beforeId is null). Only reorders within the same group implicitly,
// since drop targets are scoped per group in the UI.
function reorderBanks(draggedId, beforeId){
  if(draggedId===beforeId) return;
  const arr = state.banks.slice();
  const from = arr.findIndex(b=>b.id===draggedId);
  if(from<0) return;
  const [moved] = arr.splice(from,1);
  let to = beforeId ? arr.findIndex(b=>b.id===beforeId) : arr.length;
  if(to<0) to = arr.length;
  arr.splice(to,0,moved);
  state.banks = arr;
  commit();
}
function deleteBank(id){
  const hasTxns = state.transactions.some(t=>t.bankId===id||t.fromBankId===id||t.toBankId===id);
  if(hasTxns && !confirm("Transactions linked to this account will also be deleted. Continue?")) return;

  // Reverse the effect on the OTHER (surviving) account for any transfer that touches this account,
  // including any linked transfer-fee charged to a surviving account — otherwise that account's
  // balance stays permanently wrong after this account disappears.
  state.transactions.forEach(t=>{
    if(t.type!=="transfer") return;
    const touchesFrom = t.fromBankId===id, touchesTo = t.toBankId===id;
    if(touchesFrom && !touchesTo){
      adjustBalance(t.toBankId, -t.amount); // undo the credit the other account received
    } else if(touchesTo && !touchesFrom){
      adjustBalance(t.fromBankId, t.amount); // undo the debit the other account paid
      const feeTxn = state.transactions.find(x=>x.relatedTransferId===t.id);
      if(feeTxn && feeTxn.bankId!==id) adjustBalance(feeTxn.bankId, feeTxn.amount); // undo the fee too
    }
  });

  const removedTransferIds = new Set(
    state.transactions.filter(t=>t.type==="transfer" && (t.fromBankId===id || t.toBankId===id)).map(t=>t.id)
  );
  // Plans that belong to this card (if it is a card) disappear with it.
  const removedEmiIds = new Set((state.emis||[]).filter(e=>e.cardId===id).map(e=>e.id));
  state.banks = state.banks.filter(b=>b.id!==id);
  state.emis = (state.emis||[]).filter(e=>e.cardId!==id);
  state.transactions = state.transactions.filter(t=>
    t.bankId!==id && t.fromBankId!==id && t.toBankId!==id && !removedTransferIds.has(t.relatedTransferId)
  );
  // Installments already paid from other accounts stay in the ledger as normal expenses;
  // drop their emiId link so they are not stuck as un-editable orphans.
  state.transactions.forEach(t=>{ if(t.emiId && removedEmiIds.has(t.emiId)) delete t.emiId; });
  // If a paying bank was deleted its installment entries are gone: keep paidCount honest.
  (state.emis||[]).forEach(e=>syncEmiPaidCount(e.id));
  commit();
}
function addCategory(type,name){
  const n=(name||"").trim(); if(!n) return;
  if(type==="expense"){ if(!state.expenseCats.includes(n)) state.expenseCats.push(n); }
  else { if(!state.incomeCats.includes(n)) state.incomeCats.push(n); }
  commit();
}
function deleteCategory(type,name){
  if(type==="expense") state.expenseCats = state.expenseCats.filter(c=>c!==name);
  else state.incomeCats = state.incomeCats.filter(c=>c!==name);
  commit();
}
function addTransaction(data, skipCommit){
  const txn = { id: uid(), createdAt: Date.now(), type:data.type, bankId:data.bankId, amount:data.amount, category:data.category, note:data.note, date:data.date };
  state.transactions.push(txn);
  adjustBalance(data.bankId, data.type==="income" ? data.amount : -data.amount);
  if(!skipCommit) commit();
  return txn;
}
function updateTransaction(id, data){
  const idx = state.transactions.findIndex(x=>x.id===id);
  if(idx<0) return;
  const old = state.transactions[idx];
  // reverse the old entry's effect on its account, then apply the new one
  adjustBalance(old.bankId, old.type==="income" ? -old.amount : old.amount);
  adjustBalance(data.bankId, data.type==="income" ? data.amount : -data.amount);
  state.transactions[idx] = { ...old, type:data.type, bankId:data.bankId, amount:data.amount, category:data.category, note:data.note, date:data.date };
  commit();
}
function deleteTransaction(id){
  const t = state.transactions.find(x=>x.id===id); if(!t) return;
  if(t.type==="transfer"){
    const feeTxn = state.transactions.find(x=>x.relatedTransferId===id);
    if(feeTxn) adjustBalance(feeTxn.bankId, feeTxn.amount);
    state.transactions = state.transactions.filter(x=>x.id!==id && x.relatedTransferId!==id);
    adjustBalance(t.fromBankId, t.amount);
    adjustBalance(t.toBankId, -t.amount);
  } else {
    state.transactions = state.transactions.filter(x=>x.id!==id);
    adjustBalance(t.bankId, t.type==="income" ? -t.amount : t.amount);
  }
  if(t.emiId) syncEmiPaidCount(t.emiId);
  commit();
}
function addTransfer(data, skipCommit){
  const txn = { id: uid(), createdAt: Date.now(), type:"transfer", fromBankId:data.fromBankId, toBankId:data.toBankId, amount:data.amount, fee:data.fee||0, note:data.note, date:data.date };
  state.transactions.push(txn);
  adjustBalance(data.fromBankId, -data.amount);
  adjustBalance(data.toBankId, data.amount);
  if(data.fee && data.fee > 0){
    if(!state.expenseCats.includes("Bank Charge")) state.expenseCats.push("Bank Charge");
    const feeTxn = { id: uid(), createdAt: Date.now()+1, type:"expense", bankId:data.fromBankId, amount:data.fee, category:"Bank Charge", note:"Transfer fee to "+bankName_(data.toBankId), date:data.date, relatedTransferId: txn.id };
    state.transactions.push(feeTxn);
    adjustBalance(data.fromBankId, -data.fee);
  }
  if(!skipCommit) commit();
  return txn;
}
function updateTransfer(id, data){
  const t = state.transactions.find(x=>x.id===id && x.type==="transfer");
  if(!t) return;
  // reverse the old transfer (and its linked fee, if any)
  const feeTxn = state.transactions.find(x=>x.relatedTransferId===id);
  if(feeTxn) adjustBalance(feeTxn.bankId, feeTxn.amount);
  state.transactions = state.transactions.filter(x=>x.id!==id && x.relatedTransferId!==id);
  adjustBalance(t.fromBankId, t.amount);
  adjustBalance(t.toBankId, -t.amount);
  // re-apply as new data, keeping the same id/createdAt so the row doesn't jump in the list
  const newTxn = { id:t.id, createdAt:t.createdAt, type:"transfer", fromBankId:data.fromBankId, toBankId:data.toBankId, amount:data.amount, fee:data.fee||0, note:data.note, date:data.date };
  state.transactions.push(newTxn);
  adjustBalance(data.fromBankId, -data.amount);
  adjustBalance(data.toBankId, data.amount);
  if(data.fee && data.fee > 0){
    if(!state.expenseCats.includes("Bank Charge")) state.expenseCats.push("Bank Charge");
    const newFeeTxn = { id: uid(), createdAt: t.createdAt+1, type:"expense", bankId:data.fromBankId, amount:data.fee, category:"Bank Charge", note:"Transfer fee to "+bankName_(data.toBankId), date:data.date, relatedTransferId: t.id };
    state.transactions.push(newFeeTxn);
    adjustBalance(data.fromBankId, -data.fee);
  }
  commit();
}
/* ---- EMI mutations ----
   Creating a plan reserves the full price against the card limit (available drops
   right away). Paying an installment posts a normal expense from the paying
   account, so the month's expense figure shows only that installment. */
function addEMI(data){
  const plan = {
    id: uid(), cardId: data.cardId, title: data.title || "EMI purchase",
    principal: Math.round((Number(data.principal)||0)*100)/100,
    monthly: Math.round((Number(data.monthly)||0)*100)/100,
    months: Math.max(1, parseInt(data.months,10)||1),
    paidCount: 0, startDate: data.startDate || todayStr(),
    category: data.category || "Other", note: data.note || ""
  };
  state.emis = state.emis || [];
  state.emis.push(plan);
  commit();
  return plan;
}
function payEMI(id, bankId, date){
  const e = (state.emis||[]).find(x=>x.id===id);
  if(!e || emiIsDone(e)) return null;
  const idx = e.paidCount || 0;
  const amount = emiInstallmentAmount(e, idx);
  const payDate = date || emiNextDueDate(e) || todayStr();
  const txn = addTransaction({
    type:"expense", bankId, amount, category: e.category || "Other",
    note: (e.title||"EMI") + " — installment " + (idx+1) + "/" + e.months, date: payDate
  }, true);
  txn.emiId = e.id;
  state.emis = state.emis.map(x => x.id===id ? {...x, paidCount: idx+1} : x);
  commit();
  return { plan: state.emis.find(x=>x.id===id), txn };
}
function deleteEMI(id){
  // Undo the bank-account effect of every installment already paid for this plan
  state.transactions.filter(t=>t.emiId===id).forEach(t=>adjustBalance(t.bankId, t.amount));
  state.emis = (state.emis||[]).filter(e=>e.id!==id);
  state.transactions = state.transactions.filter(t=>t.emiId!==id);
  commit();
}
function addBudget(data){ state.budgets.push({id:uid(), ...data}); commit(); }
function updateBudget(id, data){
  state.budgets = state.budgets.map(b=>{
    if(b.id!==id) return b;
    const updated = {...b, ...data};
    // If user sets a real limit (>0), clear the autoCreated flag so it becomes a normal budget
    if(updated.limit > 0 && b.autoCreated) delete updated.autoCreated;
    return updated;
  });
  commit();
}
function deleteBudget(id){ state.budgets = state.budgets.filter(b=>b.id!==id); commit(); }
// Copy every budget from month `fromMk` into `toMk`, skipping categories that
// already have a budget in the target month.
function copyBudgetsToMonth(fromMk, toMk){
  const existing = new Set(budgetsForMonth(toMk).map(b=>b.category));
  const src = budgetsForMonth(fromMk).filter(b=>!existing.has(b.category));
  if(!src.length) return 0;
  src.forEach(b => state.budgets.push({ id:uid(), category:b.category, limit:b.limit, month:toMk }));
  commit();
  return src.length;
}
// Copy a single budget to another month. Returns false if that category already
// has a budget in the target month (so we don't create duplicates).
function copyBudgetToMonth(id, toMk){
  const b = state.budgets.find(x=>x.id===id); if(!b) return false;
  if(budgetsForMonth(toMk).some(x=>x.category===b.category)) return false;
  state.budgets.push({ id:uid(), category:b.category, limit:b.limit, month:toMk });
  commit();
  return true;
}
// Move a single budget to another month (relocate — original month loses it).
function moveBudgetToMonth(id, toMk){
  const b = state.budgets.find(x=>x.id===id); if(!b) return false;
  if(b.month===toMk) return true;
  if(budgetsForMonth(toMk).some(x=>x.category===b.category)) return false;
  state.budgets = state.budgets.map(x=>x.id===id?{...x, month:toMk}:x);
  commit();
  return true;
}
function monthlySpend(){
  return spendForMonth(monthKey(todayStr()));
}
// Spend per category for a given month key ("YYYY-MM"), compared by each
// transaction's own date — so a transaction dated next month counts toward
// next month's budget.
function spendForMonth(mk){
  const map = {};
  state.transactions.forEach(t=>{ if(t.type==="expense" && monthKey(t.date)===mk){ map[t.category]=(map[t.category]||0)+t.amount; } });
  return map;
}
function budgetsForMonth(mk){
  const real = state.budgets.filter(b=>b.month===mk);
  const ms = spendForMonth(mk);
  const synthesized = [];
  Object.keys(ms).forEach(category => {
    if(!real.some(b => b.category === category)){
      synthesized.push({
        id: `auto-${category}-${mk}`,
        category,
        limit: 0,
        month: mk,
        autoCreated: true
      });
    }
  });
  return [...real, ...synthesized];
}
function findBudgetById(id){
  const real = state.budgets.find(b=>b.id===id);
  if(real) return real;
  if(id && id.startsWith('auto-')){
    const parts = id.split('-');
    const mk = parts[parts.length-2] + '-' + parts[parts.length-1];
    const category = parts.slice(1, parts.length-2).join('-');
    return { id, category, limit: 0, month: mk, autoCreated: true };
  }
  return null;
}
function unbudgetedSpending(){
  const cm = monthKey(todayStr());
  return budgetsForMonth(cm).filter(b => b.autoCreated);
}
function addGoal(data){ state.goals.push({id:uid(), saved:0, ...data}); commit(); }
function updateGoal(id, data){ state.goals = state.goals.map(g=>g.id===id?{...g, ...data}:g); commit(); }
function contributeGoal(id, amt){ state.goals = state.goals.map(g=>g.id===id?{...g, saved:g.saved+amt}:g); commit(); }
function deleteGoal(id){ state.goals = state.goals.filter(g=>g.id!==id); commit(); }

function addRecurring(data){ state.recurring.push({id:uid(), active:true, ...data}); commit(); }
function updateRecurring(id, data){
  const existing = state.recurring.find(r=>r.id===id);
  if(!existing) return;
  let nextDate = existing.nextDate;
  if(data.dayOfMonth !== existing.dayOfMonth){
    const now = new Date();
    nextDate = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(data.dayOfMonth).padStart(2,"0");
    if(nextDate < todayStr()) nextDate = addMonthKeepDay(nextDate);
  }
  state.recurring = state.recurring.map(r=>r.id===id?{...r, ...data, nextDate}:r);
  commit();
}
function deleteRecurring(id){ state.recurring = state.recurring.filter(r=>r.id!==id); commit(); }
function toggleRecurring(id){ state.recurring = state.recurring.map(r=>r.id===id?{...r, active:!r.active}:r); commit(); }
function executeRecurring(id){
  const r = state.recurring.find(x=>x.id===id); if(!r) return;
  addTransaction({type:r.type, bankId:r.bankId, amount:r.amount, category:r.category, note:r.note, date:todayStr()}, true);
  state.recurring = state.recurring.map(x=>x.id===id?{...x, nextDate: addMonthKeepDay(x.nextDate)}:x);
  commit();
}
function skipRecurring(id){ state.recurring = state.recurring.map(r=>r.id===id?{...r, nextDate: addMonthKeepDay(r.nextDate)}:r); commit(); }
function dueRecurring(){
  return state.recurring.filter(r=>r.active && daysUntil(r.nextDate)<=7).sort((a,b)=> a.nextDate<b.nextDate?-1:1);
}

function addLoan(data){
  state.loans.push({id:uid(), settled:false, ...data});
  if(data.bankId){
    addTransaction({ type: data.type==="lent"?"expense":"income", bankId:data.bankId, amount:data.amount,
      category: data.type==="lent"?"Loan Given":"Loan Received", note: data.person+" — loan", date:data.date }, true);
  }
  commit();
}
function settleLoan(id){
  const loan = state.loans.find(l=>l.id===id); if(!loan) return;
  state.loans = state.loans.map(l=>l.id===id?{...l, settled:true, settleDate:todayStr()}:l);
  if(loan.bankId){
    addTransaction({ type: loan.type==="lent"?"income":"expense", bankId:loan.bankId, amount:loan.amount,
      category: loan.type==="lent"?"Loan Repaid to Me":"Loan Repayment", note: loan.person+" — settled", date: todayStr() }, true);
  }
  commit();
}
function deleteLoan(id){ state.loans = state.loans.filter(l=>l.id!==id); commit(); }

/* ---------------- derived ---------------- */
function totalBalance(){ return state.banks.reduce((s,b)=>s+b.balance,0) - totalEmiRemaining(); }
function cardAccounts(){ return state.banks.filter(b=>b.isCard); }
function totalEmiRemaining(){ return (state.emis||[]).reduce((s,e)=>s+emiRemaining(e),0); }
function totalCardDebt(){ return cardAccounts().reduce((s,b)=>s+cardOwedTotal(b),0); }
// Available cash & bank money — sum of all non-card account balances.
// Equivalent to Net Worth + Credit Card Debt (e.g. -33,049 + 49,536 = 16,487).
function availableLiquidity(){ return state.banks.filter(b=>!b.isCard).reduce((s,b)=>s+b.balance,0); }
function isCardAccount(id){ const b=bankById(id); return !!(b&&b.isCard); }

/* ---------------- EMI plans on credit cards ----------------
   An EMI purchase doesn't post an expense up-front. Instead the plan tracks how
   much of the card limit this purchase has blocked, so "available" drops by the
   full price immediately and climbs back as each monthly installment is paid.
   Installments themselves are real expenses from the paying bank account, which
   keeps every month's expense figure accurate (2000/month, not 12000 once). */
function emiPlansForCard(cardId){ return (state.emis||[]).filter(e=>e.cardId===cardId); }
function round2(n){ return Math.round(n*100)/100; }
// Build the whole installment schedule up front so rounding never drifts: each
// month is the round-2 monthly figure and the last month takes the remainder,
// which keeps the sum exactly equal to the purchase price.
function emiSchedule(e){
  const months = Math.max(1, parseInt(e.months,10)||1);
  const monthly = round2(Number(e.monthly)||0);
  let remaining = round2(Number(e.principal)||0);
  const out = [];
  for(let i=0;i<months;i++){
    const amt = i===months-1 ? remaining : round2(Math.min(monthly, remaining));
    out.push(Math.max(0, amt));
    remaining = round2(remaining - Math.max(0, amt));
  }
  return out;
}
function emiInstallmentAmount(e, i){ return emiSchedule(e)[i] || 0; }
function emiPaidAmount(e){
  const sched = emiSchedule(e);
  let sum = 0;
  for(let i=0;i<Math.min(e.paidCount||0, sched.length);i++) sum += sched[i];
  return round2(sum);
}
function emiRemaining(e){ return round2(Math.max(0, (Number(e.principal)||0) - emiPaidAmount(e))); }
function emiRemainingForCard(cardId){
  return emiPlansForCard(cardId).reduce((s,e)=>s+emiRemaining(e), 0);
}
function emiIsDone(e){ return (e.paidCount||0) >= (e.months||0) || emiRemaining(e) <= 0; }
// Keep paidCount honest when an installment transaction is deleted or re-added
// elsewhere (ledger delete, account deletion, restore from backup).
function syncEmiPaidCount(emiId){
  const e = (state.emis||[]).find(x=>x.id===emiId);
  if(!e) return;
  const n = state.transactions.filter(t=>t.emiId===emiId).length;
  e.paidCount = Math.min(n, e.months||n);
}
function cardOwedTotal(b){ return Math.max(0,-b.balance) + emiRemainingForCard(b.id); }
function cardAvailable(b){ return Math.max(0, (Number(b.creditLimit)||0) - cardOwedTotal(b)); }
function addMonthsClamped(dateStr, n){
  const [y,m,d] = dateStr.split("-").map(Number);
  const total = (y*12 + (m-1)) + n;
  const ny = Math.floor(total/12), nm = (total%12)+1;
  const last = new Date(ny, nm, 0).getDate();
  return ny+"-"+String(nm).padStart(2,"0")+"-"+String(Math.min(d,last)).padStart(2,"0");
}
function emiNextDueDate(e){
  if(emiIsDone(e)) return null;
  return addMonthsClamped(e.startDate, (e.paidCount||0)+1);
}
function outstandingLent(){ return state.loans.filter(l=>l.type==="lent"&&!l.settled).reduce((s,l)=>s+l.amount,0); }
function outstandingBorrowed(){ return state.loans.filter(l=>l.type==="borrowed"&&!l.settled).reduce((s,l)=>s+l.amount,0); }
function overBudget(){ const ms=monthlySpend(); return budgetsForMonth(monthKey(todayStr())).filter(b=>!b.autoCreated && (ms[b.category]||0) > b.limit); }
function budgetSummary(){
  const ms = monthlySpend();
  const budgets = budgetsForMonth(monthKey(todayStr()));
  const totalBudget = budgets.reduce((s,b)=>s+b.limit,0);
  const spent = budgets.reduce((s,b)=>s+(ms[b.category]||0),0);
  // Computed per category so an overspend in one category never inflates the
  // "Left to Spend" headroom of the others:
  //   overSpent   = sum of amounts spent beyond each category's limit
  //   leftToSpend = sum of remaining room only in categories still under budget
  const overSpent = budgets.reduce((s,b)=>s+Math.max(0,(ms[b.category]||0)-b.limit),0);
  const leftToSpend = budgets.reduce((s,b)=>s+Math.max(0,b.limit-(ms[b.category]||0)),0);
  return { totalBudget, spent, overSpent, leftToSpend, remaining: totalBudget - spent };
}

/* ---------------- report (date range, multi-page) ---------------- */
function lastDayOfMonth(mk){
  const [y,m] = mk.split("-").map(Number);
  return new Date(y, m, 0).toISOString().slice(0,10);
}
function monthLabel(mk){
  const [y,m] = mk.split("-").map(Number);
  return new Date(y, m-1, 1).toLocaleString('en-US', {month:'long', year:'numeric'});
}
function fmtDate(d){
  return new Date(d+"T00:00:00").toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}
function rangeData(from, to){
  const txns = state.transactions.filter(t => t.date && t.date>=from && t.date<=to).sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  const income = txns.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
  const expense = txns.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
  const byCat = {};
  txns.filter(t=>t.type==="expense").forEach(t=>{ byCat[t.category]=(byCat[t.category]||0)+t.amount; });
  const incomeByCat = {};
  txns.filter(t=>t.type==="income").forEach(t=>{ incomeByCat[t.category]=(incomeByCat[t.category]||0)+t.amount; });
  const budgetRows = state.budgets.filter(b=>{
    const mk = b.month || monthKey(from);
    return mk>=monthKey(from) && mk<=monthKey(to);
  }).map(b=>({category:b.category, limit:b.limit, spent: byCat[b.category]||0}));
  // Credit card activity in this period:
  // - cardPurchases: expenses charged to a credit card + transfers originating FROM a credit card (usage/spending)
  // - cardPayments: money transferred FROM a cash/bank account TO a credit-card account (bill payments)
  const cardPurchases = txns.filter(t => (t.type==="expense" && isCardAccount(t.bankId)) || (t.type==="transfer" && isCardAccount(t.fromBankId))).reduce((s,t)=>s+t.amount,0);
  const cardPayments = txns.filter(t => t.type==="transfer" && isCardAccount(t.toBankId) && !isCardAccount(t.fromBankId)).reduce((s,t)=>s+t.amount,0);
  const savingsRate = income>0 ? ((income-expense)/income)*100 : 0;
  // EMI: a plan counts as a card purchase on its purchase date (startDate). Its monthly
  // installments are ordinary expenses (already inside `expense`), so they are shown
  // separately here only for information and are NOT added to purchases again.
  const emiPlans = (state.emis||[]).filter(e => e.startDate && e.startDate>=from && e.startDate<=to);
  const emiPurchases = emiPlans.reduce((s,e)=>s+(Number(e.principal)||0),0);
  const emiInstallments = txns.filter(t=>t.emiId).reduce((s,t)=>s+t.amount,0);
  return { txns, income, expense, net: income-expense, byCat, incomeByCat, budgetRows,
    cardPurchases: cardPurchases + emiPurchases, cardPayments, savingsRate,
    emiPlans, emiPurchases, emiInstallments };
}
function getMonthsInRange(from, to){
  const months = [];
  let [currY, currM] = from.split("-").map(Number);
  const [endY, endM] = to.split("-").map(Number);
  while(currY < endY || (currY === endY && currM <= endM)){
    months.push(`${currY}-${String(currM).padStart(2,'0')}`);
    currM++;
    if(currM > 12){ currM = 1; currY++; }
  }
  return months;
}

      </div>
      <p style="font-size:12px;color:var(--muted);margin-top:4px;">${totalSavings >= 0 ? "Great job! You are in surplus for this period." : "Your total savings are in a negative figure for this period. Try to review your expenses."}</p>
    </div>

  // category so an overspend never cancels out another category's headroom.
  const totalBudget = d.budgetRows.reduce((s,b)=>s+b.limit,0);

function rptBalanceSheetPage(){
  // Assets: positive bank/cash balances + money others owe you (unsettled loans given).
  // Liabilities: credit card debt + money you owe (unsettled loans taken).
  const cashAssets = state.banks.filter(b=>!isCardAccount(b.id)).reduce((s,b)=>s+Math.max(0,b.balance),0);
  const overdrawn = state.banks.filter(b=>!isCardAccount(b.id)).reduce((s,b)=>s+Math.max(0,-b.balance),0);
  const loansReceivable = state.loans.filter(l=>l.type==="lent" && !l.settled).reduce((s,l)=>s+l.amount,0);
  const loansPayable = state.loans.filter(l=>l.type==="borrowed" && !l.settled).reduce((s,l)=>s+l.amount,0);
  const cardBalanceDebt = state.banks.filter(b=>isCardAccount(b.id)).reduce((s,b)=>s+Math.max(0,-b.balance),0);
  const emiOutstanding = state.banks.filter(b=>isCardAccount(b.id)).reduce((s,b)=>s+emiRemainingForCard(b.id),0);
  const cardDebt = cardBalanceDebt + emiOutstanding;

  const totalAssets = cashAssets + loansReceivable;
  const totalLiabilities = cardDebt + loansPayable + overdrawn;
  const netWorth = totalAssets - totalLiabilities;

  const assetRows = [
    ["Cash & Bank Balances", cashAssets],
    ["Loans Receivable (owed to you)", loansReceivable],
  ].filter(r=>r[1]!==0);
  const liabRows = [
    ["Credit Card Balance Owed", cardBalanceDebt],
    ["EMI Outstanding (blocked on card limit)", emiOutstanding],
    ["Loans Payable (you owe)", loansPayable],
    ["Overdrawn Accounts", overdrawn],
  ].filter(r=>r[1]!==0);

  return rptPageOpen("Balance Sheet") + `
    <h1 class="rpt-h1">Statement of Financial Position</h1>
    <p class="rpt-period">As of ${fmtDate(todayStr())} · Cash basis</p>
    <table class="rpt-table">
      <thead><tr><th>Assets</th><th class="num">Amount</th></tr></thead>
      <tbody>
        ${assetRows.length ? assetRows.map(([c,v])=>`<tr><td>${esc(c)}</td><td class="num">${taka(v)}</td></tr>`).join("") : `<tr><td class="rpt-empty">No assets recorded</td><td class="num">${taka(0)}</td></tr>`}
        <tr class="rpt-total"><td>Total Assets</td><td class="num">${taka(totalAssets)}</td></tr>
      </tbody>
    </table>
    <table class="rpt-table" style="margin-top:18px;">
      <thead><tr><th>Liabilities</th><th class="num">Amount</th></tr></thead>
      <tbody>
        ${liabRows.length ? liabRows.map(([c,v])=>`<tr><td>${esc(c)}</td><td class="num">${taka(v)}</td></tr>`).join("") : `<tr><td class="rpt-empty">No liabilities recorded</td><td class="num">${taka(0)}</td></tr>`}
        <tr class="rpt-total"><td>Total Liabilities</td><td class="num">${taka(totalLiabilities)}</td></tr>
      </tbody>
    </table>
    <table class="rpt-table" style="margin-top:18px;">
      <tbody>
        <tr class="rpt-grand"><td>Net Worth (Assets − Liabilities)</td><td class="num" style="color:${netWorth>=0?'#1B4332':'#9B2C2C'}">${taka(netWorth)}</td></tr>
      </tbody>
    </table>
    <p class="rpt-note">Balances reflect current account values as of the generation date, not the reporting period end.</p>
  ` + rptPageClose();
}

function rptAccountStatementsPage(from, to){
  if(!state.banks.length) return "";
  return state.banks.map(bank => {
    const related = state.transactions.filter(t=>accountStatementEffect(t, bank.id));
    const before = related.filter(t=>t.date && t.date<from).reduce((s,t)=>s+balanceEffectForAccount(t, bank.id),0);
    const current = related.reduce((s,t)=>s+balanceEffectForAccount(t, bank.id),0);
    const opening = bank.balance - current + before;
    let running = opening;
    const rows = related.filter(t=>t.date && t.date>=from && t.date<=to).sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:a.createdAt-b.createdAt);
    const totalDebit = rows.reduce((s,t)=>s+accountStatementEffect(t, bank.id).debit,0);
    const totalCredit = rows.reduce((s,t)=>s+accountStatementEffect(t, bank.id).credit,0);
    return rptPageOpen("Account Statement") + `
      <h1 class="rpt-h1">Account Statement — ${esc(bank.name)}</h1>

/* ---------------- backup / restore ---------------- */
function saveFile(text, filename, mime){
  // Best-effort silent attempt (works in a real desktop/Android browser) —
  // harmless if it does nothing in restricted in-app browsers.
  try{
    const blob = new Blob([text], {type: mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }catch(err){ /* ignore, guaranteed fallback below always runs */ }

  // Guaranteed fallback: show the content in a modal so it can be copied
  // manually. Works in every browser/app, including in-app browsers like
  // Documents by Readdle where downloads are blocked.
  state.modal = { type: "textexport", text, filename };
  render();
}

  saveFile(JSON.stringify(payload,null,2), "my-ledger-backup-"+todayStr()+".json", "application/json");

function csvField(v){
  const s = (v==null?"":String(v));
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function transactionsToCSV(){
  const header = ["Date","Type","Account","Category","Amount","Note","TransferTo","Fee"];
  const rows = [...state.transactions].sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0).map(t => {
    if(t.type==="transfer"){
      return [t.date,"transfer",bankName_(t.fromBankId),"",t.amount,t.note||"",bankName_(t.toBankId),t.fee||0];
    }
    return [t.date,t.type,bankName_(t.bankId),t.category||"",t.amount,t.note||"","",""];
  });
  return [header, ...rows].map(r => r.map(csvField).join(",")).join("\r\n");
}
function downloadCSV(text, filename){
  saveFile("\uFEFF"+text, filename, "text/csv");
}
function exportTransactionsCSV(){

function downloadCSVTemplate(){

  ];
  downloadCSV([header, ...example].map(r=>r.map(csvField).join(",")).join("\r\n"), "my-ledger-transactions-template.csv");
}
function parseCSV(text){
  const rows = []; let row = []; let field = ""; let inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length===1 && r[0].trim()!==""));
}
function importTransactionsFromCSV(file){
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const rows = parseCSV(e.target.result);
      if(rows.length < 2){ alert("This file has no data rows."); return; }
      const header = rows[0].map(h => h.trim().toLowerCase());
      const idx = (name) => header.indexOf(name);
      const iDate=idx("date"), iType=idx("type"), iAccount=idx("account"), iCategory=idx("category"), iAmount=idx("amount"), iNote=idx("note"), iTo=idx("transferto"), iFee=idx("fee");
      if(iDate<0 || iType<0 || iAccount<0 || iAmount<0){ alert("CSV is missing required columns: Date, Type, Account, Amount."); return; }
      if(!confirm("This will add "+(rows.length-1)+" transaction(s) from this file to your current data. Continue?")) return;
      if(!(await requireAdminPassword("Import CSV transactions"))) return;

      let added = 0; const errors = [];
      for(let r=1; r<rows.length; r++){
        const row = rows[r];
        const date = (row[iDate]||"").trim();
        const type = (row[iType]||"").trim().toLowerCase();
        const accName = (row[iAccount]||"").trim();
        const category = iCategory>=0 ? (row[iCategory]||"").trim() : "";
        const amount = parseFloat(row[iAmount]);
        const note = iNote>=0 ? (row[iNote]||"").trim() : "";
        const toName = iTo>=0 ? (row[iTo]||"").trim() : "";
        const fee = iFee>=0 ? (parseFloat(row[iFee])||0) : 0;

        if(!date || !amount || amount<=0 || !accName){ errors.push("Row "+(r+1)+": missing date, account, or amount"); continue; }
        const bank = state.banks.find(b => b.name.toLowerCase() === accName.toLowerCase());
        if(!bank){ errors.push("Row "+(r+1)+": account '"+accName+"' not found"); continue; }

        if(type==="transfer"){
          const toBank = state.banks.find(b => b.name.toLowerCase() === toName.toLowerCase());
          if(!toBank){ errors.push("Row "+(r+1)+": transfer-to account '"+toName+"' not found"); continue; }
          addTransfer({fromBankId:bank.id, toBankId:toBank.id, amount, fee, note, date}, true);
        } else if(type==="income" || type==="expense"){
          if(category && !(type==="income"?state.incomeCats:state.expenseCats).includes(category)){
            addCategory(type==="income"?"income":"expense", category);
          }
          addTransaction({type, bankId:bank.id, amount, category: category||"Other", note, date}, true);
        } else { errors.push("Row "+(r+1)+": unknown type '"+type+"'"); continue; }
        added++;
      }
      persist(); render();
      alert("Imported "+added+" transaction(s)."+(errors.length ? "\n\nSkipped "+errors.length+":\n"+errors.slice(0,8).join("\n")+(errors.length>8?"\n...":"") : ""));
    }catch(err){ alert("Could not read this CSV file. Please check the format."); }
  };
  reader.readAsText(file);
}

            <span style="font-size:11px;color:var(--gold);background:rgba(201,162,39,0.12);border:1px solid rgba(201,162,39,0.25);border-radius:20px;padding:1px 8px;margin-left:6px;">no budget</span>
          </div>

        </div>`).join("")}</div>

    <button class="stat-card" data-action="set-tab" data-tab="accounts">🏦<div class="amt stat-value">${state.banks.filter(b=>!b.isCard).length}</div><div class="stat-label">Bank Accounts</div></button>

    <button class="stat-card" data-action="set-tab" data-tab="loans">🤝<div class="amt stat-value">${taka(outstandingBorrowed())}</div><div class="stat-label">I Owe</div></button>
  </div>`;

  const cards = cardAccounts();
  if(cards.length){
    html += `<div style="margin-bottom:22px;"><h2 class="section-title">Credit Card Status</h2><div class="grid">
      ${cards.map(c=>{
        const owed = cardOwedTotal(c);
        const available = cardAvailable(c);
        const pct = c.creditLimit ? Math.min(100,(owed/c.creditLimit)*100) : 0;
        const barColor = pct>80?"var(--red)":pct>30?"var(--gold)":"var(--green-light)";
        return `<div class="card bordered" style="--accent:${c.color}">
          <div style="font-size:13.5px;color:var(--muted);margin-bottom:4px;">${esc(c.name)}</div>
          <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px;">

            <div><div class="stat-label">Owed</div><div class="amt" style="font-size:17px;font-weight:700;color:${owed>0?'var(--red)':'var(--muted)'}">${taka(owed)}</div></div>
          </div>
          ${c.creditLimit ? `<div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${barColor};"></div></div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:4px;">${pct.toFixed(0)}% of ${taka(c.creditLimit)} limit used</div>` : ""}
        </div>`;
      }).join("")}
    </div></div>`;
  }

  if(state.budgets.length){
    const bs = budgetSummary();
    const pct = bs.totalBudget ? (bs.spent/bs.totalBudget)*100 : 0;
    const color = pct>100?"var(--red)":pct>70?"var(--gold)":"var(--green-light)";
    html += `<div style="margin-bottom:22px;"><h2 class="section-title">This Month's Budget</h2>
      <div class="card">
        <div class="grid stat" style="margin-bottom:12px;">
          <div><div class="stat-label">Total Budget</div><div class="amt" style="font-size:19px;font-weight:700;">${taka(bs.totalBudget)}</div></div>
          <div><div class="stat-label">Spent So Far</div><div class="amt" style="font-size:19px;font-weight:700;color:${color}">${taka(bs.spent)}</div></div>
          <div><div class="stat-label">Over Spent</div><div class="amt" style="font-size:19px;font-weight:700;color:${bs.overSpent>0?'var(--red)':'var(--muted)'}">${taka(bs.overSpent)}</div></div>
          <div><div class="stat-label">Left to Spend</div><div class="amt" style="font-size:19px;font-weight:700;color:var(--green-light)">${taka(bs.leftToSpend)}</div></div>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,pct)}%;background:${color};"></div></div>
      </div>
    </div>`;
  }

  html += `<div><h2 class="section-title">Recent Transactions</h2>${recent.length===0 ? `<div class="empty">No transactions yet.</div>` : renderLedger(recent, false)}</div>`;
  return html;
}

function renderAccountStatementSection(){
  const st = state.accountStatement || { from: monthKey(todayStr())+"-01", to: todayStr(), bankId: "" };

  return `<div style="margin-top:26px;">

        <label class="field" style="flex:1 1 220px;">Account

          </select>

      </div>
    </div>
    <div id="account-statement-result">${st.generated ? renderAccountStatementTable(st.from, st.to, selected) : `<div class="empty">Choose a date range and account, then generate the statement.</div>`}</div>
  </div>`;

function accountStatementEffect(t, bankId){
  if(t.type==="income" && t.bankId===bankId) return { debit:0, credit:t.amount, details:[t.category, t.note].filter(Boolean).join(" — ") };
  if(t.type==="expense" && t.bankId===bankId) return { debit:t.amount, credit:0, details:[t.category, t.note].filter(Boolean).join(" — ") };
  if(t.type==="transfer"){
    if(t.fromBankId===bankId) return { debit:t.amount, credit:0, details:`Transfer to ${bankName_(t.toBankId)}${t.note?" — "+t.note:""}` };
    if(t.toBankId===bankId) return { debit:0, credit:t.amount, details:`Transfer from ${bankName_(t.fromBankId)}${t.note?" — "+t.note:""}` };
  }
  return null;
}
function balanceEffectForAccount(t, bankId){
  const e = accountStatementEffect(t, bankId);
  return e ? e.credit - e.debit : 0;
}
function renderAccountStatementTable(from, to, bankId){
  const bank = bankById(bankId);
  if(!bank) return `<div class="empty">Select an account to generate a statement.</div>`;
  const related = state.transactions.filter(t=>accountStatementEffect(t, bankId));
  const before = related.filter(t=>t.date && t.date<from).reduce((s,t)=>s+balanceEffectForAccount(t, bankId),0);
  const current = related.reduce((s,t)=>s+balanceEffectForAccount(t, bankId),0);
  const opening = bank.balance - current + before;
  let running = opening;
  const rows = related.filter(t=>t.date && t.date>=from && t.date<=to).sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:a.createdAt-b.createdAt);
  const totalDebit = rows.reduce((s,t)=>s+accountStatementEffect(t, bankId).debit,0);
  const totalCredit = rows.reduce((s,t)=>s+accountStatementEffect(t, bankId).credit,0);
  return `<div class="card" style="overflow-x:auto;">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;">
      <div><div class="stat-label">Statement Account</div><div style="font-weight:700;color:var(--green);">${esc(bank.name)}</div></div>
      <div><div class="stat-label">Period</div><div>${fmtDate(from)} – ${fmtDate(to)}</div></div>
      <div><div class="stat-label">Opening Balance</div><div class="amt" style="font-weight:700;">${taka(opening)}</div></div>
    </div>
    <table class="rpt-table" style="min-width:680px;">
      <thead><tr><th>Date</th><th>Transaction Details</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead>
      <tbody>
        <tr class="rpt-total"><td>${from}</td><td>Opening Balance</td><td class="num">—</td><td class="num">—</td><td class="num">${taka(opening)}</td></tr>
        ${rows.map(t=>{
          const e = accountStatementEffect(t, bankId);
          running += e.credit - e.debit;
          return `<tr><td>${t.date}</td><td>${esc(e.details||"Transaction")}</td><td class="num">${e.debit?taka(e.debit):"—"}</td><td class="num">${e.credit?taka(e.credit):"—"}</td><td class="num">${taka(running)}</td></tr>`;
        }).join("")}
        <tr class="rpt-total"><td colspan="2">Totals</td><td class="num">${taka(totalDebit)}</td><td class="num">${taka(totalCredit)}</td><td class="num">—</td></tr>
        <tr class="rpt-grand"><td colspan="4" style="background:var(--green);color:var(--on-primary);font-weight:700;">Closing Balance</td><td class="num" style="background:var(--green);color:var(--on-primary);font-weight:700;">${taka(running)}</td></tr>
      </tbody>
    </table>
    ${rows.length===0 ? `<p class="rpt-note">No transactions found for this account in the selected date range.</p>` : ""}
  </div>`;
}
function accountCard(b, isCard){

      <button class="icon-btn" data-action="edit-bank" data-id="${b.id}">${ICON.edit}</button>

    return `<div class="card bordered acc-card" draggable="true" data-bank-id="${b.id}" style="--accent:${b.color};cursor:grab;">
      ${actions}
      <div style="font-size:14px;color:var(--muted);margin-bottom:6px;padding-right:56px;">${esc(b.name)}</div>
      <div class="amt" style="font-size:22px;font-weight:700;color:${color}">${taka(b.balance)}</div>
    </div>`;
  }

  const limit = Number(b.creditLimit)||0;
  const owed = cardOwedTotal(b);
  const available = cardAvailable(b);

  return `<div class="card bordered acc-card" draggable="true" data-bank-id="${b.id}" style="--accent:${b.color};cursor:grab;">
    ${actions}
    <div style="font-size:14px;color:var(--muted);margin-bottom:8px;padding-right:56px;">${esc(b.name)}</div>
    <div style="display:flex;gap:18px;flex-wrap:wrap;">
      ${limit ? `<div>
        <div class="stat-label">Available</div>
        <div class="amt" style="font-size:20px;font-weight:700;color:${available>0?'var(--green-light)':'var(--red)'}">${taka(available)}</div>
      </div>` : ""}
      <div>
        <div class="stat-label">Owed</div>
        <div class="amt" style="font-size:20px;font-weight:700;color:${owed>0?'var(--red)':'var(--muted)'}">${taka(owed)}</div>
      </div>
    </div>
    ${limit ? `<div class="progress-track" style="margin-top:10px;"><div class="progress-fill" style="width:${pct}%;background:${barColor};"></div></div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:4px;">Limit ${taka(limit)} · ${pct.toFixed(0)}% used</div>` : ""}
    <button class="btn-outline" data-action="open-emi" data-id="${b.id}" style="margin-top:12px;width:100%;justify-content:center;">${ICON.plus} Add EMI</button>
  </div>`;
}
function renderEmiPlansSection(){
  const plans = (state.emis||[]).filter(e=>state.banks.some(b=>b.id===e.cardId));
  if(!plans.length) return "";
  const rows = plans.map(e=>{
    const card = bankById(e.cardId);
    const months = Math.max(1, Number(e.months)||1);
    const paid = emiPaidAmount(e);
    const principal = Number(e.principal)||0;
    const pct = principal ? Math.min(100,(paid/principal)*100) : 0;
    const done = emiIsDone(e);
    const due = emiNextDueDate(e);
    return `<div class="card bordered" style="--accent:${card?card.color:'var(--green)'};margin-bottom:10px;">
      <div class="row-between" style="align-items:flex-start;gap:10px;">
        <div>
          <div style="font-weight:700;">${esc(e.title||"EMI purchase")}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px;">${esc(card?card.name:"")} · ${taka(e.monthly)} × ${months} months</div>
        </div>
        ${done
          ? `<div style="font-size:12px;font-weight:700;color:var(--green-light);">Completed</div>`
          : `<button class="btn-fill" data-action="emi-pay" data-id="${e.id}" style="min-width:100px;justify-content:center;">Pay Now</button>`}
      </div>
      <div class="progress-track" style="margin-top:10px;"><div class="progress-fill" style="width:${pct}%;background:${done?'var(--green-light)':'var(--gold)'};"></div></div>
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px;">
        <span>${taka(paid)} paid · ${taka(emiRemaining(e))} remaining (${Math.min(e.paidCount||0,months)}/${months})</span>
        <span>${done ? "" : "Next due " + fmtDate(due)}</span>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:6px;">
        <button class="icon-btn" data-action="delete-emi" data-id="${e.id}">${ICON.trash}</button>
      </div>
    </div>`;
  }).join("");
  const totalMonthly = plans.filter(e=>!emiIsDone(e)).reduce((s,e)=>s+(Number(e.monthly)||0),0);
  const totalRemaining = plans.reduce((s,e)=>s+emiRemaining(e),0);
  return `<div style="margin-top:22px;">
    <div class="row-between"><h2 class="section-title">EMI Plans</h2>
      <div style="font-size:12px;color:var(--muted);">${taka(totalRemaining)} outstanding · ${taka(totalMonthly)}/month</div></div>
    ${rows}
  </div>`;
}

/* ---------------- Transactions ---------------- */
function renderTransactions(){
  const f = state.txnFilters || { search:"", from:"", to:"", bank:"all", type:"all" };
  state.txnFilters = f;
  let list = [...state.transactions];
  if(f.bank!=="all") list = list.filter(t=>t.bankId===f.bank||t.fromBankId===f.bank||t.toBankId===f.bank);
  if(f.type!=="all") list = list.filter(t=>t.type===f.type);
  if(f.from) list = list.filter(t=>t.date>=f.from);
  if(f.to) list = list.filter(t=>t.date<=f.to);
  if(f.search.trim()){
    const q=f.search.trim().toLowerCase();
    list = list.filter(t => (t.category||"").toLowerCase().includes(q) || (t.note||"").toLowerCase().includes(q) || bankName_(t.bankId||t.fromBankId).toLowerCase().includes(q));
  }
  list.sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:b.createdAt-a.createdAt);

  return `
    <div class="row-between">
      <h2 class="section-title">Transaction Ledger</h2>
      <div style="display:flex;gap:8px;">
        <button class="btn-outline" data-action="set-tab" data-tab="chat">${ICON.chat} AI Chat</button>
        <button class="btn-outline" ${state.banks.length<2?"disabled":""} data-action="open-modal" data-modal="transfer">${ICON.transfer} Transfer</button>
        <button class="btn-fill" ${state.banks.length===0?"disabled":""} data-action="open-modal" data-modal="transaction">${ICON.plus} Transaction</button>
      </div>
    </div>
    <div class="filters">
      <div class="search-box">${ICON.search}<input id="f-search" placeholder="Search category, note, account" value="${esc(f.search)}" /></div>
      <input type="date" id="f-from" value="${f.from}" />
      <input type="date" id="f-to" value="${f.to}" />
      <select id="f-type">
        <option value="all" ${f.type==='all'?'selected':''}>All Types</option>
        <option value="income" ${f.type==='income'?'selected':''}>Income</option>
        <option value="expense" ${f.type==='expense'?'selected':''}>Expense</option>
        <option value="transfer" ${f.type==='transfer'?'selected':''}>Transfer</option>
      </select>
      <select id="f-bank">
        <option value="all" ${f.bank==='all'?'selected':''}>All Accounts</option>
        ${state.banks.map(b=>`<option value="${b.id}" ${f.bank===b.id?'selected':''}>${esc(b.name)}</option>`).join("")}
      </select>
    </div>
    ${list.length===0 ? "" : filteredSummaryBar(list)}
    ${list.length===0 ? `<div class="empty">No transactions found.</div>` : renderLedger(list, true)}
  `;
}
// Summary of the currently-filtered transactions. Transfers are internal moves,
// so they're excluded from income/expense totals and only counted separately.
function filteredSummaryBar(list){
  const income = list.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
  const expense = list.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
  const transfers = list.filter(t=>t.type==="transfer").length;
  const net = income - expense;
  const cell = (label,val,color)=>`<div><div class="stat-label">${label}</div><div class="amt" style="font-size:17px;font-weight:700;${color?`color:${color};`:''}">${val}</div></div>`;
  return `<div class="card" style="margin-bottom:14px;">
    <div class="grid stat" style="grid-template-columns:repeat(4,1fr);gap:8px;">
      ${cell(`Showing ${list.length} txn${list.length===1?'':'s'}`, taka(income+expense))}
      ${cell("Income", taka(income), "var(--green-light)")}
      ${cell("Expense", taka(expense), "var(--red)")}
      ${cell(net>=0?"Net":"Net", (net>=0?"+":"−")+taka(Math.abs(net)), net>=0?"var(--green-light)":"var(--red)")}
    </div>
    ${transfers?`<div style="font-size:11.5px;color:var(--muted);margin-top:8px;">Excludes ${transfers} transfer${transfers===1?'':'s'} (internal movements).</div>`:""}
  </div>`;
}

  const mk = state.selectedBudgetMonth || monthKey(todayStr());
  const cm = monthKey(todayStr());
  const ms = spendForMonth(mk);
  const monthBudgets = budgetsForMonth(mk).slice().sort((a,b)=>b.limit-a.limit);
  const monthName = monthLabel(mk) + (mk===cm ? " · this month" : mk>cm ? " · upcoming" : " · past");
  let html = `<div class="row-between"><h2 class="section-title">Monthly Budgets</h2>
    <div style="display:flex;gap:8px;">
      <button class="btn-outline" data-action="open-modal" data-modal="categories">${ICON.tag} Categories</button>
      <button class="btn-fill" ${state.expenseCats.length===0?"disabled":""} data-action="open-modal" data-modal="budget">${ICON.plus} Add Budget</button>
    </div></div>
    <div class="filters" style="align-items:center;">
      <label class="field" style="flex-direction:row;align-items:center;gap:8px;margin:0;">
        <span>Budget month</span>
        <input type="month" id="budget-month-select" value="${mk}" />
      </label>
      <button class="btn-outline" style="padding:8px 12px;" data-action="budget-prev-month">‹ Prev</button>
      <button class="btn-outline" style="padding:8px 12px;" data-action="budget-next-month">Next ›</button>
      ${monthBudgets.length===0 && state.budgets.length ? `<button class="btn-outline" style="padding:8px 12px;" data-action="copy-budgets-from-prev">Copy from ${esc(monthLabel(addMonthKey(mk,-1)))}</button>` : ""}
      <span style="font-size:12.5px;color:var(--muted);margin-left:auto;">${esc(monthName)}</span>
    </div>`;
  if(monthBudgets.length===0){
    html += `<div class="empty">No budgets set for ${esc(monthLabel(mk))}. Add a budget above to plan this month${mk>cm?" ahead of time":""}.</div>`;
  } else {
    // Summary for the selected month — computed per category so an overspend in
    // one category never inflates another's "Left to Spend" headroom.
    const totalBudget = monthBudgets.reduce((s,b)=>s+b.limit,0);
    const spentTotal = monthBudgets.reduce((s,b)=>s+(ms[b.category]||0),0);
    const overSpent = monthBudgets.reduce((s,b)=>s+Math.max(0,(ms[b.category]||0)-b.limit),0);
    const leftToSpend = monthBudgets.reduce((s,b)=>s+Math.max(0,b.limit-(ms[b.category]||0)),0);
    const sumPct = totalBudget ? (spentTotal/totalBudget)*100 : 0;
    const sumColor = sumPct>100?"var(--red)":sumPct>70?"var(--gold)":"var(--green-light)";
    html += `<div class="card" style="margin-bottom:16px;">
      <div class="grid stat" style="margin-bottom:12px;">
        <div><div class="stat-label">Total Budget</div><div class="amt" style="font-size:19px;font-weight:700;">${taka(totalBudget)}</div></div>
        <div><div class="stat-label">Spent So Far</div><div class="amt" style="font-size:19px;font-weight:700;color:${sumColor}">${taka(spentTotal)}</div></div>
        <div><div class="stat-label">Over Spent</div><div class="amt" style="font-size:19px;font-weight:700;color:${overSpent>0?'var(--red)':'var(--muted)'}">${taka(overSpent)}</div></div>
        <div><div class="stat-label">Left to Spend</div><div class="amt" style="font-size:19px;font-weight:700;color:var(--green-light)">${taka(leftToSpend)}</div></div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,sumPct)}%;background:${sumColor};"></div></div>
    </div>`;

    const q = (state.budgetSearch||"").trim().toLowerCase();
    html += `<div class="search-box" style="margin-bottom:14px;">${ICON.search}<input id="budget-search" placeholder="Search category" value="${esc(state.budgetSearch||"")}" /></div>`;
    const shown = q ? monthBudgets.filter(b=>b.category.toLowerCase().includes(q)) : monthBudgets;
    if(shown.length===0){
      html += `<div class="empty">No budget categories match "${esc(state.budgetSearch||"")}".</div>`;
    } else {
    html += `<div style="display:flex;flex-direction:column;gap:12px;">${shown.map(b=>{
      const spent = ms[b.category]||0;
      const remaining = b.limit - spent;
      const pct = (spent/b.limit)*100;
      const color = pct>100?"var(--red)":pct>70?"var(--gold)":"var(--green-light)";
      return `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span style="font-weight:600;font-size:14.5px;">${esc(b.category)}</span>
            <span style="font-size:11px;font-weight:600;color:var(--muted);background:rgba(27,67,50,0.07);border:1px solid var(--border);border-radius:20px;padding:2px 9px;letter-spacing:.2px;">${esc(monthLabel(b.month))}</span>
            ${b.autoCreated ? `<span style="font-size:10.5px;font-weight:700;color:var(--gold);background:rgba(201,162,39,0.12);border:1px solid rgba(201,162,39,0.25);border-radius:20px;padding:2px 9px;letter-spacing:.2px;">Auto Created Budget</span>` : ""}
          </span>
          <div style="display:flex;gap:4px;">
            <button class="icon-btn" data-action="edit-budget" data-id="${b.id}">${ICON.edit}</button>
            <button class="icon-btn" data-action="delete-budget" data-id="${b.id}">${ICON.trash}</button>
          </div>
        </div>
        <div class="grid stat" style="grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;">
          <div><div class="stat-label">Budgeted</div><div class="amt" style="font-size:16px;font-weight:700;">${taka(b.limit)}</div></div>
          <div><div class="stat-label">Spent</div><div class="amt" style="font-size:16px;font-weight:700;color:${color}">${taka(spent)}</div></div>
          <div><div class="stat-label">${remaining>=0?"Left to Spend":"Over By"}</div><div class="amt" style="font-size:16px;font-weight:700;color:${remaining>=0?'var(--green-light)':'var(--red)'}">${taka(Math.abs(remaining))}</div></div>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,pct)}%;background:${color};"></div></div>
        ${pct>100 ? `<div style="font-size:12px;color:var(--red);margin-top:5px;">Over budget!</div>` : ""}
        <div style="display:flex;gap:8px;margin-top:12px;">
          <button class="btn-outline" style="font-size:12.5px;padding:5px 12px;" data-action="copy-budget" data-id="${b.id}">Copy to month…</button>
          <button class="btn-outline" style="font-size:12.5px;padding:5px 12px;" data-action="move-budget" data-id="${b.id}">Move to month…</button>
        </div>
      </div>`;
    }).join("")}</div>`;
    }
  }
  return html;
}

/* ---------------- Loans ---------------- */
function renderLoans(){
  const active = state.loans.filter(l=>!l.settled);
  const settled = state.loans.filter(l=>l.settled);
  let html = `<div class="row-between"><h2 class="section-title">Loans & Dues</h2>
    <button class="btn-outline" data-action="open-modal" data-modal="loan">${ICON.plus} Add</button></div>`;
  if(active.length===0 && settled.length===0){
    html += `<div class="empty">Lent money to someone, or owe someone? Track it here.</div>`;
  } else {
    html += `<div style="display:flex;flex-direction:column;gap:10px;">`;
    html += active.map(l=>`
      <div class="card" style="border-left:4px solid ${l.type==='lent'?'var(--green-light)':'var(--red)'}">
        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
          <div><div style="font-weight:600;font-size:14.5px;">${esc(l.person)}</div>
          <div style="font-size:12.5px;color:var(--muted);margin-top:2px;">${l.type==='lent'?'I lent':'I borrowed'} · ${l.date}${l.note?` · ${esc(l.note)}`:""}</div></div>
          <div class="amt" style="font-weight:700;color:${l.type==='lent'?'var(--green-light)':'var(--red)'}">${taka(l.amount)}</div>
        </div>
        <button class="btn-fill" style="font-size:12.5px;padding:5px 12px;margin-top:10px;" data-action="settle-loan" data-id="${l.id}">Mark Settled</button>
        <button class="icon-btn" style="margin-left:10px;" data-action="delete-loan" data-id="${l.id}">${ICON.trash}</button>
      </div>`).join("");
    if(settled.length){
      html += `<div style="font-size:12.5px;color:var(--muted);margin-top:10px;">Settled</div>`;
      html += settled.map(l=>`<div class="card" style="opacity:.6;display:flex;justify-content:space-between;">
        <span style="font-size:13.5px;">${esc(l.person)} — ${taka(l.amount)}</span>
        <button class="icon-btn" data-action="delete-loan" data-id="${l.id}">${ICON.trash}</button>
      </div>`).join("");
    }
    html += `</div>`;
  }
  return html;
}

function renderModal(){
  const m = state.modal;
  let title = "", body = "";
  if(m.type==="account") { title = m.editId ? "Edit Account" : "New Account"; body = accountForm(m.editId); }
  else if(m.type==="transaction") { title = m.editId ? "Edit Transaction" : "New Transaction"; body = transactionForm(m.editId); }
  else if(m.type==="transfer") { title = m.editId ? "Edit Transfer" : "Transfer Between Accounts"; body = transferForm(m.editId); }
  else if(m.type==="emi") { title="New EMI Plan"; body = emiForm(m.cardId); }
  else if(m.type==="emi-pay") { title="Pay EMI Installment"; body = emiPayForm(m.emiId); }
  else if(m.type==="budget") { title = m.editId ? "Edit Budget" : "New Budget"; body = budgetForm(m.editId); }
  else if(m.type==="movebudget") { title = (m.mode==="copy"?"Copy":"Move")+" Budget"; body = moveBudgetForm(m.budgetId, m.mode); }
  else if(m.type==="categories") { title="Expense Categories"; body = categoriesForm(); }
  else if(m.type==="goal") { title = m.editId ? "Edit Goal" : "New Goal"; body = goalForm(m.editId); }
  else if(m.type==="recurring") { title = m.editId ? "Edit Recurring Transaction" : "New Recurring Transaction"; body = recurringForm(m.editId); }
  else if(m.type==="loan") { title="New Loan / Due"; body = loanForm(); }
  else if(m.type==="backup") { title="Backup & Restore"; body = backupForm(); }
  else if(m.type==="textexport") { title=m.filename; body = textExportForm(m.text, m.filename); }
  else if(m.type==="report") {
    title = state.reportType === "comparison" ? "Monthly Comparison" : "Period Report";
    body = reportForm(m.from || (monthKey(todayStr())+"-01"), m.to || todayStr());
  }
  else if(m.type==="cloud") { title="Cloud Sync"; body = cloudForm(); }
  else if(m.type==="theme") { title="Choose a Theme"; body = themeForm(); }
  else if(m.type==="security") { title="Local Password Lock"; body = securityForm(); }
  else if(m.type==="password-prompt") { title="Security Verification"; body = passwordPromptForm(m.reason); }
  else if(m.type==="settings") { title="⚙️ Options & Settings"; body = settingsForm(); }
  else if(m.type==="ai") { title="💬 AI Transaction Assistant"; body = renderAIChatModal(); }
  else if(m.type==="gemini-setup") { title="⚡ Connect Gemini AI (Free)"; body = geminiSetupForm(); }

  const wide = m.type==="report" ? "max-width:720px;" : (m.type==="ai") ? "max-width:760px;padding:16px;" : (m.type==="textexport" || m.type==="cloud" || m.type==="security" || m.type==="password-prompt" || m.type==="settings" || m.type==="gemini-setup") ? "max-width:560px;" : "";
  return `<div class="modal-overlay" data-action="close-modal-overlay">
    <div class="modal-box" style="${wide}">
      <div class="modal-head"><h3 class="modal-title" style="word-break:break-all;">${esc(title)}</h3><button class="modal-close" data-action="close-modal">${ICON.x}</button></div>
      ${body}
    </div>
  </div>`;
}
