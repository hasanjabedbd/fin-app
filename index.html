/* ---------------- event handling ---------------- */
function attachHandlers(){
  // Mirrors edits typed into an AI-chat review card back onto its message, so a
  // re-render (or another chat turn) never loses what the user changed.
  const onReviewFieldEdited = (e) => {
    const field = e.target.closest && e.target.closest("[data-review-field]");
    if(!field) return;
    const holder = field.closest("[data-review-msg]");
    if(!holder) return;
    const msg = state.aiChatMessages.find(m => m.id === holder.dataset.reviewMsg);
    if(!msg || !msg.review) return;
    msg.review[field.dataset.reviewField] = field.value;
    // Switching type changes which categories are offered, so rebuild the card.
    if(field.dataset.reviewField === "kind"){
      msg.reviewError = null;
      render();
    }
  };
  document.body.oninput = onReviewFieldEdited;
  document.body.onchange = onReviewFieldEdited;

  document.body.onclick = async (e) => {
    const el = e.target.closest("[data-action]");
    if(!el) return;
    const action = el.dataset.action;
    const id = el.dataset.id;

    if(action==="set-tab"){ state.tab = el.dataset.tab; if(state.modal) state.modal = null; render(); }
    else if(action==="set-report-type"){
      state.reportType = el.dataset.type;
      const m = state.modal;
      if(m && m.type==="report"){
        const from = document.getElementById("report-from").value;
        const to = document.getElementById("report-to").value;
        m.from = from; m.to = to;
      }
      render();
      setupModalExtras();
    }
    else if(action==="open-modal"){ state.modal = { type: el.dataset.modal }; render(); setupModalExtras(); }
    else if(action==="open-backup"){ state.modal = { type: "backup" }; render(); }
    else if(action==="set-theme"){ setTheme(el.dataset.themeId); render(); }
    else if(action==="analyze-ai-entry"){
      const text = document.getElementById("ai-text").value.trim();
      aiApplyParsedResult(text);
      render();
    }
    else if(action==="save-ai-entry"){
      const text = document.getElementById("ai-text").value.trim();
      const draft = readAIAssistantDraftFromForm();
      draft.note = draft.note || text;
      const errors = validateAIDraft(draft);
      state.aiAssistant.text = text;
      state.aiAssistant.parsed = draft;
      state.aiAssistant.errors = errors;
      state.aiAssistant.hints = [];
      if(errors.length){ render(); return; }
      if(draft.kind==="transfer"){
        addTransfer({ fromBankId:draft.fromBankId, toBankId:draft.toBankId, amount:draft.amount, fee:0, note:draft.note, date:draft.date });
      } else {
        addTransaction({ type:draft.kind, bankId:draft.bankId, amount:draft.amount, category:draft.category, note:draft.note, date:draft.date });
      }
      state.aiAssistant.lastSaved = { ...draft };
      state.aiAssistant.text = "";
      state.aiAssistant.parsed = null;
      state.aiAssistant.errors = [];
      state.aiAssistant.hints = [];
      state.modal = null;
      state.tab = "transactions";
      render();
    }
    else if(action==="send-ai-chat"){
      const inp = document.getElementById("chat-input-field");
      if(inp && inp.value.trim()){
        const val = inp.value.trim();
        inp.value = "";
        executeAIChatInput(val);
      }
    }
    else if(action==="open-gemini-setup"){
      state.modal = { type: "gemini-setup" };
      render();
    }
    else if(action==="save-gemini-key"){
      const inp = document.getElementById("gemini-key-input");
      const val = ((inp && inp.value) || "").trim();
      if(!val || looksLikeMaskedGeminiKey(val)){
        alert("Paste your real Gemini API key (from aistudio.google.com/app/apikey).");
        return;
      }
      setGeminiKey(val);
      localStorage.removeItem(GEMINI_MODEL_STORAGE);
      const onlyWelcome = !state.aiChatMessages.length || (state.aiChatMessages.length === 1 && state.aiChatMessages[0].id === "welcome-1");
      if(onlyWelcome){
        state.aiChatMessages = [getWelcomeMessage()];
        saveAIChatMessages(state.aiChatMessages);
      }
      state.modal = null;
      state.tab = "chat";
      render();
      scrollChatToBottom();
    }
    else if(action==="remove-gemini-key"){
      if(!confirm("Remove the Gemini API key from this device?")) return;
      clearGeminiKey();
      const onlyWelcome = !state.aiChatMessages.length || (state.aiChatMessages.length === 1 && state.aiChatMessages[0].id === "welcome-1");
      if(onlyWelcome){
        state.aiChatMessages = [getWelcomeMessage()];
        saveAIChatMessages(state.aiChatMessages);
      }
      state.modal = null;
      state.tab = "chat";
      render();
    }
    else if(action==="test-gemini-key"){
      const resultEl = document.getElementById("gemini-test-result");
      const inp = document.getElementById("gemini-key-input");
      const typed = ((inp && inp.value) || "").trim();
      const keyToTest = (typed && !looksLikeMaskedGeminiKey(typed)) ? typed : getGeminiKey();
      if(!keyToTest){
        if(resultEl){
          resultEl.style.display = "block";
          resultEl.style.borderColor = "var(--red)";
          resultEl.textContent = "Paste an API key first.";
        }
        return;
      }
      if(resultEl){
        resultEl.style.display = "block";
        resultEl.style.borderColor = "var(--border)";
        resultEl.textContent = "Testing Gemini connection…";
      }
      callGeminiAI("ok", { ping:true, apiKey:keyToTest }).then(result => {
        if(!resultEl) return;
        resultEl.style.display = "block";
        if(result && result.ok){
          resultEl.style.borderColor = "var(--green-light)";
          resultEl.textContent = "✅ Connected" + (result.model ? " (" + result.model + ")" : "") + ". Click Connect Gemini AI to save this key.";
        } else {
          resultEl.style.borderColor = "var(--red)";
          resultEl.textContent = "❌ " + ((result && result.error) || "Connection failed.");
        }
      });
    }
    else if(action==="clear-ai-chat"){
      if(confirm("Clear chat history? (Transactions in ledger will NOT be deleted)")){
        state.aiChatMessages = [getWelcomeMessage()];
        saveAIChatMessages(state.aiChatMessages);
        render();
      }
    }
    else if(action==="ai-chip-prompt"){
      const txt = el.dataset.text;
      if(txt) executeAIChatInput(txt);
    }
    else if(action==="ai-undo-txn"){
      const txnId = el.dataset.id;
      if(txnId){
        deleteTransaction(txnId);
        state.aiChatMessages.forEach(m => {
          if(m.actionResult && m.actionResult.txnId === txnId){
            m.actionResult.undone = true;
          }
        });
        saveAIChatMessages(state.aiChatMessages);
        render();
        scrollChatToBottom();
      }
    }
    else if(action==="ai-change-bank"){
      const txnId = el.dataset.txnid;
      const newBankId = el.dataset.bankid;
      const t = state.transactions.find(x => x.id === txnId);
      if(t && newBankId && t.bankId !== newBankId){
        adjustBalance(t.bankId, t.type === "income" ? -t.amount : t.amount);
        t.bankId = newBankId;
        adjustBalance(t.bankId, t.type === "income" ? t.amount : -t.amount);
        commit();
        state.aiChatMessages.forEach(m => {
          if(m.actionResult && m.actionResult.txnId === txnId){
            if(m.actionResult.data) m.actionResult.data.bankId = newBankId;
          }
        });
        saveAIChatMessages(state.aiChatMessages);
        render();
        scrollChatToBottom();
      }
    }
    else if(action==="ai-confirm-review"){
      const msg = state.aiChatMessages.find(m => m.id === id);
      if(!msg || !msg.review) return;
      const r = msg.review;
      const draft = {
        kind: r.kind === "transfer" ? "transfer" : (r.kind === "income" ? "income" : "expense"),
        amount: parseFloat(r.amount) || 0,
        date: r.date || todayStr(),
        bankId: r.bankId || "",
        fromBankId: r.fromBankId || "",
        toBankId: r.toBankId || "",
        category: r.category || "",
        note: (r.note || "").trim(),
        fee: parseFloat(r.fee) || 0
      };
      const cats = draft.kind === "income" ? state.incomeCats : state.expenseCats;
      if(draft.kind !== "transfer" && !cats.includes(draft.category)) draft.category = cats[0] || "";
      const errors = validateAIDraft(draft);
      if(errors.length){
        msg.reviewError = errors.join(" ");
        render();
        return;
      }
      let created;
      if(draft.kind === "transfer"){
        created = addTransfer({ fromBankId:draft.fromBankId, toBankId:draft.toBankId, amount:draft.amount, fee:draft.fee, note:draft.note || "Transfer", date:draft.date });
      } else {
        created = addTransaction({ type:draft.kind, bankId:draft.bankId, amount:draft.amount, category:draft.category, note:draft.note || draft.category, date:draft.date });
      }
      msg.review = null;
      msg.reviewError = null;
      if(draft.kind === "transfer"){
        msg.text = `✅ **Transfer Saved!**\nMoved **${taka(draft.amount)}** from **${bankName_(draft.fromBankId)}** to **${bankName_(draft.toBankId)}**.${draft.fee ? ` Fee **${taka(draft.fee)}** charged.` : ""}`;
        msg.actionResult = {
          type:"transfer_created",
          txnId: created ? created.id : "",
          data: { fromBankId:draft.fromBankId, toBankId:draft.toBankId, amount:draft.amount, fee:draft.fee, note:draft.note || "Transfer", date:draft.date }
        };
      } else {
        msg.text = `✅ **Saved!**\nAdded ${draft.kind === "income" ? "income" : "expense"} of **${taka(draft.amount)}** under **${draft.category}** from **${bankName_(draft.bankId)}**.`;
        msg.actionResult = {
          type:"transaction_created",
          txnId: created ? created.id : "",
          data: { type:draft.kind, bankId:draft.bankId, amount:draft.amount, category:draft.category, note:draft.note || draft.category, date:draft.date }
        };
      }
      saveAIChatMessages(state.aiChatMessages);
      render();
      scrollChatToBottom();
    }
    else if(action==="ai-cancel-review"){
      const msg = state.aiChatMessages.find(m => m.id === id);
      if(!msg || !msg.review) return;
      msg.review = null;
      msg.reviewError = null;
      msg.text = "✖ Cancelled — nothing was added to your ledger.";
      saveAIChatMessages(state.aiChatMessages);
      render();
      scrollChatToBottom();
    }
    else if(action==="ai-create-cash-and-save"){
      const draft = state.aiChatContext && state.aiChatContext.pendingSave;
      state.aiChatContext = null;
      addBank({ name: "Cash", balance: 0, isCard: false });
      const newBank = state.banks[state.banks.length - 1];
      if(draft && newBank){
        draft.bankId = newBank.id;
        state.aiChatMessages.push(buildReviewMessage(draft));
        saveAIChatMessages(state.aiChatMessages);
      }
      render();
      scrollChatToBottom();
    }
    else if(action==="save-admin-password"){
      const p1 = document.getElementById("admin-pass1").value;
      const p2 = document.getElementById("admin-pass2").value;
      if(!p1){ alert("Please enter a password."); return; }
      if(p1!==p2){ alert("Passwords do not match."); return; }
      if(hasAdminPassword() && !(await requireAdminPassword("Change local password"))) return;
      setAdminPassword(p1);
      alert("Local password saved.");
      state.modal = { type:"security" }; render();
    }
    else if(action==="clear-admin-password"){
      if(!hasAdminPassword()){ alert("No local password is set."); return; }
      if(!(await requireAdminPassword("Remove local password"))) return;
      clearAdminPassword();
      alert("Local password removed.");
      state.modal = { type:"security" }; render();
    }
    else if(action==="cancel-password-prompt"){
      if(state.modal && state.modal.onCancel) state.modal.onCancel();
      else { state.modal=null; render(); }
    }
    else if(action==="master-clear-password"){
      if(!confirm("Clear the password lock without entering the current password?\n\nThis is meant for when you've forgotten it. All protected actions will work normally afterward, and the change syncs to your connected devices.")) return;
      const pending = state.modal && state.modal.type==="password-prompt" ? state.modal.onCancel : null;
      clearAdminPassword();
      state.modal = null;
      if(pending) pending(); else render();
      alert("Password lock cleared.");
    }
    else if(action==="close-modal"){
      if(state.modal && state.modal.type==="password-prompt" && state.modal.onCancel) state.modal.onCancel();
      else { state.modal=null; render(); }
    }
    else if(action==="close-modal-overlay"){
      if(e.target===el){
        if(state.modal && state.modal.type==="password-prompt" && state.modal.onCancel) state.modal.onCancel();
        else { state.modal=null; render(); }
      }
    }
    else if(action==="edit-bank"){
      if(!(await requireAdminPassword("Edit account"))) return;
      state.modal = { type:"account", editId:id }; render();
    }
    else if(action==="delete-bank"){ if(!(await requireAdminPassword("Delete account"))) return; deleteBank(id); }
    else if(action==="open-emi"){
      if(!(await requireAdminPassword("Add EMI plan"))) return;
      state.modal = { type:"emi", cardId:id }; render();
    }
    else if(action==="emi-pay"){
      if(!(await requireAdminPassword("Pay EMI installment"))) return;
      state.modal = { type:"emi-pay", emiId:id }; render();
    }
    else if(action==="delete-emi"){
      if(!(await requireAdminPassword("Delete EMI plan"))) return;
      if(!confirm("Delete this EMI plan? Its paid installments will also be removed from the ledger.")) return;
      deleteEMI(id);
    }
    else if(action==="generate-account-statement"){
      const from = document.getElementById("stmt-from").value || (monthKey(todayStr())+"-01");
      const to = document.getElementById("stmt-to").value || todayStr();
      const bankId = document.getElementById("stmt-bank").value;
      if(!bankId){ alert("Please select an account first."); return; }
      if(from>to){ alert("From date cannot be after To date."); return; }
      state.accountStatement = { from, to, bankId, generated:true };
      document.getElementById("account-statement-result").innerHTML = renderAccountStatementTable(from, to, bankId);
    }
    else if(action==="edit-txn"){ 
      const t = state.transactions.find(x=>x.id===id);
      if(!t) return;
      if(t.emiId){ alert("This is an EMI installment. Its amount comes from the EMI plan, so edit the plan or delete this entry instead."); return; }
      if(!(await requireAdminPassword(t.type==="transfer" ? "Edit transfer" : "Edit transaction"))) return;
      state.modal = { type: t.type==="transfer" ? "transfer" : "transaction", editId:id };
      render();
    }
    else if(action==="delete-txn"){ if(!(await requireAdminPassword("Delete transaction"))) return; deleteTransaction(id); }
    else if(action==="edit-budget"){
      if(!(await requireAdminPassword("Edit budget"))) return;
      state.modal = { type:"budget", editId:id }; render();
    }
    else if(action==="delete-budget"){ if(!(await requireAdminPassword("Delete budget"))) return; deleteBudget(id); }
    else if(action==="budget-prev-month"){ state.selectedBudgetMonth = addMonthKey(state.selectedBudgetMonth||monthKey(todayStr()), -1); render(); }
    else if(action==="budget-next-month"){ state.selectedBudgetMonth = addMonthKey(state.selectedBudgetMonth||monthKey(todayStr()), 1); render(); }
    else if(action==="copy-budgets-from-prev"){
      const to = state.selectedBudgetMonth || monthKey(todayStr());
      const from = addMonthKey(to, -1);
      const n = copyBudgetsToMonth(from, to);
      if(n===0) alert("Nothing to copy from "+monthLabel(from)+".");
    }
    else if(action==="copy-budget"){ state.modal = { type:"movebudget", budgetId:id, mode:"copy" }; render(); }
    else if(action==="move-budget"){ state.modal = { type:"movebudget", budgetId:id, mode:"move" }; render(); }
    else if(action==="edit-goal"){
      if(!(await requireAdminPassword("Edit goal"))) return;
      state.modal = { type:"goal", editId:id }; render();
    }
    else if(action==="delete-goal"){ if(!(await requireAdminPassword("Delete goal"))) return; deleteGoal(id); }
    else if(action==="edit-recurring"){
      if(!(await requireAdminPassword("Edit recurring transaction"))) return;
      state.modal = { type:"recurring", editId:id }; render();
    }
    else if(action==="delete-recurring"){ if(!(await requireAdminPassword("Delete recurring transaction"))) return; deleteRecurring(id); }
    else if(action==="delete-loan"){ if(!(await requireAdminPassword("Delete loan"))) return; deleteLoan(id); }
    else if(action==="delete-category"){ if(!(await requireAdminPassword("Delete category"))) return; deleteCategory("expense", el.dataset.name); state.modal={type:"categories"}; render(); }
    else if(action==="toggle-recurring"){ toggleRecurring(id); }
    else if(action==="skip-recurring"){ skipRecurring(id); }
    else if(action==="execute-recurring"){ executeRecurring(id); }
    else if(action==="settle-loan"){ if(!(await requireAdminPassword("Settle loan"))) return; settleLoan(id); }
    else if(action==="contribute-goal"){
      const input = document.getElementById("goal-add-"+id);
      const amt = parseFloat(input.value);
      if(amt>0) contributeGoal(id, amt);
    }
    else if(action==="export-data"){ exportData(); }
    else if(action==="trigger-import"){ document.getElementById("restoreFileInput").click(); }
    else if(action==="export-csv"){ exportTransactionsCSV(); }
    else if(action==="trigger-import-csv"){ document.getElementById("csvFileInput").click(); }
    else if(action==="download-csv-template"){ downloadCSVTemplate(); }
    else if(action==="regenerate-report"){
      const from = document.getElementById("report-from").value;
      const to = document.getElementById("report-to").value;
      if(from && to){
        if(state.reportType === "comparison"){
          document.getElementById("report-preview").innerHTML = reportComparisonHTML(from, to);
          initComparisonChart(from, to);
        } else {
          document.getElementById("report-preview").innerHTML = reportPreviewHTML(from, to);
        }
      }
    }
    else if(action==="print-report"){
      const from = document.getElementById("report-from").value || (monthKey(todayStr())+"-01");
      const to = document.getElementById("report-to").value || todayStr();
      printMonthlyReport(from, to);
    }
    else if(action==="download-report-file"){
      const from = document.getElementById("report-from").value || (monthKey(todayStr())+"-01");
      const to = document.getElementById("report-to").value || todayStr();
      downloadReportFile(from, to);
    }
    else if(action==="make-report-link"){
      const from = document.getElementById("report-from").value || (monthKey(todayStr())+"-01");
      const to = document.getElementById("report-to").value || todayStr();
      makeReportLink(from, to);
    }
    else if(action==="open-report-tab"){
      const from = document.getElementById("report-from").value || (monthKey(todayStr())+"-01");
      const to = document.getElementById("report-to").value || todayStr();
      openReportInNewTab(from, to);
    }
    else if(action==="manual-sync"){ manualSync(); }
    else if(action==="gen-sync-code"){
      document.getElementById("sync-code-input").value = randomSyncCode();
    }
    else if(action==="disconnect-cloud"){
      if(confirm("Disconnect cloud sync on this device? Your data stays on this device either way — this just stops syncing.")){
        disconnectCloud();
        state.modal = null; render();
      }
    }
    else if(action==="copy-export-text"){
      const ta = document.getElementById("export-text-area");
      const finish = (ok) => { const btn = el; btn.textContent = ok ? "Copied!" : "Couldn't copy — select the text manually"; setTimeout(()=>{ btn.textContent = "Copy to Clipboard"; }, 2000); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(()=>finish(true)).catch(()=>{
          ta.focus(); ta.select();
          try{ document.execCommand("copy"); finish(true); }catch(e){ finish(false); }
        });
      } else {
        ta.focus(); ta.select();
        try{ document.execCommand("copy"); finish(true); }catch(e){ finish(false); }
      }
    }
  };

  // filters (transactions tab)
  const fs=document.getElementById("f-search"), ffrom=document.getElementById("f-from"), fto=document.getElementById("f-to"), ftype=document.getElementById("f-type"), fbank=document.getElementById("f-bank");
  if(fs){
    fs.oninput = () => { state.txnFilters.search = fs.value; renderFilteredOnly(); };
    ffrom.onchange = () => { state.txnFilters.from = ffrom.value; render(); };
    fto.onchange = () => { state.txnFilters.to = fto.value; render(); };
    ftype.onchange = () => { state.txnFilters.type = ftype.value; render(); };
    fbank.onchange = () => { state.txnFilters.bank = fbank.value; render(); };
  }

  // budgets tab: month selector
  const bms = document.getElementById("budget-month-select");

    const cardId = document.getElementById("emi-card").value;

    const principal = parseFloat(document.getElementById("emi-principal").value)||0;
    const months = parseInt(document.getElementById("emi-months").value,10)||0;
    const monthlyInput = parseFloat(document.getElementById("emi-monthly").value)||0;
    const monthly = monthlyInput>0 ? monthlyInput : (months>0 ? principal/months : 0);

    const startDate = document.getElementById("emi-start").value || todayStr();

  bindForm("form-cloud-connect", () => {

// Drag-to-reorder for account cards. Each group ("normal" banks / "card"
// credit cards) is its own drop zone, so cards only reorder within their group.
function setupAccountDnD(){
  const zones = document.querySelectorAll(".acc-dnd");
  if(!zones.length) return;
  let draggedId = null, draggedGroup = null;

  const clearMarkers = () => document.querySelectorAll(".acc-card.drop-before").forEach(el=>el.classList.remove("drop-before"));

  zones.forEach(zone => {
    const group = zone.dataset.group;

    zone.querySelectorAll(".acc-card").forEach(card => {
      card.ondragstart = (e) => {
        draggedId = card.dataset.bankId; draggedGroup = group;
        card.classList.add("dragging");
        try{ e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", draggedId); }catch(_){}
      };
      card.ondragend = () => { card.classList.remove("dragging"); clearMarkers(); draggedId = null; draggedGroup = null; };
    });

    zone.ondragover = (e) => {
      if(draggedGroup !== group) return; // don't allow dropping across groups
      e.preventDefault();
      const after = zone.querySelector(".acc-card.dragging");
      const target = e.target.closest(".acc-card");
      clearMarkers();
      if(target && target !== after) target.classList.add("drop-before");
    };
    zone.ondrop = (e) => {
      if(draggedGroup !== group) return;
      e.preventDefault();
      const target = e.target.closest(".acc-card");
      const beforeId = target ? target.dataset.bankId : null; // null => drop at end of group
      const id = draggedId;
      clearMarkers();
      if(id) reorderBanks(id, beforeId);
    };
  });
}

function initComparisonChart(fromMonth, toMonth){
  const ctx = document.getElementById("comparisonChart");
  if(!ctx) return;
  const months = getMonthsInRange(fromMonth, toMonth);
  const data = months.map(m => {
    const fromDate = m + "-01";
    const toDate = lastDayOfMonth(m);
    const d = rangeData(fromDate, toDate);
    return { label: monthLabel(m), income: d.income, expense: d.expense };
  });

  const isDark = document.documentElement.getAttribute("data-theme") === "dark" || 
                 document.documentElement.getAttribute("data-theme") === "midnight";
  const textColor = isDark ? "#9BA1A7" : "#79705F";
  const gridColor = isDark ? "rgba(255,255,255,0.08)" : "rgba(27,67,50,0.05)";

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: data.map(d => d.label),
      datasets: [
        {
          label: 'Income',
          data: data.map(d => d.income),
          backgroundColor: '#2D6A4F',
          borderRadius: 4,
        },
        {
          label: 'Expense',
          data: data.map(d => d.expense),
          backgroundColor: '#8B2E2E',
          borderRadius: 4,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'top',
          labels: { color: textColor, font: { size: 11, weight: '600' } }
        },
        tooltip: {
          backgroundColor: isDark ? '#1E2429' : '#FFFDF8',
          titleColor: isDark ? '#E9E7E1' : '#221E1B',
          bodyColor: isDark ? '#E9E7E1' : '#221E1B',
          borderColor: isDark ? '#3B444D' : '#D8CFB6',
          borderWidth: 1,
        }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: { color: textColor, font: { size: 10 } }
        },
        y: {
          beginAtZero: true,
          grid: { color: gridColor },
          ticks: { 
            color: textColor, 
            font: { size: 10 },
            callback: (val) => '৳' + val.toLocaleString()
          }
        }
      }
    }
  });
}

function setupModalExtras(){
  // export/backup textarea: auto-select so the OS's native Copy option appears,
  // since JS clipboard APIs are blocked in some in-app browsers
  const exportTa = document.getElementById("export-text-area");
  if(exportTa){ exportTa.focus(); exportTa.select(); }
  // report: quick month picker auto-fills From/To (1st of month -> today, or last day if a past month)
  const qm = document.getElementById("report-quick-month");
  if(qm){
    qm.onchange = () => {
      const mk = qm.value;
      const type = state.reportType || "summary";
      if(type === "comparison"){
        const from = mk;
        const to = monthKey(todayStr());
        document.getElementById("report-from").value = from;
        document.getElementById("report-to").value = to;
        document.getElementById("report-preview").innerHTML = reportComparisonHTML(from, to);
        initComparisonChart(from, to);
      } else {
        const from = mk + "-01";
        const to = mk === monthKey(todayStr()) ? todayStr() : lastDayOfMonth(mk);
        document.getElementById("report-from").value = from;
        document.getElementById("report-to").value = to;
        document.getElementById("report-preview").innerHTML = reportPreviewHTML(from, to);
      }
    };
  }
  const fromEl = document.getElementById("report-from");
  const toEl = document.getElementById("report-to");
  if(fromEl && toEl && state.reportType === "comparison"){
    initComparisonChart(fromEl.value, toEl.value);
  }
  // EMI: keep Monthly in sync with total/months and show a live preview
  const emiPrincipal = document.getElementById("emi-principal");
  if(emiPrincipal){
    const emiMonths = document.getElementById("emi-months");
    const emiMonthly = document.getElementById("emi-monthly");
    const emiPreview = document.getElementById("emi-preview");
    const emiCardSel = document.getElementById("emi-card");
    const updatePreview = (autoFill) => {
      const p = parseFloat(emiPrincipal.value)||0;
      const m = parseInt(emiMonths.value,10)||0;
      const monthly = parseFloat(emiMonthly.value)||0;
      if(autoFill && p>0 && m>0) emiMonthly.value = Math.round((p/m)*100)/100;
      const per = parseFloat(emiMonthly.value)|| (m>0 ? p/m : 0);
      const card = bankById(emiCardSel ? emiCardSel.value : "");
      const avail = card ? cardAvailable(card) : 0;
      if(emiPreview){
        emiPreview.textContent = (p>0 && m>0 && per>0)
          ? `${taka(per)} × ${m} months = ${taka(p)} · card available after purchase: ${taka(Math.max(0,avail-p))} (now ${taka(avail)})`
          : `Card available now: ${taka(avail)}`;
      }
    };
    emiPrincipal.oninput = () => updatePreview(true);
    emiMonths.oninput = () => updatePreview(true);
    emiMonthly.oninput = () => updatePreview(false);
    if(emiCardSel) emiCardSel.onchange = () => updatePreview(false);
    updatePreview(true);
  }
  // account: toggle credit card fields
  const iscard = document.getElementById("acc-iscard");
  if(iscard){
    iscard.onchange = () => {
      document.getElementById("acc-limit-wrap").style.display = iscard.checked ? "block" : "none";
      document.getElementById("acc-balance-label").firstChild.textContent = iscard.checked ? "Current Balance Owed (৳)" : "Current Balance (৳)";
    };
  }
  // account / category searchable pickers (Transaction form)
  initCombo("txn-bank", state.banks.map(b=>({id:b.id, label:b.name})));
  setupTypeToggleCombo("txn-type-expense","txn-type-income","txn-category", state.expenseCats, state.incomeCats);
  // account searchable pickers (Transfer form)
  initCombo("tr-from", state.banks.map(b=>({id:b.id, label:b.name})));
  initCombo("tr-to", state.banks.map(b=>({id:b.id, label:b.name})));
  // transaction: expense/income toggle swaps category list
  setupTypeToggle("rec-type-expense","rec-type-income","rec-category", state.expenseCats, state.incomeCats);
  // loan toggle
  const lentBtn = document.getElementById("loan-type-lent"), borrowedBtn = document.getElementById("loan-type-borrowed");
  if(lentBtn && borrowedBtn){
    lentBtn.onclick = () => { lentBtn.classList.add("active-neutral"); borrowedBtn.classList.remove("active-neutral"); };
    borrowedBtn.onclick = () => { borrowedBtn.classList.add("active-neutral"); lentBtn.classList.remove("active-neutral"); };
  }
  // restore file input
  const fileInput = document.getElementById("restoreFileInput");
  if(fileInput){ fileInput.onchange = () => { if(fileInput.files[0]) importDataFromFile(fileInput.files[0]); fileInput.value=""; }; }
  const csvInput = document.getElementById("csvFileInput");
  if(csvInput){ csvInput.onchange = () => { if(csvInput.files[0]) importTransactionsFromCSV(csvInput.files[0]); csvInput.value=""; }; }
  updateAIAssistantVisibility();
}
// Reusable searchable combobox: turns a text input + hidden input + list div
// into a fast type-to-filter picker. Tap/focus opens the list, typing filters
// it, tap or Enter picks the top match. Returns {setItems} so callers (like
// the expense/income toggle) can swap the option list without rebuilding.
function initCombo(prefix, items){
  const input = document.getElementById(prefix+"-input");
  const hidden = document.getElementById(prefix);
  const list = document.getElementById(prefix+"-list");
  if(!input || !hidden || !list) return { setItems(){} };

  function renderList(filterText){
    const q = (filterText||"").trim().toLowerCase();
    const filtered = q ? items.filter(it => it.label.toLowerCase().includes(q)) : items;
    list.innerHTML = filtered.length
      ? filtered.map(it => `<div class="combo-item" data-id="${esc(it.id)}" data-label="${esc(it.label)}">${esc(it.label)}</div>`).join("")
      : `<div class="combo-empty">No matches</div>`;
    list.style.display = "block";
  }
  function closeList(){ list.style.display = "none"; }
  function selectItem(id, label){ hidden.value = id; input.value = label; closeList(); }

  input.oninput = () => { hidden.value = ""; renderList(input.value); };
  input.onfocus = () => renderList(input.value);
  input.onclick = () => renderList(input.value);
  input.onkeydown = (e) => {
    if(e.key==="Enter"){
      e.preventDefault();
      const first = list.querySelector(".combo-item");
      if(first) selectItem(first.dataset.id, first.dataset.label);
    } else if(e.key==="Escape"){ closeList(); input.blur(); }
  };
  list.onmousedown = (e) => {
    const item = e.target.closest(".combo-item");
    if(!item) return;
    e.preventDefault(); // keep focus so the click registers before blur clears the list
    selectItem(item.dataset.id, item.dataset.label);
  };
  input.onblur = () => {
    setTimeout(() => {
      closeList();
      if(!hidden.value){
        const exact = items.find(it => it.label.toLowerCase() === input.value.trim().toLowerCase());
        if(exact){ hidden.value = exact.id; input.value = exact.label; }
        else { input.value = ""; }
      }
    }, 150);
  };
  if(hidden.value){
    const cur = items.find(it => it.id === hidden.value);
    if(cur) input.value = cur.label;
  }
  return { setItems(newItems){ items = newItems; hidden.value=""; input.value=""; closeList(); } };
}
function setupTypeToggleCombo(expenseBtnId, incomeBtnId, comboPrefix, expenseCats, incomeCats){
  const eBtn = document.getElementById(expenseBtnId), iBtn = document.getElementById(incomeBtnId);
  if(!eBtn || !iBtn || !document.getElementById(comboPrefix+"-input")) return;
  const initialType = iBtn.classList.contains("active-income") ? "income" : "expense";
  const combo = initCombo(comboPrefix, (initialType==="income"?incomeCats:expenseCats).map(c=>({id:c, label:c})));
  function setType(type){
    if(type==="expense"){ eBtn.classList.add("active-expense"); iBtn.classList.remove("active-income"); combo.setItems(expenseCats.map(c=>({id:c,label:c}))); }
    else { iBtn.classList.add("active-income"); eBtn.classList.remove("active-expense"); combo.setItems(incomeCats.map(c=>({id:c,label:c}))); }
  }
  eBtn.onclick = () => setType("expense");
  iBtn.onclick = () => setType("income");
}
function setupTypeToggle(expenseBtnId, incomeBtnId, selectId, expenseCats, incomeCats){
  const eBtn = document.getElementById(expenseBtnId), iBtn = document.getElementById(incomeBtnId), sel = document.getElementById(selectId);
  if(!eBtn || !iBtn || !sel) return;
  function setType(type){
    if(type==="expense"){ eBtn.classList.add("active-expense"); iBtn.classList.remove("active-income"); sel.innerHTML = expenseCats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join(""); }
    else { iBtn.classList.add("active-income"); eBtn.classList.remove("active-expense"); sel.innerHTML = incomeCats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join(""); }
  }
  eBtn.onclick = () => setType("expense");
  iBtn.onclick = () => setType("income");
}
